                                                  ForAll(colServiceWizardFields As wizardField, With({serviceFieldKey: serviceCode & "_" & wizardField.FieldKey}, If(IsBlank(LookUp(ev_sp_list_servicefield_definitions, ServiceFieldKey = serviceFieldKey)), Patch(ev_sp_list_servicefield_definitions, Defaults(ev_sp_list_servicefield_definitions), {Title: wizardField.Title, ServiceFieldKey: serviceFieldKey, ServiceCode: serviceCode, FieldKey: wizardField.FieldKey, FieldType: wizardField.FieldType}))));
                                                  ForAll(colServiceWizardOptions As wizardOption, With({serviceOptionKey: serviceCode & "_" & wizardOption.FieldKey & "_" & Upper(Substitute(Trim(wizardOption.Value), " ", "_"))}, If(IsBlank(LookUp(ev_sp_list_servicefield_options, OptionKey = serviceOptionKey)), Patch(ev_sp_list_servicefield_options, Defaults(ev_sp_list_servicefield_options), {Title: wizardOption.Title, OptionKey: serviceOptionKey, ServiceCode: serviceCode, FieldKey: wizardOption.FieldKey, Value: wizardOption.Value, Active: true}))));
                                                  Refresh(ev_sp_list_service_catalog);
