Screens:
  service_wizard_screen:
    Properties:
      Fill: =RGBA(242, 244, 248, 1)
      LoadingSpinnerColor: =RGBA(87, 35, 129, 1)
      OnVisible: |-
        =Refresh(ev_sp_list_service_catalog);
        Refresh(ev_sp_list_servicefield_definitions);
        Refresh(ev_sp_list_servicefield_options);
        Set(varServiceWizardStep, 1);
        Set(varWizardTemplate, "General");
         Set(varWizardPublished, false);
         Set(varServiceWizardSubmitting, false);
         Set(varServiceWizardChoiceFieldKey, Blank());
        Clear(colServiceWizardFields);
        Clear(colServiceWizardOptions)
    Children:
      - sws_root:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(242, 244, 248, 1)
            Height: =Parent.Height
            LayoutDirection: =LayoutDirection.Vertical
            Width: =Parent.Width
          Children:
            - sws_header:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  BorderColor: =RGBA(226, 232, 240, 1)
                  BorderThickness: =1
                  DropShadow: =DropShadow.Semilight
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  Height: =72
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =14
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =12
                  PaddingLeft: =28
                  PaddingRight: =28
                  PaddingTop: =12
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width
                Children:
                  - sws_header_back:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: =fxTranslate("BackToServiceCatalog", "Zurück zum Servicekatalog")
                        Appearance: =ButtonAppearance.Secondary
                        Height: =40
                        Icon: ="ChevronLeft"
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Select(sws_nav_parent)
                        Text: =fxTranslate("Back", "Zurück")
                        Width: =128
                  - sws_header_title:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(17, 24, 39, 1)
                        FillPortions: =1
                        FontWeight: =FontWeight.Bold
                        Height: =30
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =22
                        Text: =fxTranslate("ServiceTeam", "Service Team")
                        Wrap: =false
                  - sws_language_selector:
                      Control: ModernDropdown
                      Properties:
                        AccessibleLabel: =fxTranslate("SelectLanguage", "Sprache auswählen")
                        Default: |-
                          =LookUp(Table({Code: "de", Label: "Deutsch"}, {Code: "en", Label: "English"}), Code = Coalesce(varCurrentLanguage, "de"))
                        Height: =34
                        ItemDisplayText: =ThisItem.Label
                        Items: |-
                          =Table({Code: "de", Label: "Deutsch"}, {Code: "en", Label: "English"})
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnChange: =Set(varCurrentLanguage, Self.Selected.Code)
                        Width: =120
                  - sws_header_cancel:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: =fxTranslate("CancelServiceWizard", "Service-Erstellung abbrechen")
                        Appearance: =ButtonAppearance.Secondary
                        Height: =40
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Select(sws_nav_parent)
                        Text: =fxTranslate("Cancel", "Abbrechen")
                        Width: =110
            - sws_breadcrumb:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  BorderColor: =RGBA(226, 232, 240, 1)
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(248, 250, 252, 1)
                  FillPortions: =0
                  Height: =42
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =8
                  LayoutMinHeight: =42
                  LayoutMinWidth: =0
                  PaddingLeft: =If(App.Width < 600, 12, 28)
                  PaddingRight: =If(App.Width < 600, 12, 28)
                  Width: =Parent.Width
                Children:
                  - sws_home:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: =fxTranslate("Home", "Zur Startseite")
                        Appearance: =ButtonAppearance.Subtle
                        DisplayMode: =If(varServiceWizardSubmitting, DisplayMode.Disabled, DisplayMode.Edit)
                        Height: =32
                        Icon: ="Home"
                        OnSelect: |-
                          =With(
                              {
                                  hasDraft: varServiceWizardStep > 1
                                      Or !IsBlank(Trim(sws_title.Text))
                                      Or !IsBlank(Trim(sws_code.Text))
                                      Or !IsBlank(Trim(sws_category.Text))
                                      Or !IsBlank(Trim(sws_description.Text))
                                      Or !IsBlank(Trim(sws_queue.Text))
                                      Or !IsEmpty(colServiceWizardFields)
                                      Or !IsEmpty(colServiceWizardOptions)
                              },
                              If(
                                  !hasDraft || Confirm(
                                      fxTranslate("DiscardServiceDraftAndGoHome", "Service-Entwurf verwerfen und zur Startseite wechseln?"),
                                      {
                                          Title: fxTranslate("GoToHome", "Zur Startseite"),
                                          ConfirmButton: fxTranslate("Discard", "Verwerfen"),
                                          CancelButton: fxTranslate("Cancel", "Abbrechen")
                                      }
                                  ),
                                  Reset(sws_title);
                                  Reset(sws_code);
                                  Reset(sws_category);
                                  Reset(sws_description);
                                  Reset(sws_queue);
                                  Clear(colServiceWizardFields);
                                  Clear(colServiceWizardOptions);
                                  Navigate(dashboard_screen, ScreenTransition.CoverRight)
                              )
                          )
                        Text: =If(App.Width < 600, fxTranslate("HomeShort", "Start"), fxTranslate("Home", "Startseite"))
                        Width: =If(App.Width < 600, 80, 120)
                  - sws_nav_separator_1:
                      Control: ModernText
                      Properties:
                        Align: =Align.Center
                        Color: =RGBA(148, 163, 184, 1)
                        Height: =24
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =13
                        Text: =">"
                        Width: =12
                  - sws_nav_parent:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: =fxTranslate("ServiceCatalog", "Servicekatalog")
                        Appearance: =ButtonAppearance.Subtle
                        DisplayMode: =If(varServiceWizardSubmitting, DisplayMode.Disabled, DisplayMode.Edit)
                        Height: =32
                        OnSelect: |-
                          =With(
                              {
                                  hasDraft: varServiceWizardStep > 1
                                      Or !IsBlank(Trim(sws_title.Text))
                                      Or !IsBlank(Trim(sws_code.Text))
                                      Or !IsBlank(Trim(sws_category.Text))
                                      Or !IsBlank(Trim(sws_description.Text))
                                      Or !IsBlank(Trim(sws_queue.Text))
                                      Or !IsEmpty(colServiceWizardFields)
                                      Or !IsEmpty(colServiceWizardOptions)
                              },
                              If(
                                  !hasDraft || Confirm(
                                      fxTranslate("DiscardServiceDraftAndGoBack", "Service-Entwurf verwerfen und zum Servicekatalog zurückkehren?"),
                                      {
                                          Title: fxTranslate("BackToServiceCatalog", "Zum Servicekatalog"),
                                          ConfirmButton: fxTranslate("Discard", "Verwerfen"),
                                          CancelButton: fxTranslate("Cancel", "Abbrechen")
                                      }
                                  ),
                                  Reset(sws_title);
                                  Reset(sws_code);
                                  Reset(sws_category);
                                  Reset(sws_description);
                                  Reset(sws_queue);
                                  Clear(colServiceWizardFields);
                                  Clear(colServiceWizardOptions);
                                  Navigate(service_catalog_screen, ScreenTransition.CoverRight)
                              )
                          )
                        Text: =fxTranslate("ServiceCatalog", "Servicekatalog")
                        Visible: =App.Width >= 600
                        Width: =130
                  - sws_nav_separator_2:
                      Control: ModernText
                      Properties:
                        Align: =Align.Center
                        Color: =RGBA(148, 163, 184, 1)
                        Height: =24
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =13
                        Text: =">"
                        Visible: =App.Width >= 600
                        Width: =12
                  - sws_nav_current:
                      Control: ModernText
                      Properties:
                        Color: =RGBA(51, 65, 85, 1)
                        FillPortions: =1
                        FontWeight: =FontWeight.Semibold
                        Height: =24
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =13
                        Text: =fxTranslate("ManageServices", "Services verwalten")
                        Wrap: =false
            - sws_agent_content:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =16
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  PaddingBottom: =28
                  PaddingLeft: =28
                  PaddingRight: =28
                  PaddingTop: =24
                  Visible: =fxIsAgentExperience
                  Width: =Parent.Width
                Children:
                  - sws_intro:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =54
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =2
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Width: =Parent.Width
                      Children:
                        - sws_intro_title:
                            Control: ModernText
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              AutoHeight: =true
                              Color: =RGBA(17, 24, 39, 1)
                              FontWeight: =FontWeight.Bold
                              Height: =28
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =24
                              Text: =fxTranslate("CreateNewService", "Neuen Service erstellen")
                              Wrap: =false
                        - sws_intro_detail:
                            Control: ModernText
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =RGBA(82, 94, 115, 1)
                              Height: =20
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =13
                              Text: =fxTranslate("ServiceWizardIntro", "Konfigurieren Sie einen neuen Service, seine Felder und Auswahlwerte.")
                              Wrap: =false
                  - sws_stepper:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =RGBA(226, 232, 240, 1)
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Height: =48
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =8
                        PaddingLeft: =12
                        PaddingRight: =12
                        PaddingTop: =8
                        RadiusBottomLeft: =10
                        RadiusBottomRight: =10
                        RadiusTopLeft: =10
                        RadiusTopRight: =10
                        Width: =Parent.Width
                      Children:
                        - sws_step_1_indicator:
                            Control: ModernText
                            Properties:
                              Align: =Align.Center
                              Color: =If(varServiceWizardStep = 1, RGBA(255, 255, 255, 1), RGBA(87, 35, 129, 1))
                              Fill: =If(varServiceWizardStep = 1, RGBA(87, 35, 129, 1), RGBA(246, 240, 252, 1))
                              FillPortions: =1
                              FontWeight: =FontWeight.Semibold
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =6
                              PaddingRight: =6
                              PaddingTop: =0
                              RadiusBottomLeft: =6
                              RadiusBottomRight: =6
                              RadiusTopLeft: =6
                              RadiusTopRight: =6
                              Size: =12
                              Text: ="1  " & fxTranslate("ServiceWizardStepDetails", "Basisdaten")
                              Wrap: =false
                        - sws_step_2_indicator:
                            Control: ModernText
                            Properties:
                              Align: =Align.Center
                              Color: =If(varServiceWizardStep = 2, RGBA(255, 255, 255, 1), RGBA(87, 35, 129, 1))
                              Fill: =If(varServiceWizardStep = 2, RGBA(87, 35, 129, 1), RGBA(246, 240, 252, 1))
                              FillPortions: =1
                              FontWeight: =FontWeight.Semibold
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =6
                              PaddingRight: =6
                              PaddingTop: =0
                              RadiusBottomLeft: =6
                              RadiusBottomRight: =6
                              RadiusTopLeft: =6
                              RadiusTopRight: =6
                              Size: =12
                              Text: ="2  " & fxTranslate("ServiceWizardStepFields", "Felder")
                              Wrap: =false
                        - sws_step_3_indicator:
                            Control: ModernText
                            Properties:
                              Align: =Align.Center
                              Color: =If(varServiceWizardStep = 3, RGBA(255, 255, 255, 1), RGBA(87, 35, 129, 1))
                              Fill: =If(varServiceWizardStep = 3, RGBA(87, 35, 129, 1), RGBA(246, 240, 252, 1))
                              FillPortions: =1
                              FontWeight: =FontWeight.Semibold
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =6
                              PaddingRight: =6
                              PaddingTop: =0
                              RadiusBottomLeft: =6
                              RadiusBottomRight: =6
                              RadiusTopLeft: =6
                              RadiusTopRight: =6
                              Size: =12
                              Text: ="3  " & fxTranslate("ServiceWizardStepOptions", "Auswahlwerte")
                              Wrap: =false
                        - sws_step_4_indicator:
                            Control: ModernText
                            Properties:
                              Align: =Align.Center
                              Color: =If(varServiceWizardStep = 4, RGBA(255, 255, 255, 1), RGBA(87, 35, 129, 1))
                              Fill: =If(varServiceWizardStep = 4, RGBA(87, 35, 129, 1), RGBA(246, 240, 252, 1))
                              FillPortions: =1
                              FontWeight: =FontWeight.Semibold
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =6
                              PaddingRight: =6
                              PaddingTop: =0
                              RadiusBottomLeft: =6
                              RadiusBottomRight: =6
                              RadiusTopLeft: =6
                              RadiusTopRight: =6
                              Size: =12
                              Text: ="4  " & fxTranslate("ServiceWizardStepReview", "Prüfen & Speichern")
                              Wrap: =false
                  - sws_step_1:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =RGBA(226, 232, 240, 1)
                        BorderThickness: =1
                        DropShadow: =DropShadow.Semilight
                        Fill: =RGBA(255, 255, 255, 1)
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =12
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =22
                        PaddingLeft: =22
                        PaddingRight: =22
                        PaddingTop: =22
                        RadiusBottomLeft: =12
                        RadiusBottomRight: =12
                        RadiusTopLeft: =12
                        RadiusTopRight: =12
                        Visible: =varServiceWizardStep = 1
                        Width: =Parent.Width
                      Children:
                        - sws_step_1_title:
                            Control: ModernText
                            Properties:
                              Color: =RGBA(17, 24, 39, 1)
                              FontWeight: =FontWeight.Bold
                              Height: =28
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =18
                              Text: =fxTranslate("ServiceDetails", "Service-Details")
                              Wrap: =false
                        - sws_title_row:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =42
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =16
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Width: =Parent.Width
                            Children:
                              - sws_title_label:
                                  Control: ModernText
                                  Properties:
                                    Color: =RGBA(51, 65, 85, 1)
                                    FontWeight: =FontWeight.Semibold
                                    Height: =22
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =13
                                    Text: =fxTranslate("ServiceTitleRequired", "Service-Titel *")
                                    Width: =210
                                    Wrap: =false
                              - sws_title:
                                  Control: ModernTextInput
                                  Properties:
                                    AccessibleLabel: =fxTranslate("ServiceTitleRequired", "Service-Titel *")
                                    Appearance: =Appearance.Outline
                                    FillPortions: =1
                                    Height: =38
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    Placeholder: =fxTranslate("ServiceTitlePlaceholder", "Service-Titel eingeben...")
                        - sws_code_row:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =42
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =16
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Width: =Parent.Width
                            Children:
                              - sws_code_label:
                                  Control: ModernText
                                  Properties:
                                    Color: =RGBA(51, 65, 85, 1)
                                    FontWeight: =FontWeight.Semibold
                                    Height: =22
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =13
                                    Text: =fxTranslate("ServiceCodeRequired", "Service-Code *")
                                    Width: =210
                                    Wrap: =false
                              - sws_code:
                                  Control: ModernTextInput
                                  Properties:
                                    AccessibleLabel: =fxTranslate("ServiceCodeRequired", "Service-Code *")
                                    Appearance: =Appearance.Outline
                                    FillPortions: =1
                                    Height: =38
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    Placeholder: =fxTranslate("ServiceCodePlaceholder", "z. B. SOFTWARE_REQUEST")
                        - sws_category_row:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =42
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =16
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Width: =Parent.Width
                            Children:
                              - sws_category_label:
                                  Control: ModernText
                                  Properties:
                                    Color: =RGBA(51, 65, 85, 1)
                                    FontWeight: =FontWeight.Semibold
                                    Height: =22
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =13
                                    Text: =fxTranslate("ServiceCategory", "Kategorie")
                                    Width: =210
                                    Wrap: =false
                              - sws_category:
                                  Control: ModernTextInput
                                  Properties:
                                    AccessibleLabel: =fxTranslate("ServiceCategory", "Kategorie")
                                    Appearance: =Appearance.Outline
                                    FillPortions: =1
                                    Height: =38
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    Placeholder: =fxTranslate("ServiceCategoryPlaceholder", "Kategorie eingeben...")
                        - sws_description_row:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =92
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =16
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Width: =Parent.Width
                            Children:
                              - sws_description_label:
                                  Control: ModernText
                                  Properties:
                                    Color: =RGBA(51, 65, 85, 1)
                                    FontWeight: =FontWeight.Semibold
                                    Height: =22
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =13
                                    Text: =fxTranslate("ServiceDescription", "Beschreibung")
                                    Width: =210
                                    Wrap: =false
                              - sws_description:
                                  Control: ModernTextInput
                                  Properties:
                                    AccessibleLabel: =fxTranslate("ServiceDescription", "Beschreibung")
                                    Appearance: =Appearance.Outline
                                    FillPortions: =1
                                    Height: =84
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    Placeholder: =fxTranslate("ServiceDescriptionPlaceholder", "Service und Zielgruppe beschreiben...")
                                    Type: =TextInputType.Multiline
                        - sws_queue_row:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =42
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =16
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Width: =Parent.Width
                            Children:
                              - sws_queue_label:
                                  Control: ModernText
                                  Properties:
                                    Color: =RGBA(51, 65, 85, 1)
                                    FontWeight: =FontWeight.Semibold
                                    Height: =22
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =13
                                    Text: =fxTranslate("FulfillmentQueueRequired", "Fulfillment-Queue *")
                                    Width: =210
                                    Wrap: =false
                              - sws_queue:
                                  Control: ModernTextInput
                                  Properties:
                                    AccessibleLabel: =fxTranslate("FulfillmentQueueRequired", "Fulfillment-Queue *")
                                    Appearance: =Appearance.Outline
                                    FillPortions: =1
                                    Height: =38
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    Placeholder: =fxTranslate("FulfillmentQueuePlaceholder", "z. B. IT-SERVICE-DESK")
                        - sws_priority_row:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =42
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =16
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Width: =Parent.Width
                            Children:
                              - sws_priority_label:
                                  Control: ModernText
                                  Properties:
                                    Color: =RGBA(51, 65, 85, 1)
                                    FontWeight: =FontWeight.Semibold
                                    Height: =22
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =13
                                    Text: =fxTranslate("DefaultServicePriority", "Standardpriorität")
                                    Width: =210
                                    Wrap: =false
                              - sws_priority:
                                  Control: ModernDropdown
                                  Properties:
                                    AccessibleLabel: =fxTranslate("DefaultServicePriority", "Standardpriorität")
                                    Default: |-
                                      =LookUp(Table({Value: "Standard", Label: fxTranslate("PriorityStandard", "Standard")}, {Value: "Hoch", Label: fxTranslate("PriorityHigh", "Hoch")}, {Value: "Mittel", Label: fxTranslate("PriorityMedium", "Mittel")}, {Value: "Niedrig", Label: fxTranslate("PriorityLow", "Niedrig")}), Value = "Standard")
                                    FillPortions: =1
                                    Height: =38
                                    ItemDisplayText: =ThisItem.Label
                                    Items: |-
                                      =Table({Value: "Standard", Label: fxTranslate("PriorityStandard", "Standard")}, {Value: "Hoch", Label: fxTranslate("PriorityHigh", "Hoch")}, {Value: "Mittel", Label: fxTranslate("PriorityMedium", "Mittel")}, {Value: "Niedrig", Label: fxTranslate("PriorityLow", "Niedrig")})
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                        - sws_template_row:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =42
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =16
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Width: =Parent.Width
                            Children:
                              - sws_template_label:
                                  Control: ModernText
                                  Properties:
                                    Color: =RGBA(51, 65, 85, 1)
                                    FontWeight: =FontWeight.Semibold
                                    Height: =22
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
