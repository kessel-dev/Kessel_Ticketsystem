                                        Properties:
                                          DataSource: =ev_sp_list_comments
                                          DefaultMode: =FormMode.New
                                          Height: =If(varShowCommentAttachmentTray Or !IsEmpty(att_comment_upload.Attachments), 72, 0)
                                          OnFailure: |-
                                            =Set(varCommentSubmitting, false);
                                            Notify(Substitute(fxTranslate("CommentSendFailed", "Kommentar konnte nicht gesendet werden: {0}"), "{0}", Coalesce(form_comment_new.Error, fxTranslate("UnknownError", "Unbekannter Fehler."))), NotificationType.Error, 5000)
                                          OnSuccess: |-
                                            =Set(varCommentSubmitting, false);
                                             Clear(colNotificationRecipients);
                                             If(
                                                 Coalesce(varCommentType, "Chat") <> "Internal",
                                                 Collect(colNotificationRecipients, {Email: varCurrentTicket.RequestedBy.Email});
                                                 Collect(colNotificationRecipients, {Email: varCurrentTicket.'Zugewiesen an'.Email});
                                                 ForAll(
                                                     varCurrentTicket.Beobachter As observer,
                                                     Collect(colNotificationRecipients, {Email: observer.Email})
                                                 )
                                             );
                                             ForAll(
                                                 Filter(
                                                     ev_sp_list_config_members,
                                                     Active && (Role.Value = "Admin" || Role.Value = "IT-Agent")
                                                 ) As member,
                                                 Collect(colNotificationRecipients, {Email: member.Titel})
                                             );
                                             IfError(
                                                 ForAll(
                                                     Distinct(
                                                         Filter(
                                                             colNotificationRecipients,
                                                             !IsBlank(Email) && Email <> fxCurrentUser.Email
                                                         ),
                                                         Email
                                                     ) As recipient,
                                                     Patch(
                                                         ev_sp_list_notifications,
                                                         Defaults(ev_sp_list_notifications),
                                                         {
                                                              Title: Substitute(fxTranslate("CommentOnTicketTemplate", "Kommentar zu Ticket {0}"), "{0}", varCurrentTicket.Titel),
                                                             RecipientEmail: recipient.Value,
                                                             TicketId: varCurrentTicket.ID,
                                                             CommentId: form_comment_new.LastSubmit.ID,
                                                             CreatedAt: Today(),
                                                             IsRead: false,
                                                             NotificationType: Coalesce(varCommentType, "Chat")
                                                         }
                                                     )
                                                 ),
                                                  Notify(fxTranslate("CommentSentNotificationsFailed", "Kommentar wurde gesendet, aber einzelne Benachrichtigungen konnten nicht erstellt werden."), NotificationType.Warning, 5000)
                                             );
                                             Clear(colNotificationRecipients);
                                             Reset(inp_comment);
                                             ResetForm(form_comment_new);
                                             Set(varCommentType, "Chat");
                                             Set(varShowCommentAttachmentTray, false);
