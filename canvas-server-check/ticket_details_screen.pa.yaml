                                                Height: =40
                                                Icon: ="Send"
                                                Layout: =ButtonLayout.IconOnly
                                                OnSelect: |-
                                                  =If(
                                                      !fxCanCommentOnCurrentTicket,
                                                      Notify(fxTranslate("NoPermissionComment", "Keine Berechtigung zum Kommentieren."), NotificationType.Error, 3000),
                                                      If(
                                                           !IsBlank(Trim(inp_comment.Text)) Or !IsEmpty(att_comment_upload.Attachments),
                                                           Set(varCommentDraft, Trim(inp_comment.Text));
                                                           Set(varCommentSubmitting, true);
                                                           SubmitForm(form_comment_new)
                                                      )
                                                  )
