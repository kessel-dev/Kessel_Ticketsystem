                                              Control: ModernButton
                                              Properties:
                                                AccessibleLabel: =fxTranslate("ChangeCommentType", "Kommentartyp wechseln")
                                                Appearance: =If(Coalesce(varCommentType, "Chat") = "Internal", ButtonAppearance.Primary, ButtonAppearance.Secondary)
                                                DisplayMode: =If(varCommentSubmitting, DisplayMode.Disabled, DisplayMode.Edit)
                                                Height: =40
