Screens:
  Screen2:
    Children:
      - ApprScroll1:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(255, 255, 255, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingBottom: =24
            Width: =Parent.Width
          Children:
            - TopNav2:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  Height: =If(App.Width < 640, 104, 56)
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  Width: =Parent.Width
                Children:
                  - TitleRow2:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Height: =56
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =12
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingLeft: =If(App.Width < 640, 16, 24)
                        PaddingRight: =If(App.Width < 640, 16, 24)
                        Width: =Parent.Width
                      Children:
                        - AppTitle2:
                            Control: ModernText
                            Properties:
                              FillPortions: =If(App.Width < 640, 1, 0)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PaddingBottom: =0
                              PaddingTop: =0
                              Size: =If(App.Width < 640, 13, 16)
                              Text: ="Contoso Art Studio"
                              Width: =If(App.Width < 640, 0, 200)
                        - NavTabsDesktop2:
                            Control: ModernTabList
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              Appearance: =TabListAppearance.Subtle
                              Default: |-
                                ={Value: "Gallery"}
                              FillPortions: =1
                              Height: =56
                              Items: =["Home", "Resources", "Events", "Gallery"]
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              Visible: =App.Width >= 640
                        - IconChat2:
                            Control: ModernIcon
                            Properties:
                              Height: =24
                              Icon: =Icon.Message
                              IconColor: =RGBA(0, 0, 0, 1)
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              Width: =24
                        - IconShare2:
                            Control: ModernIcon
                            Properties:
                              Height: =24
                              Icon: =Icon.Share
                              IconColor: =RGBA(0, 0, 0, 1)
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              Width: =24
                        - IconSettings2:
                            Control: ModernIcon
                            Properties:
                              Height: =24
                              Icon: =Icon.Settings
                              IconColor: =RGBA(0, 0, 0, 1)
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              Width: =24
                        - Avatar2:
                            Control: Avatar
                            Properties:
                              Height: =32
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              Width: =32
                  - NavTabsMobile2:
                      Control: ModernTabList
                      Properties:
                        Appearance: =TabListAppearance.Subtle
                        BasePaletteColor: =RGBA(0, 65, 179, 1)
                        Default: |-
                          ={Value: "Gallery"}
                        Height: =If(App.Width < 640, 48, 0)
                        Items: |-
                          =Table({Value: "Home"}, {Value: "Resources"}, {Value: "Events"}, {Value: "Gallery"})
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        Width: =Parent.Width
            - NavDivider2:
                Control: ModernText
                Properties:
                  Fill: =RGBA(237, 237, 237, 1)
                  Height: =2
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =0
                  PaddingTop: =0
                  Text: =""
                  Width: =Parent.Width
            - TitleBand1:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  Height: =If(App.Width < 640, 152, 128)
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =8
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =12
                  PaddingLeft: =If(App.Width < 640, 16, 40)
                  PaddingRight: =If(App.Width < 640, 16, 40)
                  PaddingTop: =32
                  Width: =Parent.Width
                Children:
                  - PageTitle1:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        FontWeight: =FontWeight.Bold
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingBottom: =0
                        PaddingTop: =0
                        Size: =If(App.Width < 640, 22, 28)
                        Text: ="Request a review"
                        Width: =Parent.Width - If(App.Width < 640, 32, 80)
                  - PageSubtitle1:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(96, 94, 92, 1)
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingBottom: =0
                        PaddingTop: =0
                        Size: =If(App.Width < 640, 12, 14)
                        Text: ="Send your piece for approval and track where it is in the review process."
                        Width: =Parent.Width - If(App.Width < 640, 32, 80)
            - TwoColRow1:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  Height: =If(App.Width < 640, 760, 560)
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =If(App.Width < 640, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                  LayoutGap: =24
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =24
                  PaddingLeft: =If(App.Width < 640, 16, 40)
                  PaddingRight: =If(App.Width < 640, 16, 40)
                  Width: =Parent.Width
                Children:
                  - FormCard1:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =7
                        Height: =If(App.Width < 640, 460, 512)
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =8
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingBottom: =20
                        PaddingLeft: =20
                        PaddingRight: =20
                        PaddingTop: =20
                      Children:
                        - FormHeading1:
                            Control: ModernText
                            Properties:
                              FontWeight: =FontWeight.Semibold
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PaddingBottom: =0
                              PaddingTop: =0
                              Size: =18
                              Text: ="Submission details"
                              Width: =Parent.Width - 40
                        - ReviewForm1:
                            Control: Form
                            Layout: Vertical
                            Properties:
                              DataSource: |-
                                =Table({Title: "Sunrise Study", Medium: "Watercolor", Reviewer: "Ava Mitchell", DueDate: Date(2026, 2, 12), Priority: "Standard", Notes: "Please review the warm gradient transitions and the harbor composition."})
                              Item: |-
                                =First(Table({Title: "Sunrise Study", Medium: "Watercolor", Reviewer: "Ava Mitchell", DueDate: Date(2026, 2, 12), Priority: "Standard", Notes: "Please review the warm gradient transitions and the harbor composition."}))
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              NumberOfColumns: =If(App.Width < 640, 1, 2)
                        - ApprButtonRow1:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =56
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =12
                              LayoutJustifyContent: =LayoutJustifyContent.End
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PaddingBottom: =8
                              PaddingLeft: =8
                              PaddingRight: =8
                              PaddingTop: =8
                              Width: =Parent.Width - 40
                            Children:
                              - SendReviewBtnR1:
                                  Control: ModernButton
                                  Properties:
                                    Height: =40
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    Text: ="Send for review"
                                    Width: =160
                              - CancelReviewBtnR1:
                                  Control: ModernButton
                                  Properties:
                                    Appearance: =ButtonAppearance.Secondary
                                    Height: =40
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    Text: ="Cancel"
                                    Width: =120
                  - ReviewersCard1:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(250, 250, 250, 1)
                        FillPortions: =3
                        Height: =If(App.Width < 640, 260, 512)
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =4
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingBottom: =16
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =16
                        Visible: =App.Width >= 640
                        Width: =If(App.Width < 640, Parent.Width - 32, 0)
                      Children:
                        - ReviewersHeading1:
                            Control: ModernText
                            Properties:
                              FontWeight: =FontWeight.Semibold
                              Height: =28
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PaddingBottom: =0
                              PaddingTop: =0
                              Size: =16
                              Text: ="Approval flow"
                              Width: =Parent.Width - 32
                        - ReviewersSub1:
                            Control: ModernText
                            Properties:
                              Color: =RGBA(96, 94, 92, 1)
                              Height: =20
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PaddingBottom: =0
                              PaddingTop: =0
                              Size: =12
                              Text: ="Step 2 of 4 · Curator review in progress"
                              Width: =Parent.Width - 32
                        - gal_activity:
                            Control: Gallery
                            Variant: BrowseLayout_Flexible_SocialFeed_ver5.0
                            Properties:
                              AccessibleLabel: =fxTranslate("ActivityHistory", "Aktivitätsverlauf")
                              Fill: =RGBA(255, 255, 255, 1)
                              Height: =Max(110, Parent.Height - con_message_composer.Height - row_activity_title.Height - 28)
                              Items: |-
                                =SortByColumns(
                                    If(
                                        fxCanSeeInternalNotes,
                                        If(
                                            IsBlank(varActivityFilter) || varActivityFilter = "Alle",
                                            Filter(
                                                ev_sp_list_comments,
                                                TicketNumber = Text(varCurrentTicket.ID)
                                            ),
                                            Filter(
                                                ev_sp_list_comments,
                                                TicketNumber = Text(varCurrentTicket.ID) &&
                                                CommentType.Value = varActivityFilter
                                            )
                                        ),
                                        If(
                                            IsBlank(varActivityFilter) || varActivityFilter = "Alle",
                                            Filter(
                                                ev_sp_list_comments,
                                                TicketNumber = Text(varCurrentTicket.ID) &&
                                                IsInternal = false
                                            ),
                                            Filter(
                                                ev_sp_list_comments,
                                                TicketNumber = Text(varCurrentTicket.ID) &&
                                                IsInternal = false &&
                                                CommentType.Value = varActivityFilter
                                            )
                                        )
                                    ),
                                    "ID",
                                    SortOrder.Ascending
                                )
                              LayoutMinHeight: =110
                              LayoutMinWidth: =16
                              TabIndex: =0
                              TemplatePadding: =6
                              Visible: =(App.Width >= 600 || varActivityExpanded) && !IsEmpty(gal_activity.AllItems)
                              Width: =Parent.Width
                            Children:
                              - line_activity_timeline:
                                  Control: Rectangle
                                  Properties:
                                    Fill: =RGBA(203, 213, 225, 1)
                                    Height: =Max(0, card_activity_item.Height - 26)
                                    OnSelect: =Select(Parent)
                                    Visible: =App.Width >= 600
                                    Width: =2
                              - lbl_timeline_dot:
                                  Control: ModernText
                                  Properties:
                                    Align: =Align.Center
                                    Color: =RGBA(255, 255, 255, 1)
                                    Fill: |-
                                      =Switch(
                                          Coalesce(ThisItem.CommentType.Value, "Chat"),
                                          "Internal",
                                              RGBA(217, 119, 6, 1),
                                          "System Information",
                                              RGBA(37, 99, 235, 1),
                                          RGBA(111, 66, 193, 1)
                                      )
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Bold
                                    Height: =34
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    RadiusBottomLeft: =17
                                    RadiusBottomRight: =17
                                    RadiusTopLeft: =17
                                    RadiusTopRight: =17
                                    Size: =12
                                    Text: |-
                                      =Upper(
                                          Left(
                                              Coalesce(ThisItem.CommentBy, "K"),
                                              1
                                          ) &
                                          Mid(
                                              Coalesce(ThisItem.CommentBy, "A"),
                                              2,
                                              1
                                          )
                                      )
                                    Visible: =App.Width >= 600
                                    Width: =34
                              - card_activity_item:
                                  Control: GroupContainer
                                  Variant: ManualLayout
                                  Properties:
                                    BorderColor: |-
                                      =If(
                                          App.Width < 600,
                                          Switch(
                                              Coalesce(ThisItem.CommentType.Value, "Chat"),
                                              "Internal",
                                                  RGBA(251, 191, 36, 1),
                                              "System Information",
                                                  RGBA(147, 197, 253, 1),
                                              If(
                                                  ThisItem.CommentByClaims = fxCurrentUser.Claims,
                                                  RGBA(134, 239, 172, 1),
                                                  RGBA(226, 232, 240, 1)
                                              )
                                          ),
                                          Switch(
                                              Coalesce(ThisItem.CommentType.Value, "Chat"),
                                              "Internal",
                                                  RGBA(251, 191, 36, 1),
                                              "System Information",
                                                  RGBA(147, 197, 253, 1),
                                              RGBA(226, 232, 240, 1)
                                          )
                                      )
                                    BorderThickness: =1
                                    DropShadow: =DropShadow.None
                                    Fill: |-
                                      =If(
                                          App.Width < 600,
                                          Switch(
                                              Coalesce(ThisItem.CommentType.Value, "Chat"),
                                              "Internal",
                                                  RGBA(255, 251, 235, 1),
                                              "System Information",
                                                  RGBA(239, 246, 255, 1),
                                              If(
                                                  ThisItem.CommentByClaims = fxCurrentUser.Claims,
                                                  RGBA(220, 252, 231, 1),
                                                  RGBA(255, 255, 255, 1)
                                              )
                                          ),
                                          Switch(
                                              Coalesce(ThisItem.CommentType.Value, "Chat"),
                                              "Internal",
                                                  RGBA(255, 251, 235, 1),
                                              "System Information",
                                                  RGBA(239, 246, 255, 1),
                                              RGBA(255, 255, 255, 1)
                                          )
                                      )
                                    Height: |-
                                      =If(
                                          att_activity_item_attachments.Visible,
                                          att_activity_item_attachments.Y +
                                          att_activity_item_attachments.Height +
                                          10,
                                          lbl_activity_body.Y +
                                          lbl_activity_body.Height +
                                          10
                                      )
                                    RadiusBottomLeft: =If(App.Width < 600, 14, 6)
                                    RadiusBottomRight: =If(App.Width < 600, 14, 6)
                                    RadiusTopLeft: =If(App.Width < 600, 14, 6)
                                    RadiusTopRight: =If(App.Width < 600, 14, 6)
                                    Width: |-
                                      =If(
                                          App.Width < 600,
                                          Parent.TemplateWidth * 0.78,
                                          Parent.TemplateWidth - 64
                                      )
                                    X: =1
                                  Children:
                                    - lbl_activity_meta:
                                        Control: Label
                                        Properties:
                                          Align: |-
                                            =If(
                                                App.Width < 600 &&
                                                ThisItem.CommentByClaims = fxCurrentUser.Claims,
                                                Align.Right,
                                                Align.Left
                                            )
                                          AutoHeight: =true
                                          BorderColor: =RGBA(0, 0, 0, 0)
                                          Color: =RGBA(100, 116, 139, 1)
                                          Font: =Font.'Segoe UI'
                                          Height: =18
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =11
                                          Text: |-
                                            =Coalesce(
                                                ThisItem.CommentBy,
                                                fxTranslate("Support", "Support")
                                            ) &
                                            "  •  " &
                                            Text(
                                                ThisItem.Erstellt,
                                                "[$-de-DE]dd.mm.yyyy HH:mm"
                                            )
                                          VerticalAlign: =VerticalAlign.Top
                                          Width: =Parent.Width - 20
                                          X: =10
                                          Y: =8
                                    - lbl_activity_body:
                                        Control: Label
                                        Properties:
                                          Align: |-
                                            =If(
                                                App.Width < 600 &&
                                                ThisItem.CommentByClaims = fxCurrentUser.Claims,
                                                Align.Right,
                                                Align.Left
                                            )
                                          AutoHeight: =true
                                          BorderColor: =RGBA(0, 0, 0, 0)
                                          Color: =RGBA(15, 23, 42, 1)
                                          Font: =Font.'Segoe UI'
                                          Height: =Self.Size * 1.8
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =If(App.Width < 600, 13, 14)
                                          Text: |-
                                            =If(
                                                IsBlank(ThisItem.Comment) &&
                                                !IsEmpty(ThisItem.Anlagen),
                                                fxTranslate(
                                                    "DocumentUploaded",
                                                    "Dokument hochgeladen"
                                                ),
                                                Coalesce(
                                                    ThisItem.Comment,
                                                    ""
                                                )
                                            )
                                          VerticalAlign: =VerticalAlign.Top
                                          Width: =Parent.Width - 20
                                          X: =10
                                          Y: =lbl_activity_meta.Y + lbl_activity_meta.Height + 6
                                    - att_activity_item_attachments:
                                        Control: Attachments
                                        Properties:
                                          AccessibleLabel: =fxTranslate("CommentAttachments", "Kommentaranhänge")
                                          BorderColor: =RGBA(226, 232, 240, 1)
                                          BorderThickness: =0
                                          DisplayMode: =DisplayMode.View
                                          Height: |-
                                            =If(
                                                IsEmpty(ThisItem.Anlagen),
                                                0,
                                                Max(
                                                    34,
                                                    CountRows(ThisItem.Anlagen) * 34
                                                )
                                            )
                                          Items: =ThisItem.Anlagen
                                          Items.Name: =DisplayName
                                          Items.Value: =Id
                                          NoAttachmentsText: =""
                                          Size: =10
                                          Visible: =!IsEmpty(ThisItem.Anlagen)
                                          Width: =Parent.Width - 20
                                          X: =10
                                          Y: =lbl_activity_body.Y + lbl_activity_body.Height + 8
