                      fallback
                  ),
                  fallback
              )
          )
      );
      fxKPI = Table(
          {
              Label: fxTranslate(
                  "Open",
                  "Offen"
              ),
              StatusFilter: "Ausstehend",
              Color: RGBA(
                  255,
                  193,
                  7,
                  1
              )
          },
          {
              Label: fxTranslate(
                  "Approved",
                  "Genehmigt"
              ),
              StatusFilter: "Genehmigt",
              Color: RGBA(
                  76,
                  175,
                  80,
                  1
              )
          },
          {
              Label: fxTranslate(
                  "Rejected",
                  "Abgelehnt"
              ),
              StatusFilter: "Abgelehnt",
              Color: RGBA(
                  244,
                  67,
                  54,
                  1
              )
          },
          {
              Label: fxTranslate(
                  "Total",
                  "Gesamt"
              ),
              StatusFilter: "Alle",
              Color: fxPrimaryColor
          }
      );
      fxCurrentUser = {
          FullName: User().FullName,
          Email: User().Email,
          Claims: "i:0#.f|membership|" & Lower(User().Email)
      };
      fxCurrentMember = LookUp(
          ev_sp_list_config_members,
          Titel = fxCurrentUser.Email
      );
      fxIsAdmin = Coalesce(
          fxCurrentMember.Role.Value,
          ""
      ) = "Admin";
      fxIsAgent = Coalesce(
          fxCurrentMember.Role.Value,
          ""
      ) = "Admin" Or Coalesce(
          fxCurrentMember.Role.Value,
          ""
      ) = "IT-Agent";
      fxIsCabMember = Coalesce(
          fxCurrentMember.Role.Value,
          ""
      ) = "CAB-Member";
      fxIsAgentExperience = Coalesce(
          fxIsAdmin,
          false
      ) Or Coalesce(
          fxIsAgent,
          false
      );
      fxIsCurrentTicketRequester = !IsBlank(varCurrentTicket) && (varCurrentTicket.RequestedBy.Email = fxCurrentUser.Email Or varCurrentTicket.'Erstellt von'.Email = fxCurrentUser.Email);
      fxIsCurrentTicketAssignee = !IsBlank(varCurrentTicket) && !IsBlank(
          LookUp(
              varCurrentTicket.'Zugewiesen an',
              Lower(Email) = Lower(fxCurrentUser.Email)
          )
      );
      fxIsCurrentTicketObserver = !IsBlank(varCurrentTicket) && !IsBlank(
          LookUp(
              varCurrentTicket.Beobachter,
              Email = fxCurrentUser.Email
          )
      );
      fxCurrentTicketStatus = Coalesce(
          varCurrentTicket.Status.Value,
          varCurrentTicket.StatusINC.Value,
          ""
      );
      fxIsCurrentTicketClosed = !IsBlank(varCurrentTicket) && !IsBlank(
          LookUp(
              ev_sp_list_config_dropdown,
              FilterName = "ClosedStatus" && TargetList = "Ticket" && Active = true && FilterValue = fxCurrentTicketStatus
          )
      );
      fxIsRequesterEditableStatus = !IsBlank(varCurrentTicket) && !IsBlank(
          LookUp(
              ev_sp_list_config_dropdown,
              FilterName = "RequesterEditableStatus" && TargetList = "Ticket" && Active = true && FilterValue = fxCurrentTicketStatus
          )
      );
      fxCanViewCurrentTicket = fxIsAgentExperience Or fxIsCurrentTicketAssignee Or fxIsCurrentTicketRequester Or fxIsCurrentTicketObserver;
      fxCanEditAgentFields = fxIsAgentExperience && !fxIsCurrentTicketClosed;
      fxCanEditAssigneeFields = (fxIsAgentExperience Or fxIsCurrentTicketAssignee) && !fxIsCurrentTicketClosed;
      fxCanEditRequesterFields = fxIsCurrentTicketRequester && !fxIsCurrentTicketClosed && fxIsRequesterEditableStatus;
      fxCanEditCurrentTicket = fxCanEditAssigneeFields Or fxCanEditRequesterFields;
      fxCanSeeInternalNotes = fxIsAgentExperience;
      fxCanCommentOnCurrentTicket = fxCanViewCurrentTicket && !fxIsCurrentTicketClosed;
      fxSavedViewTargetDashboard = "dashboard";
      fxSavedViewScopePersonal = "Personal";
      fxSavedViewScopeGlobal = "Global";
      fxDbdPagePadding = 16;
      fxDbdPageGap = 16;
      fxDbdSidebarWidth = 230;
      fxDbdCardPadding = 16;
      fxDbdCardRadius = 8;
      fxDbdControlGap = 8;
      fxDbdSectionGap = 14;
      fxDbdActiveFilters = Filter(
          Table(
              {Key: "status", Label: fxTranslate("Status", "Status"), Value: Coalesce(varDbdStatusFilter.Value, "Alle")},
              {Key: "priority", Label: fxTranslate("Priority", "Priorität"), Value: Coalesce(varDbdPriorityFilter.Value, "Alle")},
              {Key: "scope", Label: fxTranslate("Scope", "Umfang"), Value: Coalesce(varDbdScopeFilter.Value, "Alle")},
              {Key: "ticketType", Label: fxTranslate("TicketType", "Tickettyp"), Value: Coalesce(varDbdTicketTypeFilter.Value, "Alle")},
              {Key: "category", Label: fxTranslate("Category", "Kategorie"), Value: Coalesce(varDbdCategoryFilter.Value, "Alle")},
              {Key: "department", Label: fxTranslate("Department", "Abteilung"), Value: Coalesce(varDbdDepartmentFilter.Value, "Alle")},
              {Key: "risk", Label: fxTranslate("Risk", "Risiko"), Value: Coalesce(varDbdRiskFilter.Value, "Alle")},
              {Key: "requester", Label: fxTranslate("Requester", "Anforderer"), Value: Coalesce(varDbdRequesterFilter.DisplayName, varDbdRequesterFilter.Email, "Alle")}
          ),
          !IsBlank(Value) && Value <> "Alle"
      );
      fxDbdActiveFilterCount = CountRows(fxDbdActiveFilters);
      fxFilteredDashboardTickets = With(
          {
              accessibleTickets: If(
                  fxIsAgentExperience,
                  ev_sp_list_tickets,
                  Filter(
                      ev_sp_list_tickets As ticket,
                      ticket.RequestedBy.Email = fxCurrentUser.Email
                          || ticket.'Erstellt von'.Email = fxCurrentUser.Email
                          || !IsBlank(
                              LookUp(
                                  ticket.'Zugewiesen an',
                                  Lower(Email) = Lower(fxCurrentUser.Email)
                              )
                          )
                  )
              )
          },
          With(
              {
                  scopeTickets: Switch(
                      Coalesce(varDbdScopeFilter.Value, "Alle"),
                      "Mir zugewiesen", Filter(accessibleTickets As ticket, !IsBlank(LookUp(ticket.'Zugewiesen an', Lower(Email) = Lower(fxCurrentUser.Email)))),
                      "Von mir erstellt", Filter(accessibleTickets, 'Erstellt von'.Email = fxCurrentUser.Email),
                      "Von mir angefordert", Filter(accessibleTickets, RequestedBy.Email = fxCurrentUser.Email),
                      accessibleTickets
                  )
              },
              With(
                  {
                      searchTickets: If(
                          IsBlank(Trim(varDbdSearchText)),
                          scopeTickets,
                          Filter(
                              scopeTickets,
                              StartsWith(Titel, Trim(varDbdSearchText))
                                  || StartsWith(TicketId, Trim(varDbdSearchText))
                                  || StartsWith(TicketTitel, Trim(varDbdSearchText))
                                  || StartsWith(RequestedBy.DisplayName, Trim(varDbdSearchText))
                          )
                      )
                  },
                  With(
                      {
                          requesterTickets: If(
                              IsBlank(varDbdRequesterFilter.Email),
                              searchTickets,
                              Filter(searchTickets, RequestedBy.Email = varDbdRequesterFilter.Email)
                          )
                      },
                      With(
                          {
                              statusTickets: If(
                                  Coalesce(varDbdStatusFilter.Value, "Alle") = "Alle",
                                  requesterTickets,
                                  Filter(requesterTickets, Coalesce(Status.Value, StatusINC.Value, "") = varDbdStatusFilter.Value)
                              )
                          },
                          With(
                              {
                                  priorityTickets: If(
                                      !fxIsAgentExperience || Coalesce(varDbdPriorityFilter.Value, "Alle") = "Alle",
                                      statusTickets,
                                      Filter(statusTickets, Priority.Value = varDbdPriorityFilter.Value)
                                  )
                              },
                              With(
                                  {
                                      typeTickets: If(
                                          Coalesce(varDbdTicketTypeFilter.Value, "Alle") = "Alle",
                                          priorityTickets,
                                          Filter(priorityTickets, TicketType.Value = varDbdTicketTypeFilter.Value)
                                      )
                                  },
                                  With(
                                      {
                                          categoryTickets: If(
                                              !fxIsAgentExperience || Coalesce(varDbdCategoryFilter.Value, "Alle") = "Alle",
                                              typeTickets,
                                              Filter(typeTickets, Coalesce(Category.Value, CategoryINC.Value, "") = varDbdCategoryFilter.Value)
                                          )
                                      },
                                      With(
                                          {
                                              departmentTickets: If(
                                                  !fxIsAgentExperience || Coalesce(varDbdDepartmentFilter.Value, "Alle") = "Alle",
                                                  categoryTickets,
                                                  Filter(categoryTickets, Department.Value = varDbdDepartmentFilter.Value)
                                              )
                                          },
                                          With(
                                              {
                                                  riskTickets: If(
                                                      !fxIsAgentExperience || Coalesce(varDbdRiskFilter.Value, "Alle") = "Alle",
                                                      departmentTickets,
                                                      Filter(departmentTickets, Risk.Value = varDbdRiskFilter.Value)
                                                  )
                                              },
                                              SortByColumns(riskTickets, "ID", SortOrder.Descending)
                                          )
                                      )
                                  )
                              )
                          )
                      )
                  )
              )
          )
      );
      fxCanManageGlobalSavedViews = Coalesce(
          fxIsAdmin,
          false
      );
      fxDashboardSavedViews = SortByColumns(
          Filter(
              ev_sp_list_config_saved_views,
              Active = true && TargetScreen = fxSavedViewTargetDashboard && ((Scope.Value = fxSavedViewScopeGlobal && fxIsAgentExperience) || OwnerEmail = fxCurrentUser.Email)
          ),
          "Title",
          SortOrder.Ascending
      );
       fxDbdNotifications = SortByColumns(
           Filter(
               ev_sp_list_notifications,
               RecipientEmail = fxCurrentUser.Email && IsRead = false
           ),
           "Created",
           SortOrder.Descending
       );
    OnStart: |-
      =Set(varEmbed, Param("embed") = "1");
      Set(varIncidentValidationAttempted, false);
      Set(varTicketValidationAttempted, false);
      Set(varCurrentLanguage, If(IsBlank(varCurrentLanguage) Or varCurrentLanguage = "", "de", varCurrentLanguage));
       ClearCollect(colTranslations, ev_sp_list_config_translations);
       Refresh(ev_sp_list_config_members);
      ClearCollect(colTransitionConfig, Filter(ev_sp_list_config_transitions, Active = true));
      ClearCollect(
          colMockReleaseChecks,
           {CheckKey: "ENVIRONMENT_VARIABLES", Category: fxTranslate("Configuration", "Konfiguration"), Title: fxTranslate("EnvironmentVariablesProd", "Environment Variables zeigen auf PROD"), Detail: fxTranslate("EnvironmentVariablesProdDetail", "Site-URL, Listen-IDs und App-Link verwenden PROD-Werte."), CheckMode: "Automatisch", Required: true, Status: "Pending", LastChecked: Now(), SortOrder: 10},
           {CheckKey: "CANVAS_DATASOURCE", Category: fxTranslate("CanvasApp", "Canvas App"), Title: fxTranslate("CanvasDataSourcesProd", "Canvas-Datenquellen sind auf PROD gebunden"), Detail: fxTranslate("CanvasDataSourcesProdDetail", "SharePoint-Datenquellen zeigen auf die PROD-Site und PROD-Listen."), CheckMode: "Automatisch", Required: true, Status: "Pending", LastChecked: Now(), SortOrder: 20},
           {CheckKey: "CONNECTION_REFERENCES", Category: fxTranslate("Flows", "Flows"), Title: fxTranslate("ConnectionReferencesProd", "Connection References sind PROD-Connections"), Detail: fxTranslate("ConnectionReferencesProdDetail", "SharePoint-, Outlook- und Teams-Verbindungen sind gültig."), CheckMode: "Automatisch", Required: true, Status: "Pending", LastChecked: Now(), SortOrder: 30},
           {CheckKey: "SHAREPOINT_SCHEMA", Category: fxTranslate("SharePoint", "SharePoint"), Title: fxTranslate("SharePointSchemaProd", "PROD-Schema entspricht der Release-Version"), Detail: fxTranslate("SharePointSchemaProdDetail", "Listen, Felder und erforderliche IDs sind vorhanden."), CheckMode: "Automatisch", Required: true, Status: "Pending", LastChecked: Now(), SortOrder: 40},
           {CheckKey: "ENVIRONMENT_ACCESS", Category: fxTranslate("Authorization", "Berechtigung"), Title: fxTranslate("EnvironmentSecurityGroupChecked", "Environment Security Group geprüft"), Detail: fxTranslate("EnvironmentSecurityGroupCheckedDetail", "Requester, Agent und Admin sind direkt in der PROD-Sicherheitsgruppe."), CheckMode: "Manuell", Required: true, Status: "Pending", LastChecked: Now(), SortOrder: 50},
           {CheckKey: "FIRST_LOAD", Category: fxTranslate("SmokeTest", "Smoke-Test"), Title: fxTranslate("FirstLoadSuccessful", "Erstaufruf ohne Refresh erfolgreich"), Detail: fxTranslate("FirstLoadSuccessfulDetail", "Test im InPrivate-Browser ohne Environment-Berechtigungsfehler."), CheckMode: "Manuell", Required: true, Status: "Pending", LastChecked: Now(), SortOrder: 60},
           {CheckKey: "PEOPLE_LOOKUP", Category: fxTranslate("SmokeTest", "Smoke-Test"), Title: fxTranslate("PeopleDropdownsLoad", "People-Dropdowns laden ohne 403"), Detail: fxTranslate("PeopleDropdownsLoadDetail", "People- und Lookup-Spalten funktionieren mit einem Standardnutzer."), CheckMode: "Manuell", Required: true, Status: "Pending", LastChecked: Now(), SortOrder: 70},
           {CheckKey: "TICKET_JOURNEY", Category: fxTranslate("SmokeTest", "Smoke-Test"), Title: fxTranslate("TicketJourneySuccessful", "Ticket-Journey erfolgreich"), Detail: fxTranslate("TicketJourneySuccessfulDetail", "Ticket erstellen, öffnen, kommentieren und Berechtigung prüfen."), CheckMode: "Manuell", Required: true, Status: "Pending", LastChecked: Now(), SortOrder: 80},
           {CheckKey: "FLOW_RUN", Category: fxTranslate("SmokeTest", "Smoke-Test"), Title: fxTranslate("ProductionFlowSuccessful", "Produktionsflow erfolgreich"), Detail: fxTranslate("ProductionFlowSuccessfulDetail", "Ein kontrollierter Testdatensatz erzeugt einen erfolgreichen Flow-Run."), CheckMode: "Manuell", Required: true, Status: "Pending", LastChecked: Now(), SortOrder: 90}
      );
      If(
          !IsBlank(Param("ticketId")),
          Set(varCurrentTicket, LookUp(ev_sp_list_tickets, ID = Value(Param("ticketId"))));
          If(
              IsBlank(varCurrentTicket),
               Set(varDeepLinkNotice, fxTranslate("RequestedTicketNotFound", "Das angeforderte Ticket wurde nicht gefunden.")),
              If(
                  !fxCanViewCurrentTicket,
                  Set(varCurrentTicket, Blank());
                   Set(varDeepLinkNotice, fxTranslate("NoTicketAccess", "Du hast keinen Zugriff auf dieses Ticket."))
              )
          )
      )
    StartScreen: |-
      =With(
          {
              deepLinkTicket: If(
                  !IsBlank(Param("ticketId")),
                  LookUp(
                      ev_sp_list_tickets,
                      ID = Value(Param("ticketId"))
                  )
              )
          },
          If(
              !IsBlank(Param("ticketId")) && !IsBlank(deepLinkTicket) && (fxIsAgentExperience || deepLinkTicket.RequestedBy.Email = fxCurrentUser.Email || deepLinkTicket.'Erstellt von'.Email = fxCurrentUser.Email || !IsBlank(LookUp(deepLinkTicket.'Zugewiesen an', Lower(Email) = Lower(fxCurrentUser.Email))) || !IsBlank(
                  LookUp(
                      deepLinkTicket.Beobachter,
                      Email = fxCurrentUser.Email
                  )
              )),
              ticket_details_screen,
              Switch(
                  Param("screen"),
                  "ticket",
                  ticket_screen,
                  "incident",
                  incident_screen,
                  "request-type",
                  request_type_screen,
                  "service-catalog",
                  service_catalog_screen,
                  "service-wizard",
                  service_wizard_screen,
                   "dashboard",
                   dashboard_screen_v2,
                   "ai-handoff",
                   dashboard_screen_v2
              )
          )
      )
    Theme: =Kessel
