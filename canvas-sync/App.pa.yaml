App:
  Properties:
    Formulas: |-
      =fxPrimaryColor = RGBA(
          87,
          35,
          129,
          0.8
      );
      fxPrimaryBackgroundColor = RGBA(
          245,
          246,
          248,
          1
      );
      fxSecondaryColor = RGBA(
          200,
          179,
          221,
          0.4
      );
      fxHighPriority = RGBA(
          231,
          111,
          81,
          0.7
      );
      fxMediumPriority = RGBA(
          244,
          162,
          97,
          0.7
      );
      fxLowPriority = RGBA(
          42,
          157,
          143,
          0.7
      );
      fxHighRisk = RGBA(
          211,
          47,
          47,
          1
      );
      fxMediumRisk = RGBA(
          255,
          152,
          0,
          1
      );
      fXLowRisk = RGBA(
          255,
          193,
          7,
          1
      );
      fxNoRisk = RGBA(
          168,
          168,
          168,
          1
      );
      fxCurrentUserRoles = ForAll(
          Filter(
              ev_sp_list_config_members,
              Titel = User().Email
          ),
          Role.Value
      );
      fxChanges = ev_sp_list_tickets;
      fxTranslations = colTranslations;
      fxTranslate(translationKey: Text, fallback: Text): Text = With(
          {
              translation: LookUp(
                  fxTranslations,
                  Title = translationKey
              )
          },
          Coalesce(
              If(
                  Lower(
                      Coalesce(
                          varCurrentLanguage,
                          "de"
                      )
                  ) = "en",
                  translation.en,
                  translation.de
              ),
              If(
                  Lower(
                      Coalesce(
                          varCurrentLanguage,
                          "de"
                      )
                  ) = "en",
                  Switch(
                      translationKey,
                      "Alle",
                      "All",
                      "Hoch",
                      "High",
                      "Mittel",
                      "Medium",
                      "Kritisch",
                      "Critical",
                      "Niedrig",
                      "Low",
                      "Neu",
                      "New",
                      "Offen",
                      "Open",
                      "Zugewiesen",
                      "Assigned",
                      "In Bearbeitung",
                      "In progress",
                      "Change Prüfung",
