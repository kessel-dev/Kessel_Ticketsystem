                      "Allgemein",
                      "General",
                      "DescribeYourRequest",
                      "Please describe your request",
                      "DescriptionHint",
                      "What is not working? Since when has it been happening? What error message appears? What have you already tried?",
                      "IncidentDescriptionPlaceholder",
                      "Describe the problem here.",
                      "HelpfulDetails",
                      "Helpful details:",
                      "WhatDoesNotWork",
                      "What is not working?",
                      "WhenDidProblemStart",
                      "When did the problem start?",
                      "WhatErrorMessage",
                      "What error message appears?",
                      "WhatAlreadyTried",
                      "What have you already tried?",
                      "DescriptionHelp",
                      "Describe what is not working, since when it has been happening, whether an error message appears, and what has already been tried.",
                      "ChangeDescriptionHint",
                      "What should be changed, why, and what impact do you expect? Screenshots can be inserted directly; please attach files below.",
                      "DescriptionWithOptionalScreenshots",
                      "Description with optional inserted screenshots",
                      "PromoteTicketToChange",
                      "Promote ticket to change",
                      "PromoteToChange",
                      "To change",
                      "PromoteToChangeTitle",
                      "Promote ticket to change?",
                      "PromoteToChangeBody",
                      "The ticket will be requested as a change. Please briefly document why this ticket should become a change.",
                      "PromoteReason",
                      "Reason for promotion",
                      "PromoteReasonPlaceholder",
                      "Why should this ticket continue as a change?",
                      "PromoteToChangeConfirm",
                      "Make change",
                      "PromoteToChangeRequested",
                      "Promotion to change has been requested.",
                      "PromoteToChangeFailed",
                      "Promotion to change could not be requested.",
                      "EditDescription",
                      "Edit description",
                      "Edit",
                      "Edit",
                      "SaveDescription",
                      "Save description",
                      "DescriptionSaved",
                      "Description saved.",
                      "DescriptionSaveFailed",
                      "Description could not be saved.",
                      "CancelEditDescription",
                      "Cancel editing description",
                      "Service",
