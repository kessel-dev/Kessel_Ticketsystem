                      "SharePoint",
                      "SharePoint",
                      "OneDrive",
                      "OneDrive",
                      "VPN",
                      "VPN",
                      "WLAN",
                      "Wi-Fi",
                      "LAN",
                      "LAN",
                      "Internet",
                      "Internet",
                      "PowerPlatform",
                      "Power Platform",
                      "Power Platform",
                      "Power Platform",
                      "SAP",
                      "SAP",
                      "Berechtigung",
                      "Permission",
                      "Berechtigungen",
                      "Permissions",
                      "Zugriff",
                      "Access",
                      "Konto",
                      "Account",
                      "Benutzerkonto",
                      "User account",
                      "Passwort",
                      "Password",
                      "E-Mail",
                      "Email",
                      "Email",
                      "Email",
                      "Sonstiges",
                      "Other",
                      "Andere",
