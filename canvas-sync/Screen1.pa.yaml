Screens:
  Screen1:
    Children:
      - ListScroll1:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(255, 255, 255, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingBottom: =24
            Width: =Parent.Width
          Children:
            - TopNav1:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  Height: =If(App.Width < 640, 104, 56)
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                Children:
                  - TitleRow1:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Height: =56
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =12
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingLeft: =If(App.Width < 640, 16, 24)
                        PaddingRight: =If(App.Width < 640, 16, 24)
                        Width: =Parent.Width
                      Children:
                        - AppTitle1:
                            Control: ModernText
                            Properties:
                              FillPortions: =If(App.Width < 640, 1, 0)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              Size: =If(App.Width < 640, 13, 16)
                              Text: =fxTranslate("ItServicePortal", "IT Service Portal")
                              Width: =If(App.Width < 640, 0, 200)
                        - NavTabsDesktop1:
                            Control: ModernTabList
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              Appearance: =TabListAppearance.Subtle
                              BasePaletteColor: =RGBA(87, 35, 129, 1)
                              Default: |-
                                ={Value: fxTranslate("Dashboard", "Dashboard")}
                              FillPortions: =1
                              Height: =56
                              Items: |-
                                =Table(
                                    {Value: fxTranslate("Dashboard", "Dashboard")},
                                    {Value: fxTranslate("CreateTicket", "Ticket erstellen")},
                                    {Value: fxTranslate("Tickets", "Tickets")}
                                )
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              OnChange: |-
                                =Switch(
                                    Self.Selected.Value,
                                    fxTranslate("CreateTicket", "Ticket erstellen"), Navigate(request_type_screen, ScreenTransition.Cover),
                                    fxTranslate("Tickets", "Tickets"), Navigate(dashboard_screen, ScreenTransition.Cover),
                                    Navigate(dashboard_screen, ScreenTransition.Cover)
                                )
                              Visible: =App.Width >= 640
                        - LanguageSelector1:
                            Control: ModernDropdown
                            Properties:
                              AccessibleLabel: =fxTranslate("SelectLanguage", "Sprache auswählen")
                              Default: |-
                                =LookUp(Table({Code: "de", Label: "DE"}, {Code: "en", Label: "EN"}), Code = Coalesce(varCurrentLanguage, "de"))
                              Height: =34
                              ItemDisplayText: =ThisItem.Label
                              Items: |-
                                =Table({Code: "de", Label: "DE"}, {Code: "en", Label: "EN"})
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnChange: =Set(varCurrentLanguage, Coalesce(Self.Selected.Code, "de"))
                              Width: =72
                        - UserName1:
                            Control: ModernText
                            Properties:
                              Color: =RGBA(35, 39, 47, 1)
                              FontWeight: =FontWeight.Semibold
                              Height: =24
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Size: =12
                              Text: =Left(fxCurrentUser.FullName, Find(" ", fxCurrentUser.FullName & " ") - 1)
                              Visible: =App.Width >= 760
                              Width: =72
                        - Avatar1:
                            Control: ModernText
                            Properties:
                              Align: =Align.Center
                              Color: =RGBA(87, 35, 129, 1)
                              Fill: =RGBA(246, 241, 249, 1)
                              FontWeight: =FontWeight.Semibold
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              RadiusBottomLeft: =16
                              RadiusBottomRight: =16
                              RadiusTopLeft: =16
                              RadiusTopRight: =16
                              Size: =12
                              Text: =Upper(Left(fxCurrentUser.FullName, 2))
                              Width: =32
                  - NavTabsMobile1:
                      Control: ModernTabList
                      Properties:
                        Appearance: =TabListAppearance.Subtle
                        BasePaletteColor: =RGBA(87, 35, 129, 1)
                        Default: |-
                          ={Value: fxTranslate("Dashboard", "Dashboard")}
                        Height: =If(App.Width < 640, 48, 0)
                        Items: |-
                          =Table(
                              {Value: fxTranslate("Dashboard", "Dashboard")},
                              {Value: fxTranslate("CreateTicket", "Ticket erstellen")},
                              {Value: fxTranslate("Tickets", "Tickets")}
                          )
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        OnChange: |-
                          =Switch(
                              Self.Selected.Value,
                              fxTranslate("CreateTicket", "Ticket erstellen"), Navigate(request_type_screen, ScreenTransition.Cover),
                              Navigate(dashboard_screen, ScreenTransition.Cover)
                          )
                        Width: =Parent.Width
            - NavDivider1:
                Control: ModernText
                Properties:
                  Fill: =RGBA(237, 237, 237, 1)
                  Height: =2
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  Text: =""
            - EventsHeader1:
                Control: ModernText
                Properties:
                  FontWeight: =FontWeight.Semibold
                  Height: =72
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =6
                  PaddingLeft: =If(App.Width < 640, 16, 40)
                  PaddingTop: =40
                  Size: =18
                  Text: =If(App.Width < 640, "Upcoming Events", "Events")
                  VerticalAlign: =VerticalAlign.Bottom
            - EventsCardGrid1:
                Control: GroupContainer
                Variant: GridLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  Height: =(RoundUp(3 / If(App.Width < 640, 1, If(App.Width < 1024, 2, 3)), 0) * 140) + ((RoundUp(3 / If(App.Width < 640, 1, If(App.Width < 1024, 2, 3)), 0) - 1) * 16) + 8 + 8
                  LayoutGap: =16
                  LayoutGridColumnMinWidth: =(Parent.Width - 2 * If(App.Width < 640, 16, 40) - (If(App.Width < 640, 1, If(App.Width < 1024, 2, 3)) - 1) * 16) / If(App.Width < 640, 1, If(App.Width < 1024, 2, 3)) - 4
                  LayoutGridColumns: =If(App.Width < 640, 1, If(App.Width < 1024, 2, 3))
                  LayoutGridRowMinHeight: =140
                  LayoutGridRows: =RoundUp(3 / If(App.Width < 640, 1, If(App.Width < 1024, 2, 3)), 0)
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =48
                  PaddingLeft: =If(App.Width < 640, 16, 40)
                  PaddingRight: =If(App.Width < 640, 16, 40)
                  PaddingTop: =0
                Children:
                  - EventCard_11:
                      Control: ModernCard
                      Properties:
                        Description: ="Spend two hands-on days exploring bold color and gesture with abstract techniques. Work alongside local artists and leave with a finished canvas of your own."
                        HeaderImage: =SampleCardHeaderImageWorkshop
                        Image: =Blank()
                        LayoutDirection: =LayoutDirection.Horizontal
                        Subtitle: ="Abstract Expressionism"
                        Title: ="Weekend Workshop"
                  - EventCard_21:
                      Control: ModernCard
                      Properties:
                        Description: ="An evening showcase of fresh work from up-and-coming painters and sculptors. Mingle with the artists over live music and discover your next favorite piece."
                        HeaderImage: =SampleCardHeaderImageGallery
                        Image: =Blank()
                        LayoutDirection: =LayoutDirection.Horizontal
                        Subtitle: ="Emerging Talent"
                        Title: ="Gallery Night"
                  - EventCard_31:
                      Control: ModernCard
                      Properties:
                        Description: ="Watch a professional illustrator build a piece from scratch using the latest tablet and software. Ask questions in real time and pick up pro-level techniques."
                        HeaderImage: =SampleCardHeaderImageDemo
                        Image: =Blank()
                        LayoutDirection: =LayoutDirection.Horizontal
                        Subtitle: ="Digital Art Tools"
                        Title: ="Live Demo"
            - RecentFilesSection1:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  Height: =If(App.Width < 640, 712, 700)
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =8
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =48
                  PaddingLeft: =If(App.Width < 640, 16, 40)
                  PaddingRight: =If(App.Width < 640, 16, 40)
                  PaddingTop: =40
                Children:
                  - RecentFilesHeader1:
                      Control: ModernText
                      Properties:
                        FontWeight: =FontWeight.Semibold
                        Height: =40
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        Size: =18
                        Text: =fxTranslate("Tickets", "Tickets")
                        Width: =Parent.Width - If(App.Width < 640, 32, 80)
                  - RecentFilesFilterRow1:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Height: =52
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        Width: =Parent.Width - If(App.Width < 640, 32, 80)
                      Children:
                        - RecentFilterTabs1:
                            Control: ModernTabList
                            Properties:
                              Appearance: =TabListAppearance.FilledCircular
                              BasePaletteColor: =RGBA(87, 35, 129, 1)
                              Default: |-
                                ={Value: fxTranslate("All", "Alle")}
                              Height: =36
                              Items: |-
                                =Table(
                                    {Value: fxTranslate("All", "Alle")},
                                    {Value: fxTranslate("RequestedByMe", "Von mir")},
                                    {Value: fxTranslate("AssignedToMe", "Mir zugewiesen")},
                                    {Value: fxTranslate("Open", "Offen")}
                                )
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              Width: =If(App.Width < 640, Parent.Width, 420)
                        - RecentFilterSpacer1:
                            Control: ModernText
                            Properties:
                              FillPortions: =1
                              Height: =36
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              Text: =""
                              Width: =0
                        - RecentSearchInput1:
                            Control: ModernTextInput
                            Properties:
                              Height: =36
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              Placeholder: =fxTranslate("SearchTickets", "Tickets durchsuchen")
                              Width: =If(App.Width < 640, 0, 200)
                  - DynamicTicketsGrid1:
                      Control: ModernDataGrid
                      Properties:
                        DisplayMode: =DisplayMode.View
                        Height: =536
                        Items: |-
                          =With(
                              {
                                  selectedFilter: Coalesce(RecentFilterTabs1.Selected.Value, fxTranslate("All", "Alle")),
                                  searchText: Lower(Trim(RecentSearchInput1.Text))
                              },
                              With(
                                  {
                                      visibleTickets: Filter(
                                          ev_sp_list_tickets As ticket,
                                          (
                                              Coalesce(fxIsAgentExperience, false)
                                                  Or ticket.RequestedBy.Email = fxCurrentUser.Email
                                                  Or ticket.'Erstellt von'.Email = fxCurrentUser.Email
                                                  Or ticket.'Zugewiesen an'.Email = fxCurrentUser.Email
                                          )
                                              And Switch(
                                                  selectedFilter,
                                                  fxTranslate("RequestedByMe", "Von mir"), ticket.RequestedBy.Email = fxCurrentUser.Email Or ticket.'Erstellt von'.Email = fxCurrentUser.Email,
                                                  fxTranslate("AssignedToMe", "Mir zugewiesen"), ticket.'Zugewiesen an'.Email = fxCurrentUser.Email,
                                                  fxTranslate("Open", "Offen"), IsBlank(
                                                      LookUp(
                                                          ev_sp_list_config_dropdown,
                                                          FilterName = "ClosedStatus"
                                                              And TargetList = "Ticket"
                                                              And Active = true
                                                              And FilterValue = Coalesce(ticket.Status.Value, ticket.StatusINC.Value, "")
                                                      )
                                                  ),
                                                  true
                                              )
                                              And (
                                                  IsBlank(searchText)
                                                      Or searchText in Lower(Coalesce(ticket.TicketId, ticket.Titel, Text(ticket.ID)))
                                                      Or searchText in Lower(Coalesce(ticket.TicketTitel, ticket.Name, ""))
                                                      Or searchText in Lower(Coalesce(ticket.'Zugewiesen an'.DisplayName, ""))
                                              )
                                      )
                                  },
                                  SortByColumns(
                                      ForAll(
                                          visibleTickets As visibleTicket,
                                          {
                                              GridID: visibleTicket.ID,
                                              GridTicketNumber: Coalesce(visibleTicket.TicketId, visibleTicket.Titel, Text(visibleTicket.ID)),
                                              GridTitle: Coalesce(visibleTicket.TicketTitel, visibleTicket.Name, ""),
                                              GridType: fxTranslate(Coalesce(visibleTicket.TicketType.Value, "Ticket"), Coalesce(visibleTicket.TicketType.Value, "Ticket")),
                                              GridStatus: fxTranslate(Coalesce(visibleTicket.Status.Value, visibleTicket.StatusINC.Value, ""), Coalesce(visibleTicket.Status.Value, visibleTicket.StatusINC.Value, "-")),
                                              GridPriority: fxTranslate(Coalesce(visibleTicket.Priority.Value, ""), Coalesce(visibleTicket.Priority.Value, "-")),
                                              GridAssignee: Coalesce(visibleTicket.'Zugewiesen an'.DisplayName, "-"),
                                              GridCreated: Text(visibleTicket.Erstellt, "[$-de-DE]dd.mm.yyyy")
                                          }
                                      ),
                                      "GridID",
                                      SortOrder.Descending
                                  )
                              )
                          )
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        Width: =Parent.Width - If(App.Width < 640, 32, 80)
                      Children:
                        - TicketNumber_Col1:
                            Control: ModernDataGridColumn
                            Variant: Textual
                            IsLocked: true
                            Properties:
                              FieldDisplayName: =fxTranslate("TicketNumber", "Ticketnummer")
                              FieldName: ="%DATACARD_FIELD_NAME.ID%"
                              FieldVariantName: ="%DATACARD_FIELD_VARIANT_NAME.ID%"
                              Text: =ThisItem.GridTicketNumber
                              Width: =130
                        - TicketTitle_Col1:
                            Control: ModernDataGridColumn
                            Variant: Textual
                            IsLocked: true
                            Properties:
                              FieldDisplayName: =fxTranslate("Title", "Titel")
                              FieldName: ="%DATACARD_FIELD_NAME.ID%"
                              FieldVariantName: ="%DATACARD_FIELD_VARIANT_NAME.ID%"
                              Text: =ThisItem.GridTitle
                              Width: =240
                        - TicketType_Col1:
                            Control: ModernDataGridColumn
                            Variant: Textual
                            IsLocked: true
                            Properties:
                              FieldDisplayName: =fxTranslate("TicketType", "Tickettyp")
                              FieldName: ="%DATACARD_FIELD_NAME.ID%"
                              FieldVariantName: ="%DATACARD_FIELD_VARIANT_NAME.ID%"
                              Text: =ThisItem.GridType
                              Width: =140
                        - TicketStatus_Col1:
                            Control: ModernDataGridColumn
                            Variant: Textual
                            IsLocked: true
                            Properties:
                              FieldDisplayName: =fxTranslate("Status", "Status")
                              FieldName: ="%DATACARD_FIELD_NAME.ID%"
                              FieldVariantName: ="%DATACARD_FIELD_VARIANT_NAME.ID%"
                              Text: =ThisItem.GridStatus
                              Width: =140
                        - TicketPriority_Col1:
                            Control: ModernDataGridColumn
                            Variant: Textual
                            IsLocked: true
                            Properties:
                              FieldDisplayName: =fxTranslate("Priority", "Priorität")
                              FieldName: ="%DATACARD_FIELD_NAME.ID%"
                              FieldVariantName: ="%DATACARD_FIELD_VARIANT_NAME.ID%"
                              Text: =ThisItem.GridPriority
                              Width: =110
                        - TicketAssignee_Col1:
                            Control: ModernDataGridColumn
                            Variant: Textual
                            IsLocked: true
                            Properties:
                              FieldDisplayName: =fxTranslate("Assignee", "Bearbeiter")
                              FieldName: ="%DATACARD_FIELD_NAME.ID%"
                              FieldVariantName: ="%DATACARD_FIELD_VARIANT_NAME.ID%"
                              Text: =ThisItem.GridAssignee
                              Width: =170
                        - TicketCreated_Col1:
                            Control: ModernDataGridColumn
                            Variant: Textual
                            IsLocked: true
                            Properties:
                              FieldDisplayName: =fxTranslate("Created", "Erstellt")
                              FieldName: ="%DATACARD_FIELD_NAME.ID%"
                              FieldVariantName: ="%DATACARD_FIELD_VARIANT_NAME.ID%"
                              Text: =ThisItem.GridCreated
                              Width: =120
                  - RecentFilesGrid1:
                      Control: ModernDataGrid
                      Properties:
                        DisplayMode: =DisplayMode.View
                        Height: =0
                        Items: |-
                          =Filter(Table({Artwork: "Color Harmony Study", Artist: "Emma Carter", Email: "emma.carter@example.com", Phone: "(555) 555-0142", Portfolio: "https://www.example.com/emma", Medium: "Watercolor", Status: "● Active"}, {Artwork: "Brush Technique Vol.2", Artist: "Liam Brooks", Email: "liam.brooks@example.com", Phone: "(555) 555-0188", Portfolio: "https://www.example.com/liam", Medium: "Acrylic", Status: "◐ In review"}, {Artwork: "Palette Preferences", Artist: "Ava Mitchell", Email: "ava.mitchell@example.com", Phone: "(555) 555-0119", Portfolio: "https://www.example.com/ava", Medium: "Watercolor", Status: "● Active"}, {Artwork: "Texture Study Sheet", Artist: "Noah Bennett", Email: "noah.bennett@example.com", Phone: "(555) 555-0204", Portfolio: "https://www.example.com/noah", Medium: "Gouache", Status: "○ Draft"}, {Artwork: "Gradient Flow Guide", Artist: "Sophia Reed", Email: "sophia.reed@example.com", Phone: "(555) 555-0337", Portfolio: "https://www.example.com/sophia", Medium: "Watercolor", Status: "◐ In review"}, {Artwork: "Wash Layer Tracker", Artist: "Mason Clark", Email: "mason.clark@example.com", Phone: "(555) 555-0153", Portfolio: "https://www.example.com/mason", Medium: "Ink", Status: "○ Draft"}, {Artwork: "Pigment Mix Log", Artist: "Olivia Nash", Email: "olivia.nash@example.com", Phone: "(555) 555-0291", Portfolio: "https://www.example.com/olivia", Medium: "Oil", Status: "● Active"}, {Artwork: "Water Ratio Form", Artist: "Ethan Rice", Email: "ethan.rice@example.com", Phone: "(555) 555-0420", Portfolio: "https://www.example.com/ethan", Medium: "Watercolor", Status: "● Active"}, {Artwork: "Edge Control Survey", Artist: "Harper Gray", Email: "harper.gray@example.com", Phone: "(555) 555-0176", Portfolio: "https://www.example.com/harper", Medium: "Graphite", Status: "◐ In review"}, {Artwork: "Bloom Effect Report", Artist: "Isabella Fox", Email: "isabella.fox@example.com", Phone: "(555) 555-0388", Portfolio: "https://www.example.com/isabella", Medium: "Acrylic", Status: "○ Draft"}), IsBlank(RecentSearchInput1.Text) || RecentSearchInput1.Text in Artwork || RecentSearchInput1.Text in Artist || RecentSearchInput1.Text in Email || RecentSearchInput1.Text in Phone || RecentSearchInput1.Text in Portfolio || RecentSearchInput1.Text in Medium || RecentSearchInput1.Text in Status)
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        Visible: =false
                        Width: =Parent.Width - If(App.Width < 640, 32, 80)
                      Children:
                        - Medium_Col1:
                            Control: ModernDataGridColumn
                            Variant: Textual
                            IsLocked: true
                            Properties:
                              FieldDisplayName: ="Medium"
                              FieldName: ="%DATACARD_FIELD_NAME.ID%"
                              FieldVariantName: ="%DATACARD_FIELD_VARIANT_NAME.ID%"
                              Text: =ThisItem.Medium
                              Width: =130
                        - Portfolio_Col1:
                            Control: ModernDataGridColumn
                            Variant: Url
                            IsLocked: true
                            Properties:
                              FieldDisplayName: ="Portfolio"
                              FieldName: ="%DATACARD_FIELD_NAME.ID%"
                              FieldVariantName: ="%DATACARD_FIELD_VARIANT_NAME.ID%"
                              Text: =ThisItem.Portfolio
                              URL: =ThisItem.Portfolio
                        - Phone_Col1:
                            Control: ModernDataGridColumn
                            Variant: Phone
                            IsLocked: true
                            Properties:
                              FieldDisplayName: ="Phone"
                              FieldName: ="%DATACARD_FIELD_NAME.ID%"
                              FieldVariantName: ="%DATACARD_FIELD_VARIANT_NAME.ID%"
                              Text: =ThisItem.Phone
                              Width: =160
                        - Email_Col1:
                            Control: ModernDataGridColumn
                            Variant: Email
                            IsLocked: true
                            Properties:
                              FieldDisplayName: ="Email"
                              FieldName: ="%DATACARD_FIELD_NAME.ID%"
                              FieldVariantName: ="%DATACARD_FIELD_VARIANT_NAME.ID%"
                              Text: =ThisItem.Email
                              Width: =210
                        - Artist_Col1:
                            Control: ModernDataGridColumn
                            Variant: Textual
                            IsLocked: true
                            Properties:
                              FieldDisplayName: ="Artist"
                              FieldName: ="%DATACARD_FIELD_NAME.ID%"
                              FieldVariantName: ="%DATACARD_FIELD_VARIANT_NAME.ID%"
                              Text: =ThisItem.Artist
                              Width: =140
                        - Status_Col1:
                            Control: ModernDataGridColumn
                            Variant: Textual
                            IsLocked: true
                            Properties:
                              FieldDisplayName: ="Status"
                              FieldName: ="%DATACARD_FIELD_NAME.ID%"
                              FieldVariantName: ="%DATACARD_FIELD_VARIANT_NAME.ID%"
                              Text: =ThisItem.Status
                              Width: =120
                        - Artwork_Col1:
                            Control: ModernDataGridColumn
                            Variant: Textual
                            IsLocked: true
                            Properties:
                              FieldDisplayName: ="Artwork"
                              FieldName: ="%DATACARD_FIELD_NAME.ID%"
                              FieldVariantName: ="%DATACARD_FIELD_VARIANT_NAME.ID%"
                              Text: =ThisItem.Artwork
                              Width: =200
