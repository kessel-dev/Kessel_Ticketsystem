                        Width: =132
                  - btn_submit_1:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: =fxTranslate("CreateAndSubmitTicket", "Ticket erstellen und absenden")
                        Align: =Align.Center
                        DisplayMode: =If(varTicketSubmissionInProgress Or !frm_change_1.Valid Or IsBlank(Trim(PlainText(lbl_rich_editor_1.HtmlText))), DisplayMode.Disabled, DisplayMode.Edit)
                        Height: =42
                        Icon: ="Checkmark"
                        IconStyle: =IconStyle.Filled
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        OnSelect: |-
                          =If(
                              Confirm(fxTranslate("ConfirmTicketSubmission", "Willst du das Ticket abschicken?")),
                              Set(
                                  varSubmittedDescriptionHtml,
                              If(IsBlank(varSelectedService), "", "<p><strong>Service:</strong> " & varSelectedService & "</p>") & lbl_rich_editor_1.HtmlText
                              );
                              Set(
                                  varSubmittedDescriptionHadInlineImages,
                                  CountRows(
                                      MatchAll(
                                          varSubmittedDescriptionHtml,
                                          "data:image/[A-Za-z0-9.+-]+;base64,[A-Za-z0-9+/=]+"
                                      )
                                  ) > 0
                              );
                              Set(
                                  varSubmittedDescriptionPayload,
                                  JSON(
                                      {
                                          schemaVersion: 1,
                                          richTextHtml: varSubmittedDescriptionHtml,
                                          screenshots: ForAll(
                                              MatchAll(
                                                  varSubmittedDescriptionHtml,
                                                  "data:image/[A-Za-z0-9.+-]+;base64,[A-Za-z0-9+/=]+"
                                              ),
                                              {
                                                  id: "inline-" & Text(StartMatch),
                                                  dataUri: FullMatch
                                              }
                                          )
                                      },
                                      JSONFormat.Compact
                                  )
                           );
                           Set(
                                varTicketWatcherSelection,
                                ForAll(
                                    Filter(
                                        DataCardValue_Beobachter_1.SelectedItems,
                                        !IsBlank(Trim(Coalesce(UserPrincipalName, Email)))
                                    ) As watcher,
                                   {
                                        Claims: "i:0#.f|membership|" & Lower(Trim(Coalesce(watcher.UserPrincipalName, watcher.Email))),
                                        DisplayName: watcher.DisplayName,
                                        Email: Trim(Coalesce(watcher.Email, watcher.UserPrincipalName)),
                                       Department: watcher.Department,
                                       JobTitle: watcher.JobTitle,
                                       Picture: Blank()
                                   }
                               )
                           );
                              Set(varTicketSubmissionStatus, fxTranslate("TicketBeingCreated", "Ticket wird erstellt..."));
                              Set(varTicketSubmissionInProgress, true);
                              Set(varTicketSubmitError, Blank());
                               If(
                                   IsBlank(Trim(User().Email)),
                                   Set(varTicketSubmitError, fxTranslate("CurrentUserEmailMissing", "Ihre Benutzer-E-Mail-Adresse konnte nicht ermittelt werden.")),
                                   IfError(
                                       Set(
                                           varCurrentTicket,
                                           Patch(
                                               ev_sp_list_tickets,
                                               Defaults(ev_sp_list_tickets),
                                               {
                                                   Titel: DataCardValue3.Text,
                                                   Description: varSubmittedDescriptionHtml,
                                                   RequestedBy: {
                                                       Claims: "i:0#.f|membership|" & Lower(Trim(User().Email)),
                                                       DisplayName: User().FullName,
                                                        Email: Trim(User().Email),
                                                       Department: "",
                                                       JobTitle: "",
                                                       Picture: Blank()
                                                   },
                                                   Beobachter: varTicketWatcherSelection,
                                                   Category: {Value: DataCardValue5_1.Selected.Value},
                                                   Subcategory: {Value: DataCardValue_Subcategory_1.Selected.Value},
                                                   Priority: {Value: DataCardValue7_1.Selected.Value},
                                                   Status: {Value: "Offen"},
                                                   Reason: dd_affected_change.Selected.Value,
                                                   TicketType: {Value: Coalesce(varRequestType, "Change")},
                                                   Department: If(IsBlank(DataCardValue6_1.Selected.Value), Blank(), {Value: DataCardValue6_1.Selected.Value}),
                                                   Risk: If(IsBlank(DataCardValue8_1.Selected.Value), Blank(), {Value: DataCardValue8_1.Selected.Value})
                                               }
                                           )
                                       ),
                                       Set(varTicketSubmitError, Coalesce(FirstError.Message, fxTranslate("UnknownError", "Unbekannter Fehler.")))
                                   )
                               );
                              If(
                                  !IsBlank(varTicketSubmitError),
                                  Set(varTicketSubmissionInProgress, false);
                                  Set(varTicketSubmissionStatus, "");
                                  Notify(
                                      Substitute(fxTranslate("TicketCreateFailed", "Das Ticket konnte nicht erstellt werden: {0}"), "{0}", varTicketSubmitError),
                                      NotificationType.Error,
                                      7000
                                  ),
                                  Set(varTicketDetailId, varCurrentTicket.ID);
                                  Set(
                                      varTicketSubmissionStatus,
                                      If(
                                          varSubmittedDescriptionHadInlineImages,
                                          fxTranslate("ScreenshotsBeingProcessed", "Screenshots werden verarbeitet..."),
                                          fxTranslate("TicketBeingFinalized", "Ticket wird finalisiert...")
                                      )
                                  );
                                  IfError(
                                      create_attach_description.Run({ticketId: Text(varCurrentTicket.ID), html: varSubmittedDescriptionPayload}),
                                      Notify(fxTranslate("TicketCreatedScreenshotsFailed", "Ticket wurde erstellt, aber Screenshots konnten nicht verarbeitet werden."), NotificationType.Warning, 5000)
                                  );
                                   Set(varTicketRefreshError, Blank());
                                   IfError(
                                       Refresh(ev_sp_list_tickets);
                                       With(
                                           {refreshedTicket: LookUp(ev_sp_list_tickets, ID = varTicketDetailId)},
                                           If(
                                               IsBlank(refreshedTicket),
                                               Set(varTicketRefreshError, fxTranslate("TicketCreatedRefreshFailed", "Ticket wurde erstellt, aber die Ticketdetails konnten nicht geladen werden.")),
                                               Set(varCurrentTicket, refreshedTicket)
                                           )
                                       ),
                                       Set(varTicketRefreshError, Coalesce(FirstError.Message, fxTranslate("TicketCreatedRefreshFailed", "Ticket wurde erstellt, aber die Ticketdetails konnten nicht geladen werden.")))
                                   );
                                   If(
                                       !IsBlank(varTicketRefreshError),
                                       Set(varTicketSubmissionInProgress, false);
                                       Set(varTicketSubmissionStatus, "");
                                       Notify(varTicketRefreshError, NotificationType.Error, 7000),
                                       ResetForm(frm_change_1);
                                       Set(varTicketSubmissionInProgress, false);
                                       Navigate(ticket_details_screen, ScreenTransition.Fade)
                                   )
                              )
                           )
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Size: =13
                        Text: =fxTranslate("Next", "Weiter")
                        Width: =180
