Screens:
  ticket_screen:
    Properties:
      OnVisible: |-
        =Set(varTicketSubmissionInProgress, false);
        Set(varTicketSubmissionStatus, "")
    Children:
      - con_change_1:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(244, 246, 250, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            Width: =Parent.Width
          Children:
            - con_header_1:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  Height: =If(varEmbed, 64, 72)
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingLeft: =
                  PaddingRight: =
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - header_1:
                      Control: Header
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        BasePaletteColor: =fxPrimaryColor
                        Font: =Font.Arial
                        Height: =If(varEmbed, 48, 56)
                        IsLogoVisible: =false
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        LogoTooltip: =
                        Style: ='Header.Style'.Primary
                        Title: =fxTranslate("CreateNewTicket", "Neues Ticket erstellen")
                        Width: =Parent.Width - tcs_language_selector.Width - Parent.PaddingLeft - Parent.PaddingRight
                  - tcs_language_selector:
                      Control: ModernDropdown
                      Properties:
                        AccessibleLabel: =fxTranslate("SelectLanguage", "Sprache auswählen")
                        Default: |-
                          =LookUp(Table({Code: "de", Label: "DE"}, {Code: "en", Label: "EN"}), Code = Coalesce(varCurrentLanguage, "de"))
                        Height: =34
                        ItemDisplayText: =ThisItem.Label
                        Items: |-
                          =Table({Code: "de", Label: "DE"}, {Code: "en", Label: "EN"})
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnChange: =Set(varCurrentLanguage, Coalesce(Self.Selected.Code, "de"))
                        Width: =72
            - tcs_navigation:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  BorderColor: =RGBA(226, 232, 240, 1)
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(248, 250, 252, 1)
                  FillPortions: =0
                  Height: =42
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =8
                  LayoutMinHeight: =42
                  LayoutMinWidth: =0
                  PaddingLeft: =If(App.Width < 600, 12, 28)
                  PaddingRight: =If(App.Width < 600, 12, 28)
                  Visible: =!varEmbed
                  Width: =Parent.Width
                Children:
                  - tcs_home:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: =fxTranslate("Home", "Zur Startseite")
                        Appearance: =ButtonAppearance.Subtle
                        DisplayMode: =If(varTicketSubmissionInProgress, DisplayMode.Disabled, DisplayMode.Edit)
                        Height: =32
                        Icon: ="Home"
                        OnSelect: |-
                          =If(
                              !frm_change_1.Unsaved || Confirm(
                                  fxTranslate("DiscardUnsavedAndGoHome", "Ungespeicherte Änderungen verwerfen und zur Startseite wechseln?"),
                                  {
                                      Title: fxTranslate("GoToHome", "Zur Startseite"),
                                      ConfirmButton: fxTranslate("Discard", "Verwerfen"),
                                      CancelButton: fxTranslate("Cancel", "Abbrechen")
                                  }
                              ),
                              ResetForm(frm_change_1);
                              Navigate(dashboard_screen, ScreenTransition.CoverRight)
                          )
                        Text: =If(App.Width < 600, fxTranslate("HomeShort", "Start"), fxTranslate("Home", "Startseite"))
                        Width: =If(App.Width < 600, 80, 120)
                  - tcs_nav_separator_1:
                      Control: ModernText
                      Properties:
                        Align: =Align.Center
                        Color: =RGBA(148, 163, 184, 1)
                        Height: =24
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =13
                        Text: =">"
                        Width: =12
                  - tcs_nav_parent:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: =fxTranslate("CreateTicket", "Ticket erstellen")
                        Appearance: =ButtonAppearance.Subtle
                        DisplayMode: =If(varTicketSubmissionInProgress, DisplayMode.Disabled, DisplayMode.Edit)
                        Height: =32
                        OnSelect: |-
                          =If(
                              !frm_change_1.Unsaved || Confirm(
                                  fxTranslate("DiscardUnsavedAndGoBack", "Ungespeicherte Änderungen verwerfen und zur Ticketauswahl zurückkehren?"),
                                  {
                                      Title: fxTranslate("BackToTicketSelection", "Zur Ticketauswahl"),
                                      ConfirmButton: fxTranslate("Discard", "Verwerfen"),
                                      CancelButton: fxTranslate("Cancel", "Abbrechen")
                                  }
                              ),
                              ResetForm(frm_change_1);
                              Navigate(request_type_screen, ScreenTransition.CoverRight)
                          )
                        Text: =fxTranslate("CreateTicket", "Ticket erstellen")
                        Visible: =App.Width >= 600
                        Width: =130
                  - tcs_nav_separator_2:
                      Control: ModernText
                      Properties:
                        Align: =Align.Center
                        Color: =RGBA(148, 163, 184, 1)
                        Height: =24
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =13
                        Text: =">"
                        Visible: =App.Width >= 600
                        Width: =12
                  - tcs_nav_current:
                      Control: ModernText
                      Properties:
                        Color: =RGBA(51, 65, 85, 1)
                        FillPortions: =1
                        FontWeight: =FontWeight.Semibold
                        Height: =24
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =13
                        Text: =fxTranslate("CreateChange", "Change erstellen")
                        Wrap: =false
            - con_form_1:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(244, 246, 250, 1)
                  Height: =Parent.Height
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =If(varEmbed, 10, 18)
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  PaddingBottom: =If(varEmbed, 12, 20)
                  PaddingLeft: =If(varEmbed, 12, 28)
                  PaddingRight: =If(varEmbed, 12, 28)
                  PaddingTop: =If(varEmbed, 12, 20)
                  Width: =Parent.Width
                Children:
                  - frm_change_1:
                      Control: Form
                      Layout: Vertical
                      Properties:
                        BorderColor: =RGBA(220, 224, 230, 1)
                        BorderThickness: =1
                        DataSource: =ev_sp_list_tickets
                        DefaultMode: =FormMode.New
                        Fill: =RGBA(255, 255, 255, 1)
                        Height: =Max(520, Parent.Height - If(varEmbed, 96, 112))
                        LayoutMaxHeight: =Parent.Height
                        LayoutMinHeight: =0
                        LayoutMinWidth: =320
                        NumberOfColumns: =1
                        OnFailure: |-
                          =Set(varTicketSubmissionInProgress, false);
                          Set(varTicketSubmissionStatus, "");
                          Notify(
                              Substitute(fxTranslate("TicketCreateFailed", "Das Ticket konnte nicht erstellt werden: {0}"), "{0}", Coalesce(frm_change_1.Error, fxTranslate("UnknownError", "Unbekannter Fehler."))),
                              NotificationType.Error,
                              7000
                          )
                        OnSuccess: |-
                          =Patch(ev_sp_list_tickets, frm_change_1.LastSubmit, {Beobachter: varTicketWatcherSelection});
                          Set(
                              varCurrentTicket,
                              frm_change_1.LastSubmit
                          );

                          Set(varTicketDetailId, frm_change_1.LastSubmit.ID);

                          Set(
                              varTicketSubmissionStatus,
                              If(
                                  varSubmittedDescriptionHadInlineImages,
                                  fxTranslate("ScreenshotsBeingProcessed", "Screenshots werden verarbeitet..."),
                                  fxTranslate("TicketBeingFinalized", "Ticket wird finalisiert...")
                              )
                          );

                          IfError(
                              create_attach_description.Run(
                                  {
                                      ticketId: Text(varCurrentTicket.ID),
                                      html: varSubmittedDescriptionPayload
                                  }
                              ),
                              Notify(
                                  fxTranslate("TicketCreatedScreenshotsFailed", "Ticket wurde erstellt, aber Screenshots konnten nicht verarbeitet werden."),
                                  NotificationType.Warning,
                                  5000
                              )
                          );

                          Refresh(ev_sp_list_tickets);

                          Set(
                              varCurrentTicket,
                              LookUp(
                                  ev_sp_list_tickets,
                                  ID = varTicketDetailId
                              )
                          );

                          ResetForm(frm_change_1);

                          Set(varTicketSubmissionInProgress, false);

                          Navigate(
                              ticket_details_screen,
                              ScreenTransition.Fade
                          )
                        Width: =If(!varEmbed And App.Width >= 1100, Max(320, Min(Parent.Width - 340, 920)), Max(320, Min(Parent.Width - If(varEmbed, 0, 8), 920)))
                      Children:
                        - Name_DataCard1:
                            Control: TypedDataCard
                            Variant: TextualEdit
                            Properties:
                              DataField: ="TicketTitel"
                              Default: =ThisItem.Name
                              DisplayName: =fxTranslate("Title", "Titel")
                              MaxLength: =DataSourceInfo([@ev_sp_list_tickets], DataSourceInfo.MaxLength, Name)
                              Required: =true
                              Update: =DataCardValue3.Text
                              Width: =If(frm_change_1.NumberOfColumns = 1, Parent.Width, Parent.Width / 2)
                              X: =0
                              Y: =0
                            Children:
                              - DataCardKey3:
                                  Control: ModernText
                                  MetadataKey: FieldName
                                  Properties:
                                    AccessibleLabel: =fxTranslate("NameFieldLabel", "Feldbezeichnung Name")
                                    Color: =RGBA(17, 24, 39, 1)
                                    FontWeight: =FontWeight.Semibold
                                    Height: =22
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Size: =12
                                    Text: =fxTranslate("TitleRequired", "Titel *")
                                    VerticalAlign: =VerticalAlign.Top
                                    Width: =Parent.Width - 48
                                    Wrap: =false
                                    X: =24
                                    Y: =8
                              - DataCardValue3:
                                  Control: ModernTextInput
                                  MetadataKey: FieldValue
                                  Properties:
                                    AccessibleLabel: =fxTranslate("EnterTicketName", "Ticketname eingeben")
                                    Default: =Parent.Default
                                    DisplayMode: =Parent.DisplayMode
                                    FontWeight: =""
                                    Height: =42
                                    MaxLength: =-1
                                    Placeholder: =fxTranslate("EnterMeaningfulTicketName", "Gib einen aussagekräftigen Namen ein...")
                                    Required: =Parent.Required
                                    TriggerOutput: =TriggerOutput.FocusOut
                                    ValidationState: =If(IsBlank(Parent.Error), "None", "Error")
                                    Width: =Parent.Width - 50
                                    X: =24
                                    Y: =DataCardKey3.Y + DataCardKey3.Height + 4
                              - ErrorMessage3:
                                  Control: Text
                                  MetadataKey: ErrorMessage
                                  Properties:
                                    Height: =30
                                    Text: =Parent.Error
                                    Visible: =And(!IsBlank(Parent.Error), Parent.DisplayMode=DisplayMode.Edit)
                                    Width: =Parent.Width - 48
                                    X: =24
                                    Y: =DataCardValue3.Y + DataCardValue3.Height
                              - StarVisible3:
                                  Control: Text
                                  MetadataKey: FieldRequired
                                  Properties:
                                    Align: ='TextCanvas.Align'.Center
                                    Height: =30
                                    Text: ="*"
                                    Visible: =And(Parent.Required, Parent.DisplayMode=DisplayMode.Edit)
                                    Width: =30
                                    Y: =DataCardKey3.Y
                        - Description_DataCard1_1:
                            Control: TypedDataCard
                            Variant: TextualEdit
                            Properties:
                              BorderColor: =fxPrimaryColor
                              DataField: ="Description"
                              Default: =ThisItem.Description
                              DisplayName: =fxTranslate("Beschreibung", "Beschreibung")
                              Height: =400
                              MaxLength: =DataSourceInfo([@ev_sp_list_tickets], DataSourceInfo.MaxLength, Description)
                              Required: =true
                              Update: =If(IsBlank(varSelectedService), "", "<p><strong>Service:</strong> " & varSelectedService & "</p>") & lbl_rich_editor_1.HtmlText
                              Width: =If(frm_change_1.NumberOfColumns = 1, Parent.Width, Parent.Width / 2)
                              X: =0
                              Y: =1
                            Children:
                              - ErrorMessage3_1:
                                  Control: Text
                                  MetadataKey: ErrorMessage
                                  Properties:
                                    Height: =30
                                    Text: =Parent.Error
                                    Visible: =And(!IsBlank(Parent.Error), Parent.DisplayMode=DisplayMode.Edit)
                                    Width: =Parent.Width - 48
                                    X: =24
                                    Y: =lbl_rich_editor_1.Y + lbl_rich_editor_1.Height
                              - StarVisible3_1:
                                  Control: Text
                                  MetadataKey: FieldRequired
                                  Properties:
                                    Align: ='TextCanvas.Align'.Center
                                    Height: =30
                                    Text: ="*"
                                    Visible: =And(Parent.Required, Parent.DisplayMode=DisplayMode.Edit)
                                    Width: =30
                                    Y: =lbl_rich_editor_1.Y
                              - lbl_rich_editor_1:
                                  Control: RichTextEditor
                                  Properties:
                                    AccessibleLabel: =fxTranslate("DescriptionWithOptionalScreenshots", "Beschreibung mit optional eingefügten Screenshots")
                                    BorderColor: =RGBA(87, 35, 129, 1)
                                    Default: =""
                                    Height: =Parent.Height - 96
                                    Width: =Parent.Width - 50
                                    X: =24
                                    Y: =88
                              - tcs_desc_title:
                                  Control: ModernText
                                  Properties:
                                    AutoHeight: =true
                                    Color: =RGBA(87, 35, 129, 1)
                                    FontWeight: =FontWeight.Semibold
                                    Height: =30
                                    Size: =16
                                    Text: =fxTranslate("Beschreibung", "Beschreibung")
                                    Width: =Parent.Width - 48
                                    X: =24
                                    Y: =6
                              - tcs_desc_subtitle:
                                  Control: ModernText
                                  Properties:
                                    AutoHeight: =true
                                    Color: =RGBA(107, 114, 128, 1)
                                    Height: =24
                                    Size: =12
                                    Text: =fxTranslate("ChangeDescriptionHint", "Was soll geändert werden, warum und welche Auswirkungen erwartest du? Screenshots können direkt eingefügt werden; Dateien bitte unten anhängen.")
                                    Width: =Parent.Width - 48
                                    X: =24
                                    Y: =40
                        - RequestedBy_DataCard1_1:
                            Control: TypedDataCard
                            Variant: ComboBoxEdit
                            Properties:
                              DataField: ="RequestedBy"
                              Default: =ThisItem.RequestedBy
                              DisplayName: =fxTranslate("Requester", "Anforderer")
                              Required: =true
                              Update: =DataCardValue9_1.Selected
                              Visible: =false
                              Width: =If(frm_change_1.NumberOfColumns = 1, Parent.Width, Parent.Width / 2)
                              X: =0
                              Y: =2
                            Children:
                              - DataCardValue9_1:
                                  Control: ModernCombobox
                                  MetadataKey: FieldValue
                                  Properties:
                                    DefaultSelectedItems: |-
                                      =With(
                                          {profile: 'Office365-Benutzer'.MyProfile()},
                                          Table(
                                              {
                                                   Claims: "i:0#.f|membership|" & Lower(Coalesce(profile.UserPrincipalName, profile.Mail)),
                                                   DisplayName: profile.DisplayName,
                                                   Email: Coalesce(profile.Mail, profile.UserPrincipalName),
                                                   UserPrincipalName: profile.UserPrincipalName,
                                                   Department: profile.Department,
                                                   JobTitle: profile.JobTitle,
                                                   Picture: Blank()
                                              }
                                          )
                                      )
                                    DisplayMode: =Parent.DisplayMode
                                    ItemDisplayText: =ThisItem.DisplayName
                                    Items: |-
                                      =SortByColumns(
                                          ForAll(
                                              Filter(
                                                  'Office365-Benutzer'.SearchUser({searchTerm: Trim(Self.SearchText)}),
                                                  AccountEnabled = true &&
                                                  !IsBlank(DisplayName) &&
                                                  !IsBlank(Coalesce(Mail, UserPrincipalName)) &&
                                                  (EndsWith(Lower(Mail), "@kessel.de") Or EndsWith(Lower(UserPrincipalName), "@kessel.de")) &&
                                                  CountRows(Split(Trim(DisplayName), " ")) >= 2 &&
                                                  !StartsWith(Lower(DisplayName), "aaa") &&
                                                  !StartsWith(Lower(UserPrincipalName), "aaa") &&
                                                  !StartsWith(Lower(MailNickname), "aaa") &&
                                                  !StartsWith(Lower(DisplayName), "admin") &&
                                                  !StartsWith(Lower(UserPrincipalName), "admin") &&
                                                  !StartsWith(Lower(MailNickname), "admin") &&
                                                  !StartsWith(Lower(DisplayName), "adm ") &&
                                                  !StartsWith(Lower(DisplayName), "abteilungsleiter") &&
                                                  !StartsWith(Lower(DisplayName), "administrator") &&
                                                  !StartsWith(Lower(DisplayName), "service") &&
                                                  !StartsWith(Lower(DisplayName), "test")
                                              ),
                                              {
                                                   Claims: "i:0#.f|membership|" & Lower(Coalesce(UserPrincipalName, Mail)),
                                                   DisplayName: DisplayName,
                                                   Email: Coalesce(Mail, UserPrincipalName),
                                                   UserPrincipalName: UserPrincipalName,
                                                   Department: Department,
                                                   JobTitle: JobTitle,
                                                   Picture: Blank()
                                              }
                                          ),
                                          "DisplayName",
                                          SortOrder.Ascending
                                      )
                                    SelectMultiple: =false
                                    X: =24
                        - Category_DataCard1_1:
                            Control: TypedDataCard
                            Variant: ComboBoxEdit
                            IsLocked: true
                            Properties:
                              DataField: ="Category"
                              Default: =ThisItem.Category
                              DisplayName: =fxTranslate("Kategorie", "Kategorie")
                              Required: =true
                              Update: =DataCardValue5_1.Selected
                              Width: =If(frm_change_1.NumberOfColumns = 1, Parent.Width, Parent.Width / 2)
                              X: =0
                              Y: =3
                            Children:
                              - DataCardKey5_1:
                                  Control: ModernText
                                  MetadataKey: FieldName
                                  Properties:
                                    AccessibleLabel: =fxTranslate("CategoryFieldLabel", "Feldbezeichnung Kategorie")
                                    AutoHeight: =true
                                    Color: =RGBA(17, 24, 39, 1)
                                    FontWeight: =FontWeight.Semibold
                                    Height: =22
                                    Size: =12
                                    Text: =fxTranslate("CategoryRequired", "Kategorie *")
                                    VerticalAlign: =VerticalAlign.Top
                                    Width: =Parent.Width - 48
                                    Wrap: =false
                                    X: =24
                                    Y: =8
                              - DataCardValue5_1:
                                  Control: ModernCombobox
                                  MetadataKey: FieldValue
                                  Properties:
                                    AccessibleLabel: =fxTranslate("SelectCategory", "Kategorie auswählen")
                                    AllowExternalSelectedItems: =false
                                    DefaultSelectedItems: =[Parent.Default]
                                    DisplayMode: =Parent.DisplayMode
                                    Height: =42
                                    InputTextPlaceholder: =fxTranslate("SelectCategoryPlaceholder", "Kategorie auswählen...")
                                    ItemDisplayText: =ThisItem.DisplayValue
                                    Items: =AddColumns(Choices([@ev_sp_list_tickets].Category), DisplayValue, fxTranslate(Value, Value))
                                    Required: =Parent.Required
                                    SelectMultiple: =false
                                    ValidationState: =If(IsBlank(Parent.Error), "None", "Error")
                                    Width: =Parent.Width - 50
                                    X: =24
                                    Y: =DataCardKey5_1.Y + DataCardKey5_1.Height + 4
                              - ErrorMessage5_1:
                                  Control: Text
                                  MetadataKey: ErrorMessage
                                  Properties:
                                    FontColor: =RGBA(255, 0, 0, 1)
                                    Height: =30
                                    Text: =Parent.Error
                                    Visible: =And(!IsBlank(Parent.Error), Parent.DisplayMode=DisplayMode.Edit)
                                    Width: =Parent.Width - 48
                                    X: =24
                                    Y: =DataCardValue5_1.Y + DataCardValue5_1.Height
                        - Subcategory_DataCard1_1:
                            Control: TypedDataCard
                            Variant: ComboBoxEdit
                            Properties:
                              DataField: ="Subcategory"
                              Default: =ThisItem.Subcategory
                              DisplayName: =fxTranslate("Subcategory", "Unterkategorie")
                              Required: =true
                              Update: =DataCardValue_Subcategory_1.Selected
                              Width: =Parent.Width
                              X: =0
                              Y: =4
                            Children:
                              - DataCardKey_Subcategory_1:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: =fxTranslate("SubcategoryFieldLabel", "Feldbezeichnung Unterkategorie")
                                    AutoHeight: =true
                                    Color: =RGBA(17, 24, 39, 1)
                                    FontWeight: =FontWeight.Semibold
                                    Height: =22
                                    Size: =12
                                    Text: =fxTranslate("SubcategoryRequired", "Unterkategorie *")
                                    VerticalAlign: =VerticalAlign.Top
                                    Width: =Parent.Width - 48
                                    Wrap: =false
                                    X: =24
                                    Y: =8
                              - DataCardValue_Subcategory_1:
                                  Control: ModernCombobox
                                  Properties:
                                    AccessibleLabel: =fxTranslate("SelectSubcategory", "Unterkategorie auswählen")
                                    AllowExternalSelectedItems: =false
                                    DefaultSelectedItems: =[Parent.Default]
                                    DisplayMode: =Parent.DisplayMode
                                    Height: =42
                                    InputTextPlaceholder: =fxTranslate("SelectSubcategoryPlaceholder", "Unterkategorie auswählen...")
                                    ItemDisplayText: =ThisItem.DisplayValue
                                    Items: =AddColumns(Choices([@ev_sp_list_tickets].Subcategory), DisplayValue, fxTranslate(Value, Value))
                                    Required: =Parent.Required
                                    SelectMultiple: =false
                                    ValidationState: =If(IsBlank(Parent.Error), "None", "Error")
                                    Width: =Parent.Width - 50
                                    X: =24
                                    Y: =DataCardKey_Subcategory_1.Y + DataCardKey_Subcategory_1.Height + 4
                              - ErrorMessage_Subcategory_1:
                                  Control: Text
                                  Properties:
                                    Height: =30
                                    Text: =Parent.Error
                                    Visible: =And(!IsBlank(Parent.Error), Parent.DisplayMode=DisplayMode.Edit)
                                    Width: =Parent.Width - 48
                                    X: =24
                                    Y: =DataCardValue_Subcategory_1.Y + DataCardValue_Subcategory_1.Height
                        - Priority_DataCard1_1:
                            Control: TypedDataCard
                            Variant: ComboBoxEdit
                            Properties:
                              DataField: ="Priority"
                              Default: =ThisItem.Priority
                              DisplayName: =fxTranslate("Priorität", "Priorität")
                              Required: =true
                              Update: =DataCardValue7_1.Selected
                              Width: =If(frm_change_1.NumberOfColumns = 1, Parent.Width, Parent.Width / 2)
                              X: =0
                              Y: =5
                            Children:
                              - DataCardKey7_1:
                                  Control: ModernText
                                  MetadataKey: FieldName
                                  Properties:
                                    AccessibleLabel: =fxTranslate("PriorityFieldLabel", "Feldbezeichnung Priorität")
                                    AutoHeight: =true
                                    Color: =RGBA(17, 24, 39, 1)
                                    FontWeight: =FontWeight.Semibold
                                    Height: =22
                                    Size: =12
                                    Text: =fxTranslate("PriorityRequired", "Priorität *")
                                    VerticalAlign: =VerticalAlign.Top
                                    Width: =Parent.Width - 48
                                    Wrap: =false
                                    X: =24
                                    Y: =8
                              - DataCardValue7_1:
                                  Control: ModernCombobox
                                  MetadataKey: FieldValue
                                  Properties:
                                    AccessibleLabel: =fxTranslate("SelectPriority", "Priorität auswählen")
                                    AllowExternalSelectedItems: =false
                                    DefaultSelectedItems: =[Parent.Default]
                                    DisplayMode: =Parent.DisplayMode
                                    Height: =42
                                    InputTextPlaceholder: =fxTranslate("SelectPriorityPlaceholder", "Priorität auswählen...")
                                    ItemDisplayText: =ThisItem.DisplayValue
                                    Items: =AddColumns(Choices([@ev_sp_list_tickets].Priority), DisplayValue, fxTranslate(Value, Value))
                                    Required: =Parent.Required
                                    SelectMultiple: =false
                                    ValidationState: =If(IsBlank(Parent.Error), "None", "Error")
                                    Width: =Parent.Width - 50
                                    X: =24
                                    Y: =DataCardKey7_1.Y + DataCardKey7_1.Height + 4
                              - ErrorMessage7_1:
                                  Control: Text
                                  MetadataKey: ErrorMessage
                                  Properties:
                                    Height: =30
                                    Text: =Parent.Error
                                    Visible: =And(!IsBlank(Parent.Error), Parent.DisplayMode=DisplayMode.Edit)
                                    Width: =Parent.Width - 48
                                    X: =24
                                    Y: =DataCardValue7_1.Y + DataCardValue7_1.Height
                              - lbl_priority_hint:
                                  Control: ModernText
                                  Properties:
                                    Color: =RGBA(107, 114, 128, 1)
                                    Size: =11
                                    Text: =Switch(DataCardValue7_1.Selected.Value, "Kritisch", fxTranslate("CriticalPriorityHint", "Stillstand - sofortige Reaktion"), "Hoch", fxTranslate("HighPriorityHint", "Arbeit eingeschränkt - selben Tag"), "Mittel", fxTranslate("MediumPriorityHint", "Normaler Support - 1-3 Werktage"), "Niedrig", fxTranslate("LowPriorityHint", "Best effort"), "")
                                    Width: =Parent.Width - 20
                                    Y: =DataCardValue7_1.Y + DataCardValue7_1.Height + 2
                        - Status_DataCard2:
