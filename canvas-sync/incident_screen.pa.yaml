Screens:
  incident_screen:
    Properties:
      Fill: =RGBA(248, 249, 252, 1)
      LoadingSpinnerColor: =RGBA(87, 35, 129, 1)
      OnVisible: |-
        =NewForm(frm_incident);
        Set(varIncidentHelpTitle, Blank());
        Set(varIncidentHelpText, Blank());
        Set(varIncidentDescriptionHintHidden, false);
        Set(varIncidentSubmitting, false)
    Children:
      - inc_root:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(248, 249, 252, 1)
            Height: =Parent.Height
            LayoutDirection: =LayoutDirection.Vertical
            Width: =Parent.Width
          Children:
            - dbd_topbar_2:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  Height: =72
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width
                Children:
                  - dbd_brand_container_2:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =Parent.Height
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =fxDbdControlGap
                        LayoutMinHeight: =0
                        LayoutMinWidth: =fxDbdSidebarWidth + (fxDbdPagePadding * 2)
                        PaddingLeft: =fxDbdPagePadding
                        PaddingRight: =fxDbdPagePadding
                        Width: =fxDbdSidebarWidth + (fxDbdPagePadding * 2)
                      Children:
                        - dbd_logo_2:
                            Control: ModernText
                            Properties:
                              Align: =Align.Center
                              Color: =RGBA(255, 255, 255, 1)
                              Fill: =RGBA(87, 35, 129, 1)
                              FontWeight: =FontWeight.Semibold
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              RadiusBottomLeft: =5
                              RadiusBottomRight: =5
                              RadiusTopLeft: =5
                              RadiusTopRight: =5
                              Size: =8
                              Text: ="KESSEL"
                              Width: =32
                        - dbd_topbar_title_2:
                            Control: ModernText
                            Properties:
                              Color: =RGBA(18, 31, 52, 1)
                              FillPortions: =1
                              FontWeight: =FontWeight.Semibold
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =16
                              Text: =fxTranslate("ItServicePortal", "IT Service Portal")
                              Wrap: =false
                  - dbd_header_spacer_2:
                      Control: GroupContainer
                      Variant: ManualLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Height: =Parent.Height
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                  - inc_language_selector:
                      Control: ModernDropdown
                      Properties:
                        AccessibleLabel: =fxTranslate("SelectLanguage", "Sprache auswählen")
                        Default: |-
                          =LookUp(Table({Code: "de", Label: "DE"}, {Code: "en", Label: "EN"}), Code = Coalesce(varCurrentLanguage, "de"))
                        Height: =34
                        ItemDisplayText: =ThisItem.Label
                        Items: |-
                          =Table({Code: "de", Label: "DE"}, {Code: "en", Label: "EN"})
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnChange: =Set(varCurrentLanguage, Coalesce(Self.Selected.Code, "de"))
                        Width: =72
                  - dbd_user_menu_2:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =40
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingLeft: =4
                        PaddingRight: =8
                        RadiusBottomLeft: =6
                        RadiusBottomRight: =6
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                        Width: =132
                      Children:
                        - dbd_avatar_2:
                            Control: ModernText
                            Properties:
                              Align: =Align.Center
                              Color: =RGBA(87, 35, 129, 1)
                              Fill: =RGBA(246, 241, 249, 1)
                              FontWeight: =FontWeight.Semibold
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              RadiusBottomLeft: =16
                              RadiusBottomRight: =16
                              RadiusTopLeft: =16
                              RadiusTopRight: =16
                              Size: =12
                              Text: =Upper(Left(fxCurrentUser.FullName, 2))
                              Width: =32
                        - dbd_user_name_2:
                            Control: ModernText
                            Properties:
                              Color: =RGBA(35, 39, 47, 1)
                              FillPortions: =1
                              FontWeight: =FontWeight.Semibold
                              Height: =24
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =12
                              Text: =Left(fxCurrentUser.FullName, Find(" ", fxCurrentUser.FullName & " ") - 1)
                              Width: =58
                              Wrap: =false
            - inc_body:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(248, 249, 252, 1)
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  PaddingBottom: =24
                  PaddingLeft: =36
                  PaddingRight: =36
                  PaddingTop: =24
                  Width: =Parent.Width
                Children:
                  - inc_title_block:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =86
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =6
                        Width: =Min(Parent.Width - 72, 1120)
                      Children:
                        - inc_title:
                            Control: ModernText
                            Properties:
                              AutoHeight: =true
                              Color: =RGBA(17, 24, 39, 1)
                              FontWeight: =FontWeight.Semibold
                              Height: =40
                              Size: =28
                              Text: =fxTranslate("ReportIncident", "Störung melden")
                              Width: =Parent.Width
                        - inc_subtitle:
                            Control: ModernText
                            Properties:
                              Color: =RGBA(82, 94, 115, 1)
                              Height: =34
                              Size: =16
                              Text: =fxTranslate("ReportIncidentIntro", "Beschreiben Sie das Problem so konkret wie möglich. Pflichtfelder sind markiert; Hinweise helfen beim Ausfüllen.")
                              Width: =Parent.Width
                  - inc_help_panel:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =RGBA(200, 179, 221, 1)
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(250, 247, 253, 1)
                        FillPortions: =0
                        Height: =0
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =4
                        PaddingBottom: =12
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =12
                        RadiusBottomLeft: =12
                        RadiusBottomRight: =12
                        RadiusTopLeft: =12
                        RadiusTopRight: =12
                        Visible: =false
                        Width: =Min(Parent.Width - 72, 1120)
                      Children:
                        - inc_help_title:
                            Control: ModernText
                            Properties:
                              Color: =RGBA(87, 35, 129, 1)
                              FontWeight: =FontWeight.Semibold
                              Height: =26
                              Size: =16
                              Text: =varIncidentHelpTitle
                              Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                        - inc_help_text:
                            Control: ModernText
                            Properties:
                              Color: =RGBA(49, 65, 88, 1)
                              Height: =34
                              Size: =14
                              Text: =varIncidentHelpText
                              Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                  - inc_content:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =1780
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =22
                        Width: =Min(Parent.Width - 72, 1120)
                      Children:
                        - inc_form_card:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =RGBA(226, 232, 240, 1)
                              BorderThickness: =1
                              DropShadow: =DropShadow.Semilight
                              Fill: =RGBA(255, 255, 255, 1)
                              LayoutDirection: =LayoutDirection.Vertical
                              PaddingBottom: =20
                              PaddingLeft: =20
                              PaddingRight: =20
                              PaddingTop: =20
                              RadiusBottomLeft: =14
                              RadiusBottomRight: =14
                              RadiusTopLeft: =14
                              RadiusTopRight: =14
                            Children:
                              - frm_incident:
                                  Control: Form
                                  Layout: Vertical
                                  Properties:
                                    DataSource: =ev_sp_list_tickets
                                    DefaultMode: =FormMode.New
                                    Fill: =RGBA(255, 255, 255, 1)
                                    Height: =Parent.Height - 40
                                    NumberOfColumns: =1
                                    OnFailure: |-
                                      =Set(varIncidentSubmitting, false);
                                      Set(
                                          varIncidentSubmitError,
                                          Coalesce(
                                              First(Errors(ev_sp_list_tickets)).Message,
                                              frm_incident.Error,
                                              fxTranslate("CheckRequiredFields", "Bitte prüfen Sie die Pflichtfelder.")
                                          )
                                      );
                                      Notify(Substitute(fxTranslate("IncidentTicketCreateFailed", "Das Incident-Ticket konnte nicht erstellt werden: {0}"), "{0}", varIncidentSubmitError), NotificationType.Error, 7000)
                                    OnSuccess: |-
                                      =Patch(ev_sp_list_tickets, frm_incident.LastSubmit, {Beobachter: varIncidentWatcherSelection});
                                      Set(varCurrentTicket, frm_incident.LastSubmit);
                                      Set(varTicketDetailId, frm_incident.LastSubmit.ID);
                                      IfError(
                                          create_attach_description.Run({ticketId: Text(varTicketDetailId), html: varIncidentDescriptionPayload}),
                                          Notify(fxTranslate("IncidentCreatedWithProcessingWarning", "Incident wurde erstellt, aber Beschreibung/Screenshots konnten nicht nachbearbeitet werden."), NotificationType.Warning, 5000),
                                          Notify(
                                              If(
                                                  varIncidentDescriptionHasInlineImages,
                                                  fxTranslate("IncidentCreatedImagesProcessing", "Incident wurde erstellt. Eingefügte Screenshots werden vorbereitet und erscheinen ggf. in Kürze."),
                                                  fxTranslate("IncidentCreated", "Incident wurde erstellt.")
                                              ),
                                              NotificationType.Success,
                                              5000
                                          )
                                      );
                                      Refresh(ev_sp_list_tickets);
                                      Set(varCurrentTicket, LookUp(ev_sp_list_tickets, ID = varTicketDetailId));
                                      Set(varIncidentSubmitting, false);
                                      Navigate(ticket_details_screen, ScreenTransition.Fade)
                                    Width: =Parent.Width - 40
                                  Children:
                                    - inc_requestedby_card:
                                        Control: TypedDataCard
                                        Variant: ComboBoxEdit
                                        Properties:
                                          DataField: ="RequestedBy"
                                          Default: =ThisItem.RequestedBy
                                          DisplayName: =fxTranslate("AffectedPerson", "Betroffene Person")
                                          Height: =150
                                          Required: =true
                                          Update: =inc_requestedby.Selected
                                          Width: =Parent.Width
                                          X: =0
                                          Y: =0
                                        Children:
                                          - inc_requestedby_label:
                                              Control: ModernText
                                              Properties:
                                                Color: =RGBA(17, 24, 39, 1)
                                                FontWeight: =FontWeight.Semibold
                                                Height: =34
                                                Text: ="* " & fxTranslate("AffectedPerson", "Betroffene Person")
                                                Width: =Parent.Width - 90
                                                X: =60
                                                Y: =6
                                          - inc_requestedby_info:
                                              Control: ModernText
                                              Properties:
                                                Align: =Align.Center
                                                Color: =RGBA(87, 35, 129, 1)
                                                Fill: =RGBA(245, 240, 250, 1)
                                                FontWeight: =FontWeight.Semibold
                                                Height: =40
                                                OnSelect: |-
                                                  =Set(varIncidentHelpTitle, fxTranslate("AffectedPerson", "Betroffene Person"));
                                                  Set(varIncidentHelpText, fxTranslate("AffectedPersonHelp", "Wählen Sie die Person aus, für die die Störung gemeldet wird. Wenn Sie selbst betroffen sind, lassen Sie Ihren Namen stehen."))
                                                RadiusBottomLeft: =20
                                                RadiusBottomRight: =20
                                                RadiusTopLeft: =20
                                                RadiusTopRight: =20
                                                Size: =13
                                                Text: ="i"
                                                Width: =40
                                                X: =4
                                                Y: =6
                                          - inc_requestedby_hint:
                                              Control: ModernText
                                              Properties:
                                                Color: =RGBA(100, 116, 139, 1)
                                                Height: =44
                                                Size: =13
                                                Text: =fxTranslate("AffectedPersonHint", "Für wen soll die Störung gemeldet werden? Standardmäßig sind Sie vorausgewählt.")
                                                Width: =Parent.Width - 16
                                                X: =4
                                                Y: =42
                                          - inc_requestedby:
                                              Control: ModernCombobox
                                              Properties:
                                                DefaultSelectedItems: |-
                                                  =With(
                                                      {profile: 'Office365-Benutzer'.MyProfile()},
                                                      Table(
                                                          {
                                                               Claims: "i:0#.f|membership|" & Lower(Coalesce(profile.UserPrincipalName, profile.Mail)),
                                                               DisplayName: profile.DisplayName,
                                                               Email: Coalesce(profile.Mail, profile.UserPrincipalName),
                                                               UserPrincipalName: profile.UserPrincipalName,
                                                               Department: profile.Department,
                                                               JobTitle: profile.JobTitle,
                                                               Picture: Blank()
                                                          }
                                                      )
                                                  )
                                                DisplayMode: =Parent.DisplayMode
                                                Height: =46
                                                InputTextPlaceholder: =fxTranslate("SearchPersonPlaceholder", "Person suchen...")
                                                ItemDisplayText: =ThisItem.DisplayName
                                                Items: |-
                                                  =SortByColumns(
                                                      ForAll(
                                                          Filter(
                                                              'Office365-Benutzer'.SearchUser({searchTerm: Trim(Self.SearchText)}),
                                                              AccountEnabled = true &&
                                                              !IsBlank(DisplayName) &&
                                                              !IsBlank(Coalesce(Mail, UserPrincipalName)) &&
                                                              (EndsWith(Lower(Mail), "@kessel.de") Or EndsWith(Lower(UserPrincipalName), "@kessel.de")) &&
                                                              CountRows(Split(Trim(DisplayName), " ")) >= 2 &&
                                                              !StartsWith(Lower(DisplayName), "aaa") &&
                                                              !StartsWith(Lower(UserPrincipalName), "aaa") &&
                                                              !StartsWith(Lower(MailNickname), "aaa") &&
                                                              !StartsWith(Lower(DisplayName), "admin") &&
                                                              !StartsWith(Lower(UserPrincipalName), "admin") &&
                                                              !StartsWith(Lower(MailNickname), "admin") &&
                                                              !StartsWith(Lower(DisplayName), "adm ") &&
                                                              !StartsWith(Lower(DisplayName), "abteilungsleiter") &&
                                                              !StartsWith(Lower(DisplayName), "administrator") &&
                                                              !StartsWith(Lower(DisplayName), "service") &&
                                                              !StartsWith(Lower(DisplayName), "test")
                                                          ),
                                                          {
                                                               Claims: "i:0#.f|membership|" & Lower(Coalesce(UserPrincipalName, Mail)),
                                                               DisplayName: DisplayName,
                                                               Email: Coalesce(Mail, UserPrincipalName),
                                                               UserPrincipalName: UserPrincipalName,
                                                               Department: Department,
                                                               JobTitle: JobTitle,
                                                               Picture: Blank()
                                                          }
                                                      ),
                                                      "DisplayName",
                                                      SortOrder.Ascending
                                                  )
                                                Required: =Parent.Required
                                                SelectMultiple: =false
                                                ValidationState: =If(IsBlank(Parent.Error), "None", "Error")
                                                Width: =Parent.Width - 8
                                                X: =4
                                                Y: =92
                                    - inc_watchers_card:
                                        Control: TypedDataCard
                                        Variant: ComboBoxEdit
                                        Properties:
                                          DataField: ="Beobachter"
                                          Default: =First(ThisItem.Beobachter)
                                          DisplayName: =fxTranslate("WatchList", "Beobachtungsliste")
                                          Height: =150
                                          Required: =false
                                          Update: =First(varIncidentWatcherSelection)
                                          Width: =Parent.Width
                                          X: =0
                                          Y: =1
                                        Children:
                                          - inc_watchers_label:
                                              Control: ModernText
                                              Properties:
                                                FontWeight: =FontWeight.Semibold
                                                Height: =34
                                                Text: =fxTranslate("WatchList", "Beobachtungsliste")
                                                Width: =Parent.Width - 90
                                                X: =60
                                                Y: =6
                                          - inc_watchers_info:
                                              Control: ModernText
                                              Properties:
                                                Align: =Align.Center
                                                Color: =RGBA(87, 35, 129, 1)
                                                Fill: =RGBA(245, 240, 250, 1)
                                                FontWeight: =FontWeight.Semibold
                                                Height: =40
                                                OnSelect: |-
                                                  =Set(varIncidentHelpTitle, fxTranslate("WatchList", "Beobachtungsliste"));
                                                  Set(varIncidentHelpText, fxTranslate("WatchListHelp", "Optional: Fügen Sie Personen hinzu, die Status-Updates zu diesem Incident erhalten sollen."))
                                                RadiusBottomLeft: =20
                                                RadiusBottomRight: =20
                                                RadiusTopLeft: =20
                                                RadiusTopRight: =20
                                                Size: =13
                                                Text: ="i"
                                                Width: =40
                                                X: =4
                                                Y: =6
                                          - inc_watchers_hint:
                                              Control: ModernText
                                              Properties:
                                                Color: =RGBA(100, 116, 139, 1)
                                                Height: =44
                                                Size: =13
                                                Text: |-
                                                  =fxTranslate("WatchListHint", "Optional: Personen, die Status-Updates zu diesem Incident erhalten sollen.")
                                                Width: =Parent.Width - 16
                                                X: =4
                                                Y: =42
                                          - inc_watchers:
                                              Control: ModernCombobox
                                              Properties:
                                                DefaultSelectedItems: =[Parent.Default]
                                                DisplayMode: =Parent.DisplayMode
                                                Height: =46
                                                InputTextPlaceholder: =fxTranslate("AddPersonPlaceholder", "Person hinzufügen...")
                                                ItemDisplayText: =ThisItem.DisplayName
                                                Items: |-
                                                  =SortByColumns(
                                                      ForAll(
                                                          Filter(
                                                              'Office365-Benutzer'.SearchUser({searchTerm: Trim(Self.SearchText)}),
                                                              AccountEnabled = true &&
                                                              !IsBlank(DisplayName) &&
                                                              !IsBlank(Coalesce(Mail, UserPrincipalName)) &&
                                                              (EndsWith(Lower(Mail), "@kessel.de") Or EndsWith(Lower(UserPrincipalName), "@kessel.de")) &&
                                                              CountRows(Split(Trim(DisplayName), " ")) >= 2 &&
                                                              !StartsWith(Lower(DisplayName), "aaa") &&
                                                              !StartsWith(Lower(UserPrincipalName), "aaa") &&
                                                              !StartsWith(Lower(MailNickname), "aaa") &&
                                                              !StartsWith(Lower(DisplayName), "admin") &&
                                                              !StartsWith(Lower(UserPrincipalName), "admin") &&
                                                              !StartsWith(Lower(MailNickname), "admin") &&
                                                              !StartsWith(Lower(DisplayName), "adm ") &&
                                                              !StartsWith(Lower(DisplayName), "abteilungsleiter") &&
                                                              !StartsWith(Lower(DisplayName), "administrator") &&
                                                              !StartsWith(Lower(DisplayName), "service") &&
                                                              !StartsWith(Lower(DisplayName), "test")
                                                          ),
                                                          {
                                                               Claims: "i:0#.f|membership|" & Lower(Coalesce(UserPrincipalName, Mail)),
                                                               DisplayName: DisplayName,
                                                               Email: Coalesce(Mail, UserPrincipalName),
                                                               UserPrincipalName: UserPrincipalName,
                                                               Department: Department,
                                                               JobTitle: JobTitle,
                                                               Picture: Blank()
                                                          }
                                                      ),
                                                      "DisplayName",
                                                      SortOrder.Ascending
                                                  )
                                                Width: =Parent.Width - 8
                                                X: =4
                                                Y: =92
                                    - inc_category_card:
                                        Control: TypedDataCard
                                        Variant: ComboBoxEdit
                                        Properties:
                                          DataField: ="CategoryINC"
                                          Default: =ThisItem.CategoryINC
                                          DisplayName: =fxTranslate("Kategorie", "Kategorie")
                                          Height: =150
                                          Required: =true
                                          Update: =inc_category.Selected
                                          Width: =Parent.Width
                                          X: =0
                                          Y: =2
                                        Children:
                                          - inc_category_label:
                                              Control: ModernText
                                              Properties:
                                                FontWeight: =FontWeight.Semibold
                                                Height: =34
                                                Text: ="* " & fxTranslate("Kategorie", "Kategorie")
                                                Width: =Parent.Width - 90
                                                X: =60
                                                Y: =6
                                          - inc_category_info:
                                              Control: ModernText
                                              Properties:
                                                Align: =Align.Center
                                                Color: =RGBA(87, 35, 129, 1)
                                                Fill: =RGBA(245, 240, 250, 1)
                                                FontWeight: =FontWeight.Semibold
                                                Height: =40
                                                OnSelect: |-
                                                  =Set(varIncidentHelpTitle, fxTranslate("Kategorie", "Kategorie"));
                                                  Set(varIncidentHelpText, fxTranslate("CategoryHelp", "Wählen Sie den groben Bereich der Störung aus, zum Beispiel Arbeitsplatz, Netzwerk, Telefonie oder eine Anwendung."))
                                                RadiusBottomLeft: =20
                                                RadiusBottomRight: =20
                                                RadiusTopLeft: =20
                                                RadiusTopRight: =20
                                                Size: =13
                                                Text: ="i"
                                                Width: =40
                                                X: =4
                                                Y: =6
                                          - inc_category_hint:
                                              Control: ModernText
                                              Properties:
                                                Color: =RGBA(100, 116, 139, 1)
                                                Height: =44
                                                Size: =13
                                                Text: =fxTranslate("CategoryHint", "Ordnen Sie die Störung grob ein, zum Beispiel Arbeitsplatz, Netzwerk oder Anwendung.")
                                                Width: =Parent.Width - 16
                                                X: =4
                                                Y: =42
                                          - inc_category:
                                              Control: ModernCombobox
                                              Properties:
                                                AllowExternalSelectedItems: =false
                                                DefaultSelectedItems: =[Parent.Default]
                                                DisplayMode: =Parent.DisplayMode
                                                Height: =46
                                                InputTextPlaceholder: =fxTranslate("SelectCategoryPlaceholder", "Kategorie auswählen...")
                                                ItemDisplayText: =ThisItem.DisplayValue
                                                Items: =AddColumns(Choices([@ev_sp_list_tickets].CategoryINC), DisplayValue, fxTranslate(Value, Value))
                                                Required: =Parent.Required
                                                SelectMultiple: =false
                                                ValidationState: =If(IsBlank(Parent.Error), "None", "Error")
                                                Width: =Parent.Width - 8
                                                X: =4
                                                Y: =92
                                    - inc_subcategory_card:
                                        Control: TypedDataCard
                                        Variant: ComboBoxEdit
                                        Properties:
                                          DataField: ="SubcategoryINC"
                                          Default: =ThisItem.SubcategoryINC
                                          DisplayName: =fxTranslate("Subcategory", "Unterkategorie")
                                          Height: =150
                                          Required: =true
                                          Update: =inc_subcategory.Selected
                                          Width: =Parent.Width
                                          X: =0
                                          Y: =3
                                        Children:
                                          - inc_subcategory_label:
                                              Control: ModernText
                                              Properties:
                                                FontWeight: =FontWeight.Semibold
                                                Height: =34
                                                Text: ="* " & fxTranslate("Subcategory", "Unterkategorie")
                                                Width: =Parent.Width - 90
                                                X: =60
                                                Y: =6
                                          - inc_subcategory_info:
                                              Control: ModernText
                                              Properties:
                                                Align: =Align.Center
                                                Color: =RGBA(87, 35, 129, 1)
                                                Fill: =RGBA(245, 240, 250, 1)
                                                FontWeight: =FontWeight.Semibold
                                                Height: =40
                                                OnSelect: |-
                                                  =Set(varIncidentHelpTitle, fxTranslate("Subcategory", "Unterkategorie"));
                                                  Set(varIncidentHelpText, fxTranslate("SubcategoryHelp", "Wählen Sie die genauere Einordnung. Sie hilft dem Support, das Ticket direkt an die richtige Stelle zu geben."))
                                                RadiusBottomLeft: =20
                                                RadiusBottomRight: =20
                                                RadiusTopLeft: =20
                                                RadiusTopRight: =20
                                                Size: =13
                                                Text: ="i"
                                                Width: =40
                                                X: =4
                                                Y: =6
                                          - inc_subcategory_hint:
                                              Control: ModernText
                                              Properties:
                                                Color: =RGBA(100, 116, 139, 1)
                                                Height: =44
                                                Size: =13
                                                Text: =fxTranslate("SubcategoryHint", "Wählen Sie die genauere Einordnung. Die Werte können später an Ihre Struktur angepasst werden.")
                                                Width: =Parent.Width - 16
                                                X: =4
                                                Y: =42
                                          - inc_subcategory:
                                              Control: ModernCombobox
                                              Properties:
                                                AllowExternalSelectedItems: =false
                                                DefaultSelectedItems: =[Parent.Default]
                                                DisplayMode: =Parent.DisplayMode
                                                Height: =46
                                                InputTextPlaceholder: =fxTranslate("SelectSubcategoryPlaceholder", "Unterkategorie auswählen...")
                                                ItemDisplayText: =ThisItem.DisplayValue
                                                Items: =AddColumns(Choices([@ev_sp_list_tickets].SubcategoryINC), DisplayValue, fxTranslate(Value, Value))
                                                Required: =Parent.Required
                                                SelectMultiple: =false
