                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                  LayoutOverflowX: =LayoutOverflow.Scroll
                  PaddingBottom: =14
                  PaddingLeft: =28
                  PaddingRight: =28
                  PaddingTop: =14
                  Width: =Parent.Width
                Children:
                  - inc_footer_left:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =48
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =10
                        Width: =340
                      Children:
                        - inc_overview:
                            Control: ModernButton
                            Properties:
                              Appearance: =ButtonAppearance.Secondary
                              DisplayMode: =If(varIncidentSubmitting, DisplayMode.Disabled, DisplayMode.Edit)
                              Height: =40
                              Icon: ="Home"
                              OnSelect: =Navigate(dashboard_screen_v2, ScreenTransition.Fade)
                              Text: =fxTranslate("BackToOverview", "Zurück zur Übersicht")
                              Width: =190
                        - inc_cancel:
                            Control: ModernButton
                            Properties:
                              Appearance: =ButtonAppearance.Secondary
                              DisplayMode: =If(varIncidentSubmitting, DisplayMode.Disabled, DisplayMode.Edit)
                              Height: =40
                              Icon: ="Dismiss"
                              OnSelect: |-
                                =If(
                                    frm_incident.Unsaved,
                                    If(
                                        Confirm(
                                            "Dieser Vorgang kann nicht rückgängig gemacht werden.",
                                            {
                                                Subtitle: "Incident verwerfen?",
                                                ConfirmButton: "Verwerfen",
                                                CancelButton: "Abbrechen"
                                            }
                                        ),
                                        ResetForm(frm_incident);
                                        Navigate(request_type_screen, ScreenTransition.CoverRight)
                                    ),
                                    ResetForm(frm_incident);
                                    Navigate(request_type_screen, ScreenTransition.CoverRight)
                                )
                              Text: =fxTranslate("Cancel", "Abbrechen")
                              Width: =130
                  - inc_cancel_old:
                      Control: ModernButton
                      Properties:
                        Appearance: =ButtonAppearance.Secondary
                        DisplayMode: =If(varIncidentSubmitting Or CountRows(inc_requestedby.SelectedItems) = 0 Or IsBlank(inc_category.Selected) Or IsBlank(inc_subcategory.Selected) Or IsBlank(inc_priority.Selected) Or IsBlank(Trim(inc_name.Text)) Or IsBlank(Trim(PlainText(inc_description.HtmlText))) Or IsBlank(inc_affected.Selected.Value), DisplayMode.Disabled, DisplayMode.Edit)
                        Height: =0
                        Icon: ="Dismiss"
                        OnSelect: |-
                          =If(
                              frm_incident.Unsaved,
                              If(
                                  Confirm(
                                      "Dieser Vorgang kann nicht rückgängig gemacht werden.",
                                      {
                                          Subtitle: "Incident verwerfen?",
                                          ConfirmButton: "Verwerfen",
                                          CancelButton: "Abbrechen"
                                      }
                                  ),
                                  ResetForm(frm_incident);
                                  Navigate(request_type_screen, ScreenTransition.CoverRight)
                              ),
                              ResetForm(frm_incident);
                              Navigate(request_type_screen, ScreenTransition.CoverRight)
                          )
                        Text: =fxTranslate("Cancel", "Abbrechen")
                        Visible: =false
                        Width: =0
                  - inc_submit:
                      Control: ModernButton
                      Properties:
                        DisplayMode: =If(varIncidentSubmitting Or CountRows(inc_requestedby.SelectedItems) = 0 Or CountRows(inc_category.SelectedItems) = 0 Or CountRows(inc_subcategory.SelectedItems) = 0 Or CountRows(inc_priority.SelectedItems) = 0 Or IsBlank(Trim(inc_name.Text)) Or IsBlank(Trim(PlainText(inc_description.HtmlText))) Or IsBlank(Coalesce(inc_affected.Selected.Value, "")), DisplayMode.Disabled, DisplayMode.Edit)
                        Height: =40
                        Icon: ="Checkmark"
                        OnSelect: |-
                          =Set(varIncidentValidationAttempted, true);
                          Set(
                              varIncidentDescriptionHtml,
                              If(
                                  IsBlank(varSelectedService),
                                  "",
                                  "<p><strong>Service:</strong> " & varSelectedService & "</p>"
                              ) & inc_description.HtmlText
                          );
                          Set(
                              varIncidentDescriptionHasInlineImages,
                              CountRows(
                                  MatchAll(
                                      varIncidentDescriptionHtml,
                                      "data:image/[A-Za-z0-9.+-]+;base64,[A-Za-z0-9+/=]+"
                                  )
                              ) > 0
                          );
                          Set(
                              varIncidentDescriptionPayload,
                              JSON(
                                  {
                                      schemaVersion: 1,
                                      richTextHtml: varIncidentDescriptionHtml,
                                      screenshots: ForAll(
                                          MatchAll(
                                              varIncidentDescriptionHtml,
                                              "data:image/[A-Za-z0-9.+-]+;base64,[A-Za-z0-9+/=]+"
                                          ),
                                          {
                                              id: "inline-" & Text(StartMatch),
                                              dataUri: FullMatch
                                          }
                                      )
                                  },
                                  JSONFormat.Compact
                              )
                          );
                           Set(
                               varIncidentWatcherSelection,
                               ForAll(
                                   Filter(
                                       inc_watchers.SelectedItems,
                                       !IsBlank(Trim(Coalesce(UserPrincipalName, Email)))
                                   ) As watcher,
                                   {
                                        Claims: "i:0#.f|membership|" & Lower(Trim(Coalesce(watcher.UserPrincipalName, watcher.Email))),
                                        DisplayName: watcher.DisplayName,
                                        Email: Trim(Coalesce(watcher.Email, watcher.UserPrincipalName)),
                                       Department: watcher.Department,
                                       JobTitle: watcher.JobTitle,
                                       Picture: Blank()
                                   }
                               )
                           );
                          Set(
                              varIncidentSubmitting,
                              true
                           );
                           Set(varIncidentSubmitError, Blank());
                            If(
                                 IsBlank(Trim(PlainText(inc_description.HtmlText))) Or CountRows(inc_requestedby.SelectedItems) = 0 Or CountRows(inc_category.SelectedItems) = 0 Or CountRows(inc_subcategory.SelectedItems) = 0 Or CountRows(inc_priority.SelectedItems) = 0 Or IsBlank(Trim(inc_name.Text)) Or IsBlank(Coalesce(inc_affected.Selected.Value, "")),
                                Set(varIncidentSubmitError, fxTranslate("RequiredFieldsMissing", "Bitte füllen Sie alle Pflichtfelder aus. Die fehlenden Felder sind rot markiert."))
                            );
                            If(
                               IsBlank(Trim(Coalesce(inc_requestedby.Selected.UserPrincipalName, inc_requestedby.Selected.Email))),
                               Set(varIncidentSubmitError, fxTranslate("RequesterEmailMissing", "Für die betroffene Person konnte keine Benutzer-E-Mail-Adresse ermittelt werden."))
                           );
                           If(
                               !IsBlank(varIncidentSubmitError),
                               Set(varIncidentSubmitting, false);
                               Notify(
                                   Substitute(fxTranslate("IncidentTicketCreateFailed", "Das Incident-Ticket konnte nicht erstellt werden: {0}"), "{0}", varIncidentSubmitError),
                                   NotificationType.Error,
                                   7000
                               ),
                               IfError(
                                   Set(
                                       varCurrentTicket,
                                       Patch(
                                           ev_sp_list_tickets,
                                           Defaults(ev_sp_list_tickets),
                                           {
                                               Title: inc_name.Text,
                                               TicketTitel: inc_name.Text,
                                               RequestedBy: inc_requestedby.Selected,
                                               CategoryINC: inc_category.Selected,
                                               SubcategoryINC: inc_subcategory.Selected,
                                               Priority: inc_priority.Selected,
                                               Description: varIncidentDescriptionHtml,
                                               Reason: inc_affected.Selected.Value,
                                               MorePeople: If(inc_affected.Selected.Value = "Mehrere Personen", Trim(inc_affected_details.Text), Blank()),
                                               TicketType: {Value: "Incident"},
                                               Status: {Value: "Offen"},
                                               StatusINC: {Value: "Offen"}
                                           }
                                       )
                                   );
                                   Set(varTicketDetailId, varCurrentTicket.ID);
                                   IfError(
                                       Patch(ev_sp_list_tickets, varCurrentTicket, {Beobachter: varIncidentWatcherSelection}),
                                       Notify(fxTranslate("IncidentCreatedWatcherFailed", "Incident wurde erstellt, aber die Beobachter konnten nicht gespeichert werden."), NotificationType.Warning, 5000)
                                   );
                                   IfError(
                                       create_attach_description.Run({ticketId: Text(varTicketDetailId), html: varIncidentDescriptionPayload}),
                                       Notify(fxTranslate("IncidentCreatedWithProcessingWarning", "Incident wurde erstellt, aber Beschreibung/Screenshots konnten nicht nachbearbeitet werden."), NotificationType.Warning, 5000),
                                       Notify(
                                           If(
                                               varIncidentDescriptionHasInlineImages,
                                               fxTranslate("IncidentCreatedImagesProcessing", "Incident wurde erstellt. Eingefügte Screenshots werden vorbereitet und erscheinen ggf. in Kürze."),
                                               fxTranslate("IncidentCreated", "Incident wurde erstellt.")
                                           ),
                                           NotificationType.Success,
                                           5000
                                       )
                                   );
                                   Refresh(ev_sp_list_tickets);
                                   Set(varCurrentTicket, LookUp(ev_sp_list_tickets, ID = varTicketDetailId));
                                   ResetForm(frm_incident);
                                   Set(varIncidentSubmitting, false);
                                   Navigate(ticket_details_screen, ScreenTransition.Fade),
                                   Set(varIncidentSubmitting, false);
                                   Notify(
                                       Substitute(fxTranslate("IncidentTicketCreateFailed", "Das Incident-Ticket konnte nicht erstellt werden: {0}"), "{0}", Coalesce(FirstError.Message, fxTranslate("UnknownError", "Unbekannter Fehler."))),
                                       NotificationType.Error,
                                       7000
                                   )
                               )
                            )
                        Text: =If(varIncidentSubmitting, fxTranslate("IncidentBeingCreated", "Incident wird erstellt..."), fxTranslate("CreateIncident", "Incident erstellen"))
                        Width: =170
      - inc_help_overlay:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(17, 24, 39, 0.18)
            Height: =Parent.Height
            Visible: =!IsBlank(varIncidentHelpTitle)
            Width: =Parent.Width
          Children:
            - inc_help_popup:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  BorderColor: =RGBA(200, 179, 221, 1)
                  BorderThickness: =1
                  DropShadow: =DropShadow.Semibold
                  Fill: =RGBA(255, 255, 255, 1)
                  Height: =260
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =10
                  PaddingBottom: =22
                  PaddingLeft: =24
                  PaddingRight: =24
                  PaddingTop: =20
                  RadiusBottomLeft: =18
                  RadiusBottomRight: =18
                  RadiusTopLeft: =18
                  RadiusTopRight: =18
                  Width: =Min(520, Parent.Width - 80)
                  X: =(Parent.Width - Self.Width) / 2
                  Y: =Max(96, (Parent.Height - Self.Height) / 2)
                Children:
                  - inc_help_popup_header:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =42
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =12
                        Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                      Children:
                        - inc_help_popup_icon:
                            Control: ModernText
                            Properties:
                              Align: =Align.Center
                              Color: =RGBA(87, 35, 129, 1)
                              Fill: =RGBA(245, 240, 250, 1)
                              FontWeight: =FontWeight.Semibold
                              Height: =40
                              RadiusBottomLeft: =20
                              RadiusBottomRight: =20
                              RadiusTopLeft: =20
                              RadiusTopRight: =20
                              Size: =16
                              Text: ="i"
                              Width: =40
                        - inc_help_popup_title:
                            Control: ModernText
                            Properties:
                              Color: =RGBA(17, 24, 39, 1)
                              FillPortions: =1
                              FontWeight: =FontWeight.Semibold
                              Height: =38
                              Size: =20
                              Text: =varIncidentHelpTitle
                        - inc_help_popup_close:
                            Control: ModernButton
                            Properties:
                              Appearance: =ButtonAppearance.Subtle
                              Height: =36
                              Icon: ="Dismiss"
                              Layout: =ButtonLayout.IconOnly
                              OnSelect: |-
                                =Set(varIncidentHelpTitle, Blank());
                                Set(varIncidentHelpText, Blank())
                              Width: =36
                  - inc_help_popup_text:
                      Control: ModernText
                      Properties:
                        Color: =RGBA(49, 65, 88, 1)
                        Height: =128
                        Size: =16
                        Text: =varIncidentHelpText
                        Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                  - inc_help_popup_ok:
                      Control: ModernButton
                      Properties:
                        AlignInContainer: =AlignInContainer.End
                        Appearance: =ButtonAppearance.Secondary
                        Height: =42
                        OnSelect: |-
                          =Set(varIncidentHelpTitle, Blank());
                          Set(varIncidentHelpText, Blank())
                        Text: =fxTranslate("Close", "Schließen")
                        Width: =120
