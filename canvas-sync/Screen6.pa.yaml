                                              LookUp(
                                                  ev_sp_list_config_dropdown,
                                                  FilterName = "ClosedStatus" And TargetList = "Ticket" And Active = true And FilterValue = Coalesce(
                                                      ticket.Status.Value,
                                                      ticket.StatusINC.Value,
                                                      ""
                                                  )
                                              )
                                          )
                                      ),
                                      "requested",
                                      Filter(
                                          fxFilteredDashboardTickets,
                                          RequestedBy.Email = fxCurrentUser.Email Or 'Erstellt von'.Email = fxCurrentUser.Email
                                      ),
                                      "assigned",
                                       Filter(
                                           fxFilteredDashboardTickets As ticket,
                                           !IsBlank(
                                               LookUp(
                                                   ticket.'Zugewiesen an',
                                                   Lower(Email) = Lower(fxCurrentUser.Email)
                                               )
                                           )
                                      ),
                                      fxFilteredDashboardTickets
                                  )
                              },
                              SortByColumns(
                                  ForAll(
                                      quickFilteredTickets As ticket,
                                      {
                                          GridID: ticket.ID,
                                          GridTicketId: Coalesce(
                                              ticket.TicketId,
                                              ticket.Titel,
                                              Text(ticket.ID)
                                          ),
                                          GridTitle: Concatenate(
                                              If(
                                                  !IsBlank(
                                                      LookUp(
                                                          fxDbdNotifications,
                                                          TicketId = ticket.ID
                                                      )
                                                  ),
                                                  "* ",
                                                  ""
                                              ),
                                              Coalesce(
                                                  ticket.TicketTitel,
                                                  ticket.Titel,
                                                  fxTranslate(
                                                      "NoTitle",
                                                      "Ohne Titel"
                                                  )
                                              )
                                          ),
                                          GridRequester: Text(
                                              Coalesce(
                                                  ticket.RequestedBy.DisplayName,
                                                  ticket.RequestedBy.Email,
                                                  "-"
                                              )
                                          ),
                                           GridAssigneeName: Coalesce(
                                               Concat(
                                                   ticket.'Zugewiesen an' As assignee,
                                                   Coalesce(assignee.DisplayName, assignee.Email),
                                                   ", "
                                               ),
                                               fxTranslate(
                                                  "NotAssigned",
                                                  "Nicht zugewiesen"
                                              )
                                          ),
                                          GridStatus: With(
                                              {
                                                  statusValue: Coalesce(
                                                      ticket.Status.Value,
                                                      ticket.StatusINC.Value,
                                                      ""
                                                  )
                                              },
                                              Switch(
                                                  statusValue,
                                                  "Offen",
                                                  "○ ",
                                                  "Zugewiesen",
                                                  "→ ",
                                                  "In Bearbeitung",
                                                  "▶ ",
                                                  "Warten auf Anforderer",
                                                  "Ⅱ ",
                                                  "Gelöst",
                                                  "✓ ",
                                                  "Geschlossen",
                                                  "■ ",
                                                  "- "
                                              ) & fxTranslate(
                                                  statusValue,
                                                  Coalesce(
                                                      statusValue,
                                                      fxTranslate(
                                                          "NotSet",
                                                          "Nicht gesetzt"
                                                      )
                                                  )
                                              )
                                          ),
                                          GridPriority: fxTranslate(
                                              Coalesce(
                                                  ticket.Priority.Value,
                                                  ""
                                              ),
                                              Coalesce(
                                                  ticket.Priority.Value,
                                                  fxTranslate(
                                                      "NotSet",
                                                      "Nicht gesetzt"
                                                  )
                                              )
                                          ),
                                          GridUpdated: Text(
                                              ticket.Geändert,
                                              "[$-de-DE]dd.mm. HH:mm"
                                          )
                                      }
                                  ),
                                  "GridID",
                                  SortOrder.Descending
                              )
                          )
                        LayoutMinHeight: =240
                        LayoutMinWidth: =0
                        OnChange: |-
                          =If(
                              !IsBlank(Self.Selected.GridID),
                              Set(varCurrentTicket, LookUp(ev_sp_list_tickets, ID = Self.Selected.GridID));
                              Set(varLastViewedTicketId, Self.Selected.GridID);
                              Set(varTicketLoadedModified, varCurrentTicket.Geändert);
                              Navigate(ticket_details_screen, ScreenTransition.None)
                          )
                        SelectMultiple: =false
                        ShowAIRowSummary: =false
                        ShowSelector: =false
                        Width: =Parent.Width
                      Children:
                        - TicketUpdatedTableColumn6:
                            Control: ModernDataGridColumn
                            Variant: Textual
                            IsLocked: true
                            Properties:
                              FieldDisplayName: =fxTranslate("Updated", "Aktualisiert")
                              FieldName: ="%DATACARD_FIELD_NAME.ID%"
                              FieldVariantName: ="%DATACARD_FIELD_VARIANT_NAME.ID%"
                              Text: =ThisItem.GridUpdated
                              Visible: =App.Width >= 900
                              Width: =120
                        - TicketPriorityTableColumn6:
                            Control: ModernDataGridColumn
                            Variant: Textual
                            IsLocked: true
                            Properties:
                              FieldDisplayName: =fxTranslate("Priority", "Priorität")
                              FieldName: ="%DATACARD_FIELD_NAME.ID%"
                              FieldVariantName: ="%DATACARD_FIELD_VARIANT_NAME.ID%"
                              Text: =ThisItem.GridPriority
                              Visible: =App.Width >= 1000
                              Width: =100
                        - TicketStatusTableColumn6:
                            Control: ModernDataGridColumn
                            Variant: Textual
                            IsLocked: true
                            Properties:
                              FieldDisplayName: =fxTranslate("Status", "Status")
                              FieldName: ="%DATACARD_FIELD_NAME.ID%"
                              FieldVariantName: ="%DATACARD_FIELD_VARIANT_NAME.ID%"
                              Text: =ThisItem.GridStatus
                              Width: =130
                        - TicketAssigneeTableColumn6:
                            Control: ModernDataGridColumn
                            Variant: Textual
                            IsLocked: true
                            Properties:
                              FieldDisplayName: =fxTranslate("Assignee", "Bearbeiter")
                              FieldName: ="%DATACARD_FIELD_NAME.ID%"
                              FieldVariantName: ="%DATACARD_FIELD_VARIANT_NAME.ID%"
                              Text: =ThisItem.GridAssigneeName
                              Visible: =fxIsAgentExperience && App.Width >= 1100
                              Width: =160
                        - TicketRequesterTableColumn6:
                            Control: ModernDataGridColumn
                            Variant: Textual
                            IsLocked: true
                            Properties:
                              FieldDisplayName: =fxTranslate("Requester", "Anforderer")
                              FieldName: ="%DATACARD_FIELD_NAME.ID%"
                              FieldVariantName: ="%DATACARD_FIELD_VARIANT_NAME.ID%"
                              Text: =ThisItem.GridRequester
                              Visible: =App.Width >= 850
                              Width: =160
                        - TicketTitleTableColumn6:
                            Control: ModernDataGridColumn
                            Variant: Textual
                            IsLocked: true
                            Properties:
                              FieldDisplayName: =fxTranslate("Title", "Titel")
                              FieldName: ="%DATACARD_FIELD_NAME.ID%"
                              FieldVariantName: ="%DATACARD_FIELD_VARIANT_NAME.ID%"
                              Text: =ThisItem.GridTitle
                              Width: |-
                                =Max(
                                    260,
                                    Parent.Width
                                        - 120
                                        - 130
                                        - If(App.Width >= 850, 160, 0)
                                        - If(fxIsAgentExperience && App.Width >= 1100, 160, 0)
                                        - If(App.Width >= 1000, 100, 0)
                                        - If(App.Width >= 900, 120, 0)
                                        - 24
                                )
                        - TicketIdTableColumn6:
                            Control: ModernDataGridColumn
                            Variant: Textual
                            IsLocked: true
                            Properties:
                              FieldDisplayName: =fxTranslate("TicketId", "Ticket ID")
                              FieldName: ="%DATACARD_FIELD_NAME.ID%"
                              FieldVariantName: ="%DATACARD_FIELD_VARIANT_NAME.ID%"
                              Text: =ThisItem.GridTicketId
                              Width: =120
                  - TicketsEmpty6:
                      Control: ModernText
                      Properties:
                        Align: =Align.Center
                        Color: =RGBA(96, 94, 92, 1)
                        FillPortions: =1
                        Height: =120
                        Text: =fxTranslate("NoTicketsFound", "Keine passenden Tickets gefunden.")
                        Visible: =false
                        Width: =Parent.Width
      - SavedFilterDialogOverlay6:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(15, 23, 42, 0.35)
            Height: =Parent.Height
            Visible: =varS6ShowSaveFilterDialog
            Width: =Parent.Width
          Children:
            - SavedFilterDialogCard6:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.Bold
                  Fill: =RGBA(255, 255, 255, 1)
                  Height: =286
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =12
                  PaddingBottom: =24
                  PaddingLeft: =24
                  PaddingRight: =24
                  PaddingTop: =24
                  RadiusBottomLeft: =12
                  RadiusBottomRight: =12
                  RadiusTopLeft: =12
                  RadiusTopRight: =12
                  Width: =If(App.Width < 560, Parent.Width - 32, 460)
                  X: =(Parent.Width - Self.Width) / 2
                  Y: =(Parent.Height - Self.Height) / 2
                Children:
                  - SavedFilterDialogTitle6:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        FontWeight: =FontWeight.Bold
                        Size: =20
                        Text: =If(varS6SaveMode = "rename", fxTranslate("RenameFilter", "Filter umbenennen"), If(varS6SaveMode = "update", fxTranslate("SaveChanges", "Änderungen speichern"), fxTranslate("SaveFilter", "Filter speichern")))
                        Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                  - SavedFilterNameLabel6:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        FontWeight: =FontWeight.Semibold
                        Height: =20
                        Text: =fxTranslate("ViewName", "Name der Ansicht")
                        Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                  - SavedFilterNameInput6:
                      Control: ModernTextInput
                      Properties:
                        AccessibleLabel: =fxTranslate("ViewName", "Name der Ansicht")
                        Appearance: =Appearance.Outline
                        Default: =varS6SaveNameDefault
                        Height: =42
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Placeholder: =fxTranslate("ViewNameExample", "Kritische SAP Changes")
                        Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                  - SavedFilterDefaultCheckbox6:
                      Control: ModernCheckbox
                      Properties:
                        AccessibleLabel: =fxTranslate("UseAsDefaultView", "Als Standardansicht verwenden")
                        BasePaletteColor: =RGBA(87, 35, 129, 1)
                        Default: =varS6SaveAsDefault
                        FontWeight: =""
                        Label: =fxTranslate("UseAsDefaultView", "Als Standardansicht verwenden")
                        OnCheck: =
                        OnUncheck: =
                        Visible: =varS6SaveMode <> "rename" And (varS6SaveMode = "new" Or Lower(varS6SelectedSavedView.OwnerEmail) = Lower(fxCurrentUser.Email))
                        Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                  - SavedFilterDialogSpacer6:
                      Control: ModernText
                      Properties:
                        FillPortions: =1
                        Height: =8
                        LayoutMinHeight: =0
                        Text: =""
                  - SavedFilterDialogActions6:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =40
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        LayoutJustifyContent: =LayoutJustifyContent.End
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                      Children:
                        - CancelSaveFilter6:
                            Control: ModernButton
                            Properties:
                              Appearance: =ButtonAppearance.Subtle
                              Height: =40
                              OnSelect: =Set(varS6ShowSaveFilterDialog, false)
                              Text: =fxTranslate("Cancel", "Abbrechen")
                              Width: =110
                        - ConfirmSaveFilter6:
                            Control: ModernButton
                            Properties:
                              BasePaletteColor: =RGBA(87, 35, 129, 1)
                              Height: =40
                              OnSelect: |-
                                =With(
                                    {
                                        viewTitle: Trim(SavedFilterNameInput6.Text),
                                        filterJson: JSON(
                                            {
                                                quickFilter: Coalesce(varS6QuickFilter, "all"),
                                                searchText: Coalesce(varDbdSearchText, ""),
                                                status: Coalesce(varDbdStatusFilter.Value, "Alle"),
                                                priority: Coalesce(varDbdPriorityFilter.Value, "Alle"),
                                                scope: Coalesce(varDbdScopeFilter.Value, "Alle"),
                                                ticketType: Coalesce(varDbdTicketTypeFilter.Value, "Alle"),
                                                category: Coalesce(varDbdCategoryFilter.Value, "Alle"),
                                                department: Coalesce(varDbdDepartmentFilter.Value, "Alle"),
                                                risk: Coalesce(varDbdRiskFilter.Value, "Alle"),
                                                requesterEmail: Coalesce(varDbdRequesterFilter.Email, ""),
                                                requesterDisplayName: Coalesce(varDbdRequesterFilter.DisplayName, "")
                                            },
                                            JSONFormat.Compact
                                        )
                                    },
                                    If(
                                        IsBlank(viewTitle),
                                        Notify(fxTranslate("EnterViewName", "Bitte einen Namen für die Ansicht eingeben."), NotificationType.Information, 2500),
                                        IfError(
                                            If(
                                                varS6SaveMode = "rename",
                                                Set(varS6SelectedSavedView, Patch(ev_sp_list_config_saved_views, varS6SelectedSavedView, {Title: viewTitle})),
                                                With(
                                                    {
                                                        savedView: Patch(
                                                            ev_sp_list_config_saved_views,
                                                            If(
                                                                varS6SaveMode = "update" And !IsBlank(varS6SelectedSavedView.ID),
                                                                varS6SelectedSavedView,
                                                                Coalesce(
                                                                    LookUp(ev_sp_list_config_saved_views, Active = true And TargetScreen = fxSavedViewTargetDashboard And OwnerEmail = fxCurrentUser.Email And Title = viewTitle),
                                                                    Defaults(ev_sp_list_config_saved_views)
                                                                )
                                                            ),
                                                            {
                                                                Title: viewTitle,
                                                                OwnerEmail: If(varS6SaveMode = "update", varS6SelectedSavedView.OwnerEmail, fxCurrentUser.Email),
                                                                OwnerDisplayName: If(varS6SaveMode = "update", varS6SelectedSavedView.OwnerDisplayName, fxCurrentUser.FullName),
                                                                Scope: If(varS6SaveMode = "update", varS6SelectedSavedView.Scope, {Value: fxSavedViewScopePersonal}),
                                                                TargetScreen: fxSavedViewTargetDashboard,
                                                                Active: true,
                                                                IsDefault: If(varS6SaveMode = "new" Or Lower(varS6SelectedSavedView.OwnerEmail) = Lower(fxCurrentUser.Email), SavedFilterDefaultCheckbox6.Checked, Coalesce(varS6SelectedSavedView.IsDefault, false)),
                                                                FilterJson: filterJson
                                                            }
                                                        )
                                                    },
                                                    If(
                                                        savedView.IsDefault And Lower(savedView.OwnerEmail) = Lower(fxCurrentUser.Email),
                                                        UpdateIf(
                                                            ev_sp_list_config_saved_views,
                                                            Active = true And TargetScreen = fxSavedViewTargetDashboard And OwnerEmail = fxCurrentUser.Email And IsDefault = true And ID <> savedView.ID,
                                                            {IsDefault: false}
                                                        )
                                                    );
                                                    Set(varS6SelectedSavedView, savedView)
                                                )
                                            ),
                                            Notify(Substitute(fxTranslate("ViewSaveFailed", "Ansicht konnte nicht gespeichert werden: {0}"), "{0}", FirstError.Message), NotificationType.Error, 5000),
                                            Refresh(ev_sp_list_config_saved_views);
                                            Set(varS6ShowSaveFilterDialog, false);
                                            Set(varS6ShowSavedFilterActions, false);
                                            Set(varS6FiltersDirty, false);
                                            Reset(SavedViewPicker6);
                                            Notify(fxTranslate("ViewSaved", "Ansicht gespeichert."), NotificationType.Success, 2000)
                                        )
                                    )
                                )
                              Text: =fxTranslate("Save", "Speichern")
                              Width: =110
