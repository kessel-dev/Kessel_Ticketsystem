Screens:
  Screen6:
    Properties:
      Fill: =RGBA(248, 249, 252, 1)
      OnVisible: |-
        =Set(varS6ShowNotifications, false);
        Set(varS6Refreshing, false);
        Set(varS6ShowFilters, false);
        Set(varS6QuickFilter, Coalesce(varS6QuickFilter, "all"));
        Set(varDbdSearchText, Coalesce(varDbdSearchText, ""));
        Set(varDbdStatusFilter, Coalesce(varDbdStatusFilter, {Value: "Alle"}));
        Set(varDbdPriorityFilter, Coalesce(varDbdPriorityFilter, {Value: "Alle"}));
        Set(varDbdScopeFilter, Coalesce(varDbdScopeFilter, {Value: "Alle"}));
        Set(varDbdTicketTypeFilter, Coalesce(varDbdTicketTypeFilter, {Value: "Alle"}));
        Set(varDbdCategoryFilter, Coalesce(varDbdCategoryFilter, {Value: "Alle"}));
        Set(varDbdDepartmentFilter, Coalesce(varDbdDepartmentFilter, {Value: "Alle"}));
        Set(varDbdRiskFilter, Coalesce(varDbdRiskFilter, {Value: "Alle"}));
        Set(varS6ShowSaveFilterDialog, false);
        Set(varS6ShowSavedFilterActions, false);
        Set(varS6FiltersDirty, false);
        Set(varS6SaveMode, "new");
        If(
            !Coalesce(varS6SavedViewInitialized, false),
            Refresh(ev_sp_list_config_saved_views);
            With(
                {
                    defaultView: LookUp(
                        ev_sp_list_config_saved_views,
                        Active = true
                            And TargetScreen = fxSavedViewTargetDashboard
                            And IsDefault = true
                            And OwnerEmail = fxCurrentUser.Email
                    )
                },
                If(
                    IsBlank(defaultView.ID),
                    Set(varS6SelectedSavedView, Blank());
                    Set(varS6QuickFilter, "all");
                    Set(varDbdSearchText, "");
                    Set(varDbdStatusFilter, {Value: "Alle"});
                    Set(varDbdPriorityFilter, {Value: "Alle"});
                    Set(varDbdScopeFilter, {Value: "Alle"});
                    Set(varDbdTicketTypeFilter, {Value: "Alle"});
                    Set(varDbdCategoryFilter, {Value: "Alle"});
                    Set(varDbdDepartmentFilter, {Value: "Alle"});
                    Set(varDbdRiskFilter, {Value: "Alle"});
                    Set(varDbdRequesterFilter, Blank()),
                    Set(varS6SelectedSavedView, defaultView);
                    Set(varSavedFilter, ParseJSON(defaultView.FilterJson));
                    Set(varS6QuickFilter, Coalesce(Text(varSavedFilter.quickFilter), "all"));
                    Set(varDbdSearchText, Coalesce(Text(varSavedFilter.searchText), ""));
                    Set(varDbdStatusFilter, {Value: Coalesce(Text(varSavedFilter.status), "Alle")});
                    Set(varDbdPriorityFilter, {Value: Coalesce(Text(varSavedFilter.priority), "Alle")});
                    Set(varDbdScopeFilter, {Value: Coalesce(Text(varSavedFilter.scope), "Alle")});
                    Set(varDbdTicketTypeFilter, {Value: Coalesce(Text(varSavedFilter.ticketType), "Alle")});
                    Set(varDbdCategoryFilter, {Value: Coalesce(Text(varSavedFilter.category), "Alle")});
                    Set(varDbdDepartmentFilter, {Value: Coalesce(Text(varSavedFilter.department), "Alle")});
                    Set(varDbdRiskFilter, {Value: Coalesce(Text(varSavedFilter.risk), "Alle")});
                    Set(
                        varDbdRequesterFilter,
                        If(
                            IsBlank(Text(varSavedFilter.requesterEmail)),
                            Blank(),
                            {Email: Text(varSavedFilter.requesterEmail), DisplayName: Coalesce(Text(varSavedFilter.requesterDisplayName), Text(varSavedFilter.requesterEmail))}
                        )
                    )
                )
            );
            Set(varS6SavedViewInitialized, true)
        );
        If(
            IsBlank(varDbdLastRefresh) Or DateDiff(varDbdLastRefresh, Now(), TimeUnit.Seconds) > 30,
            Set(varS6Refreshing, true);
            IfError(
                Refresh(ev_sp_list_tickets);
                Refresh(ev_sp_list_notifications);
                Set(varDbdLastRefresh, Now()),
                Notify(
                    Substitute(fxTranslate("DashboardRefreshFailed", "Dashboard konnte nicht aktualisiert werden: {0}"), "{0}", FirstError.Message),
                    NotificationType.Error,
                    5000
                )
            );
            Set(varS6Refreshing, false)
        )
    Children:
      - TableScroll2:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(248, 249, 252, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            LayoutOverflowY: =LayoutOverflow.Scroll
            Width: =Parent.Width
          Children:
            - TopNav4:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  Height: =If(App.Width < 640, 104, 56)
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  LayoutOverflowX: =LayoutOverflow.Scroll
                  Width: =Parent.Width
                Children:
                  - TitleRow4:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Height: =56
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =12
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingLeft: =If(App.Width < 640, 16, 40)
                        PaddingRight: =If(App.Width < 640, 16, 40)
                        Width: =Parent.Width
                      Children:
                        - AppTitle4:
                            Control: ModernText
                            Properties:
                              FillPortions: =If(App.Width < 640, 1, 0)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PaddingBottom: =0
                              PaddingTop: =0
                              Size: =If(App.Width < 640, 13, 16)
                              Text: =fxTranslate("ItServicePortal", "IT Service Portal")
                              Width: =If(App.Width < 640, 0, 200)
                        - NavTabsDesktop4:
                            Control: ModernTabList
                            Properties:
                              AccessibleLabel: =fxTranslate("MainNavigation", "Hauptnavigation")
                              Appearance: =TabListAppearance.Subtle
                              BasePaletteColor: =RGBA(87, 35, 129, 1)
                              Default: |-
                                ={Key: "dashboard", Value: fxTranslate("Dashboard", "Dashboard")}
                              FillPortions: =1
                              Height: =56
                              Items: |-
                                =Table(
                                    {Key: "dashboard", Value: fxTranslate("Dashboard", "Dashboard")},
                                    {Key: "create", Value: fxTranslate("CreateTicket", "Ticket erstellen")},
                                    {Key: "services", Value: fxTranslate("ServiceCatalog", "Servicekatalog")}
                                )
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              OnChange: |-
                                =Switch(
                                    Self.Selected.Key,
                                    "create", Navigate(request_type_screen, ScreenTransition.Cover),
                                    "services", Navigate(service_catalog_screen, ScreenTransition.Cover),
                                    "dashboard", false
                                )
                              Visible: =App.Width >= 640
                        - IconChat4:
                            Control: ModernIcon
                            Properties:
                              AccessibleLabel: =fxTranslate("ShowNotifications", "Benachrichtigungen anzeigen")
                              Height: =24
                              Icon: ="Alert"
                              IconColor: =RGBA(35, 39, 47, 1)
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              OnSelect: =Set(varS6ShowNotifications, !varS6ShowNotifications)
                              Tooltip: =fxTranslate("ShowNotifications", "Benachrichtigungen anzeigen")
                              Width: =24
                        - IconShare4:
                            Control: ModernIcon
                            Properties:
                              AccessibleLabel: =fxTranslate("RefreshDashboard", "Dashboard aktualisieren")
                              DisplayMode: =If(varS6Refreshing, DisplayMode.Disabled, DisplayMode.Edit)
                              Height: =24
                              Icon: ="ArrowClockwise"
                              IconColor: =RGBA(35, 39, 47, 1)
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              OnSelect: |-
                                =Set(varS6Refreshing, true);
                                IfError(
                                    Refresh(ev_sp_list_tickets);
                                    Refresh(ev_sp_list_notifications);
                                    Set(varDbdLastRefresh, Now());
                                    Notify(fxTranslate("DashboardRefreshed", "Dashboard aktualisiert."), NotificationType.Success, 2000),
                                    Notify(
                                        Substitute(fxTranslate("DashboardRefreshFailed", "Dashboard konnte nicht aktualisiert werden: {0}"), "{0}", FirstError.Message),
                                        NotificationType.Error,
                                        5000
                                    )
                                );
                                Set(varS6Refreshing, false)
                              Tooltip: =fxTranslate("RefreshDashboard", "Dashboard aktualisieren")
                              Width: =24
                        - IconSettings4:
                            Control: ModernIcon
                            Properties:
                              AccessibleLabel: =fxTranslate("CreateTicket", "Ticket erstellen")
                              Height: =24
                              Icon: =Icon.Add
                              IconColor: =RGBA(87, 35, 129, 1)
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              OnSelect: =Navigate(request_type_screen, ScreenTransition.Cover)
                              Tooltip: =fxTranslate("CreateTicket", "Ticket erstellen")
                              Width: =24
                        - Avatar4:
                            Control: Avatar
                            Properties:
                              AccessibleLabel: =fxCurrentUser.FullName
                              Appearance: ='Avatar.Appearance'.Brand
                              Height: =32
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              Name: =fxCurrentUser.FullName
                              Width: =32
                  - NavTabsMobile4:
                      Control: ModernTabList
                      Properties:
                        AccessibleLabel: =fxTranslate("MainNavigation", "Hauptnavigation")
                        Appearance: =TabListAppearance.Subtle
                        BasePaletteColor: =RGBA(87, 35, 129, 1)
                        Default: |-
                          ={Key: "dashboard", Value: fxTranslate("Dashboard", "Dashboard")}
                        Height: =If(App.Width < 640, 48, 0)
                        Items: |-
                          =Table(
                              {Key: "dashboard", Value: fxTranslate("Dashboard", "Dashboard")},
                              {Key: "create", Value: fxTranslate("CreateTicket", "Ticket erstellen")},
                              {Key: "services", Value: fxTranslate("ServiceCatalog", "Servicekatalog")}
                          )
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        OnChange: |-
                          =Switch(
                              Self.Selected.Key,
                              "create", Navigate(request_type_screen, ScreenTransition.Cover),
                              "services", Navigate(service_catalog_screen, ScreenTransition.Cover),
                              "dashboard", false
                          )
                        Width: =Parent.Width
            - NavDivider4:
                Control: ModernText
                Properties:
                  Fill: =RGBA(237, 237, 237, 1)
                  Height: =2
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =0
                  PaddingTop: =0
                  Text: =""
                  Width: =Parent.Width
            - TitleBand3:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  Height: =If(App.Width < 640, 120, 104)
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =8
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =8
                  PaddingLeft: =If(App.Width < 640, 16, 40)
                  PaddingRight: =If(App.Width < 640, 16, 40)
                  PaddingTop: =20
                  Width: =Parent.Width
                Children:
                  - PageTitle3:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        FontWeight: =FontWeight.Bold
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingBottom: =0
                        PaddingTop: =0
                        Size: =If(App.Width < 640, 22, 28)
                        Text: =If(fxIsAgentExperience, fxTranslate("CurrentTickets", "Aktuelle Tickets"), fxTranslate("MyTickets", "Meine Tickets"))
                        Width: =Parent.Width - If(App.Width < 640, 32, 80)
                  - PageSubtitle3:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(96, 94, 92, 1)
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingBottom: =0
                        PaddingTop: =0
                        Size: =If(App.Width < 640, 12, 14)
                        Text: =fxTranslate("DashboardIntro", "Tickets durchsuchen, priorisieren und direkt zur Bearbeitung öffnen.")
                        Width: =Parent.Width - If(App.Width < 640, 32, 80)
            - FilterRow2:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  Height: =48
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =6
                  PaddingLeft: =If(App.Width < 640, 16, 40)
                  PaddingRight: =If(App.Width < 640, 16, 40)
                  PaddingTop: =6
                  Width: =Parent.Width
                Children:
                  - FilterTabs2:
                      Control: ModernTabList
                      Properties:
                        Appearance: =TabListAppearance.FilledCircular
                        BasePaletteColor: =RGBA(87, 35, 129, 1)
                        Default: |-
                          ={Key: Coalesce(varS6QuickFilter, "all")}
                        Height: =36
                        ItemDisplayText: =ThisItem.Value & " (" & Text(ThisItem.TicketCount) & ")"
                        Items: |-
                          =With(
                              {countTickets: fxFilteredDashboardTickets},
                              Table(
                                  {
                                      Key: "all",
                                      Value: fxTranslate(
                                          "All",
                                          "Alle"
                                      ),
                                      TicketCount: CountRows(countTickets)
                                  },
                                  {
                                      Key: "open",
                                      Value: fxTranslate(
                                          "Open",
                                          "Offen"
                                      ),
                                      TicketCount: CountRows(
                                          Filter(
                                              countTickets As ticket,
                                              IsBlank(
                                                  LookUp(
                                                      ev_sp_list_config_dropdown,
                                                      FilterName = "ClosedStatus" And TargetList = "Ticket" And Active = true And FilterValue = Coalesce(
                                                          ticket.Status.Value,
                                                          ticket.StatusINC.Value,
                                                          ""
                                                      )
                                                  )
                                              )
                                          )
                                      )
                                  },
                                  {
                                      Key: "requested",
                                      Value: fxTranslate(
                                          "RequestedByMe",
                                          "Von mir"
                                      ),
                                      TicketCount: CountRows(
                                          Filter(
                                              countTickets,
                                              RequestedBy.Email = fxCurrentUser.Email Or 'Erstellt von'.Email = fxCurrentUser.Email
                                          )
                                      )
                                  },
                                  {
                                      Key: "assigned",
                                      Value: fxTranslate(
                                          "AssignedToMe",
                                          "Mir zugewiesen"
                                      ),
                                      TicketCount: CountRows(
                                          Filter(
                                              countTickets As ticket,
                                              !IsBlank(
                                                  LookUp(
                                                      ticket.'Zugewiesen an',
                                                      Lower(Email) = Lower(fxCurrentUser.Email)
                                                  )
                                              )
                                          )
                                      )
                                  }
                              )
                          )
                        LayoutMinHeight: =16
                        LayoutMinWidth: =0
                        OnChange: |-
                          =Set(varS6QuickFilter, Coalesce(Self.Selected.Key, "all"));
                          Set(varS6FiltersDirty, !IsBlank(varS6SelectedSavedView.ID))
                        Width: =If(App.Width < 640, Parent.Width - Parent.PaddingLeft - Parent.PaddingRight, 500)
            - SearchActionsRow6:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  Height: =If(App.Width < 1180, 104, 60)
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =If(App.Width < 1180, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                  LayoutGap: =10
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =8
                  PaddingLeft: =If(App.Width < 640, 16, 40)
                  PaddingRight: =If(App.Width < 640, 16, 40)
                  PaddingTop: =8
                  Width: =Parent.Width
                Children:
                  - SearchInput2:
                      Control: ModernTextInput
                      Properties:
                        AccessibleLabel: =fxTranslate("SearchTickets", "Tickets durchsuchen")
                        Default: =Coalesce(varDbdSearchText, "")
                        FillPortions: =If(App.Width < 1180, 0, 1)
                        Height: =40
                        LayoutMinHeight: =0
                        LayoutMinWidth: =220
                        OnChange: |-
                          =Set(varDbdSearchText, Trim(Self.Text));
                          Set(varS6FiltersDirty, !IsBlank(varS6SelectedSavedView.ID))
                        Placeholder: =fxTranslate("SearchTicketPlaceholder", "Ticket suchen...")
                        TriggerOutput: =TriggerOutput.Delayed
                        Type: =TextInputType.Search
                        Width: =If(App.Width < 1180, Parent.Width - Parent.PaddingLeft - Parent.PaddingRight, 0)
                  - SearchActionsGroup6:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =44
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        LayoutJustifyContent: =LayoutJustifyContent.End
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        LayoutOverflowX: =LayoutOverflow.Scroll
                        Width: =If(App.Width < 1180, Parent.Width - Parent.PaddingLeft - Parent.PaddingRight, 670)
                      Children:
                        - SavedViewPicker6:
                            Control: ModernCombobox
                            Properties:
                              AccessibleLabel: =fxTranslate("SelectSavedView", "Gespeicherte Ansicht auswählen")
                              Appearance: =Appearance.Outline
                              DefaultSelectedItems: =[]
                              Height: =40
                              InputTextPlaceholder: =fxTranslate("View", "Ansicht")
                              IsSearchable: =false
                              ItemDisplayText: =ThisItem.Title
                              Items: =fxDashboardSavedViews
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnChange: |-
                                =If(
                                    !IsBlank(Self.Selected.ID),
                                    Set(varS6SelectedSavedView, Self.Selected);
                                    Set(varSavedFilter, ParseJSON(Self.Selected.FilterJson));
                                    Set(varS6QuickFilter, Coalesce(Text(varSavedFilter.quickFilter), "all"));
                                    Set(varDbdSearchText, Coalesce(Text(varSavedFilter.searchText), ""));
                                    Set(varDbdStatusFilter, {Value: Coalesce(Text(varSavedFilter.status), "Alle")});
                                    Set(varDbdPriorityFilter, {Value: Coalesce(Text(varSavedFilter.priority), "Alle")});
                                    Set(varDbdScopeFilter, {Value: Coalesce(Text(varSavedFilter.scope), "Alle")});
                                    Set(varDbdTicketTypeFilter, {Value: Coalesce(Text(varSavedFilter.ticketType), "Alle")});
                                    Set(varDbdCategoryFilter, {Value: Coalesce(Text(varSavedFilter.category), "Alle")});
                                    Set(varDbdDepartmentFilter, {Value: Coalesce(Text(varSavedFilter.department), "Alle")});
                                    Set(varDbdRiskFilter, {Value: Coalesce(Text(varSavedFilter.risk), "Alle")});
                                    Set(varDbdRequesterFilter, If(IsBlank(Text(varSavedFilter.requesterEmail)), Blank(), {Email: Text(varSavedFilter.requesterEmail), DisplayName: Coalesce(Text(varSavedFilter.requesterDisplayName), Text(varSavedFilter.requesterEmail))}));
                                    Reset(FilterTabs2);
                                    Reset(SearchInput2);
                                    Reset(StatusFilter6);
                                    Reset(PriorityFilter6);
                                    Reset(ScopeFilter6);
                                    Reset(TicketTypeFilter6);
                                    Reset(CategoryFilter6);
                                    Reset(DepartmentFilter6);
                                    Reset(RiskFilter6);
                                    Reset(RequesterFilter6);
                                    Set(varS6FiltersDirty, false);
                                    Set(varS6ShowSavedFilterActions, false)
                                )
                              SelectMultiple: =false
                              Width: =170
                        - SaveFilterButton6:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: =fxTranslate("SaveCurrentFiltersAsView", "Aktuelle Filter als Ansicht speichern")
                              Appearance: =ButtonAppearance.Secondary
                              BasePaletteColor: =RGBA(87, 35, 129, 1)
                              DisplayMode: |-
                                =If(
                                    fxDbdActiveFilterCount > 0
                                        Or !IsBlank(Trim(varDbdSearchText))
                                        Or Coalesce(varS6QuickFilter, "all") <> "all"
                                        Or varS6FiltersDirty,
                                    DisplayMode.Edit,
                                    DisplayMode.Disabled
                                )
                              Height: =40
                              Icon: ="Save"
                              Layout: =ButtonLayout.IconOnly
                              OnSelect: |-
                                =Set(
                                    varS6SaveMode,
                                    If(
                                        varS6FiltersDirty
                                            And !IsBlank(varS6SelectedSavedView.ID)
                                            And (Lower(varS6SelectedSavedView.OwnerEmail) = Lower(fxCurrentUser.Email) Or (varS6SelectedSavedView.Scope.Value = fxSavedViewScopeGlobal And fxCanManageGlobalSavedViews)),
                                        "update",
                                        "new"
                                    )
                                );
                                Set(varS6SaveNameDefault, If(varS6SaveMode = "update", varS6SelectedSavedView.Title, ""));
                                Set(varS6SaveAsDefault, If(varS6SaveMode = "update", Coalesce(varS6SelectedSavedView.IsDefault, false), false));
                                Set(varS6ShowSaveFilterDialog, true);
                                Set(varS6ShowSavedFilterActions, false);
                                Reset(SavedFilterNameInput6)
                              Text: =If(varS6FiltersDirty And !IsBlank(varS6SelectedSavedView.ID) And (Lower(varS6SelectedSavedView.OwnerEmail) = Lower(fxCurrentUser.Email) Or (varS6SelectedSavedView.Scope.Value = fxSavedViewScopeGlobal And fxCanManageGlobalSavedViews)), fxTranslate("SaveChanges", "Änderungen speichern"), fxTranslate("SaveFilter", "Filter speichern"))
                              Width: =40
                        - AdvancedFilterToggle6:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: =fxTranslate("Filter", "Filter")
                              Appearance: =If(varS6ShowFilters, ButtonAppearance.Primary, ButtonAppearance.Secondary)
                              BasePaletteColor: =RGBA(87, 35, 129, 1)
                              Height: =40
                              Icon: ="Filter"
                              OnSelect: =Set(varS6ShowFilters, Not(Coalesce(varS6ShowFilters, false)))
                              Text: =fxTranslate("Filter", "Filter") & If(fxDbdActiveFilterCount > 0, " (" & fxDbdActiveFilterCount & ")", "")
                              Width: =105
            - SavedFilterManagementRow6:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(248, 249, 252, 1)
                  FillPortions: =0
                  Height: =If(varS6ShowSavedFilterActions And !IsBlank(varS6SelectedSavedView.ID), 44, 0)
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  LayoutOverflowX: =LayoutOverflow.Scroll
                  PaddingLeft: =If(App.Width < 640, 16, 40)
                  PaddingRight: =If(App.Width < 640, 16, 40)
                  Visible: =varS6ShowSavedFilterActions And !IsBlank(varS6SelectedSavedView.ID)
                  Width: =Parent.Width
                Children:
                  - SavedFilterManagementTitle6:
                      Control: ModernText
                      Properties:
                        FillPortions: =1
                        FontWeight: =FontWeight.Semibold
                        Height: =30
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Text: =varS6SelectedSavedView.Title
                        Wrap: =false
                  - DiscardSavedFilterChanges6:
                      Control: ModernButton
                      Properties:
                        Appearance: =ButtonAppearance.Subtle
                        OnSelect: |-
                          =Set(varSavedFilter, ParseJSON(varS6SelectedSavedView.FilterJson));
                          Set(varS6QuickFilter, Coalesce(Text(varSavedFilter.quickFilter), "all"));
                          Set(varDbdSearchText, Coalesce(Text(varSavedFilter.searchText), ""));
                          Set(varDbdStatusFilter, {Value: Coalesce(Text(varSavedFilter.status), "Alle")});
                          Set(varDbdPriorityFilter, {Value: Coalesce(Text(varSavedFilter.priority), "Alle")});
                          Set(varDbdScopeFilter, {Value: Coalesce(Text(varSavedFilter.scope), "Alle")});
                          Set(varDbdTicketTypeFilter, {Value: Coalesce(Text(varSavedFilter.ticketType), "Alle")});
                          Set(varDbdCategoryFilter, {Value: Coalesce(Text(varSavedFilter.category), "Alle")});
                          Set(varDbdDepartmentFilter, {Value: Coalesce(Text(varSavedFilter.department), "Alle")});
                          Set(varDbdRiskFilter, {Value: Coalesce(Text(varSavedFilter.risk), "Alle")});
                          Set(varDbdRequesterFilter, If(IsBlank(Text(varSavedFilter.requesterEmail)), Blank(), {Email: Text(varSavedFilter.requesterEmail), DisplayName: Coalesce(Text(varSavedFilter.requesterDisplayName), Text(varSavedFilter.requesterEmail))}));
                          Reset(FilterTabs2);
                          Reset(SearchInput2);
                          Reset(StatusFilter6);
                          Reset(PriorityFilter6);
                          Reset(ScopeFilter6);
                          Reset(TicketTypeFilter6);
                          Reset(CategoryFilter6);
                          Reset(DepartmentFilter6);
                          Reset(RiskFilter6);
                          Reset(RequesterFilter6);
                          Set(varS6FiltersDirty, false)
