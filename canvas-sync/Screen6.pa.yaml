                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                      Children:
                        - CancelSaveFilter6:
                            Control: ModernButton
                            Properties:
                              Appearance: =ButtonAppearance.Subtle
                              Height: =40
                              OnSelect: =Set(varS6ShowSaveFilterDialog, false)
                              Text: =fxTranslate("Cancel", "Abbrechen")
                              Width: =110
                        - ConfirmSaveFilter6:
                            Control: ModernButton
                            Properties:
                              Appearance: =ButtonAppearance.Primary
                              BasePaletteColor: =RGBA(87, 35, 129, 1)
                              Height: =40
                              OnSelect: |-
                                =With(
                                    {
                                        viewTitle: Trim(SavedFilterNameInput6.Text),
                                        filterJson: JSON(
                                            {
                                                quickFilter: Coalesce(varS6QuickFilter, "all"),
                                                searchText: Coalesce(varDbdSearchText, ""),
                                                status: Coalesce(varDbdStatusFilter.Value, "Alle"),
                                                priority: Coalesce(varDbdPriorityFilter.Value, "Alle"),
                                                scope: Coalesce(varDbdScopeFilter.Value, "Alle"),
                                                ticketType: Coalesce(varDbdTicketTypeFilter.Value, "Alle"),
                                                category: Coalesce(varDbdCategoryFilter.Value, "Alle"),
                                                department: Coalesce(varDbdDepartmentFilter.Value, "Alle"),
                                                risk: Coalesce(varDbdRiskFilter.Value, "Alle"),
                                                requesterEmail: Coalesce(varDbdRequesterFilter.Email, ""),
                                                requesterDisplayName: Coalesce(varDbdRequesterFilter.DisplayName, "")
                                            },
                                            JSONFormat.Compact
                                        )
                                    },
                                    If(
                                        IsBlank(viewTitle),
                                        Notify(fxTranslate("EnterViewName", "Bitte einen Namen für die Ansicht eingeben."), NotificationType.Information, 2500),
                                        IfError(
                                            If(
                                                varS6SaveMode = "rename",
                                                Set(varS6SelectedSavedView, Patch(ev_sp_list_config_saved_views, varS6SelectedSavedView, {Title: viewTitle})),
                                                With(
                                                    {
                                                        savedView: Patch(
                                                            ev_sp_list_config_saved_views,
                                                            If(
                                                                varS6SaveMode = "update" And !IsBlank(varS6SelectedSavedView.ID),
                                                                varS6SelectedSavedView,
                                                                Coalesce(
                                                                    LookUp(ev_sp_list_config_saved_views, Active = true And TargetScreen = fxSavedViewTargetDashboard And OwnerEmail = fxCurrentUser.Email And Title = viewTitle),
                                                                    Defaults(ev_sp_list_config_saved_views)
                                                                )
                                                            ),
                                                            {
                                                                Title: viewTitle,
                                                                OwnerEmail: If(varS6SaveMode = "update", varS6SelectedSavedView.OwnerEmail, fxCurrentUser.Email),
                                                                OwnerDisplayName: If(varS6SaveMode = "update", varS6SelectedSavedView.OwnerDisplayName, fxCurrentUser.FullName),
                                                                Scope: If(varS6SaveMode = "update", varS6SelectedSavedView.Scope, {Value: fxSavedViewScopePersonal}),
                                                                TargetScreen: fxSavedViewTargetDashboard,
                                                                Active: true,
                                                                IsDefault: If(varS6SaveMode = "new" Or Lower(varS6SelectedSavedView.OwnerEmail) = Lower(fxCurrentUser.Email), SavedFilterDefaultCheckbox6.Checked, Coalesce(varS6SelectedSavedView.IsDefault, false)),
                                                                FilterJson: filterJson
                                                            }
                                                        )
                                                    },
                                                    If(
                                                        savedView.IsDefault And Lower(savedView.OwnerEmail) = Lower(fxCurrentUser.Email),
                                                        UpdateIf(
                                                            ev_sp_list_config_saved_views,
                                                            Active = true And TargetScreen = fxSavedViewTargetDashboard And OwnerEmail = fxCurrentUser.Email And IsDefault = true And ID <> savedView.ID,
                                                            {IsDefault: false}
                                                        )
                                                    );
                                                    Set(varS6SelectedSavedView, savedView)
                                                )
                                            ),
                                            Notify(Substitute(fxTranslate("ViewSaveFailed", "Ansicht konnte nicht gespeichert werden: {0}"), "{0}", FirstError.Message), NotificationType.Error, 5000),
                                            Refresh(ev_sp_list_config_saved_views);
                                            Set(varS6ShowSaveFilterDialog, false);
                                            Set(varS6ShowSavedFilterActions, false);
                                            Set(varS6FiltersDirty, false);
                                            Reset(PersonalSavedFilterPicker6);
                                            Reset(SavedViewPicker6);
                                            Notify(fxTranslate("ViewSaved", "Ansicht gespeichert."), NotificationType.Success, 2000)
                                        )
                                    )
                                )
                              Text: =fxTranslate("Save", "Speichern")
                              Width: =110
