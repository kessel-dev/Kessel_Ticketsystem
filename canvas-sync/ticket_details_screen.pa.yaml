      - form_ticket_attachments_inline_1:
          Control: Form
          Layout: Vertical
          Properties:
            DataSource: =ev_sp_list_tickets
            Height: =If(varShowTicketAttachmentUpload, 200, 0)
            Item: =varCurrentTicket
            OnFailure: |-
              =Set(varTicketAttachmentSubmitting, false);
              Notify(fxTranslate("AttachmentSaveFailed", "Anlage konnte nicht gespeichert werden."), NotificationType.Error, 4000)
            OnSuccess: |-
              =Set(varTicketAttachmentSubmitting, false);
              Refresh(ev_sp_list_tickets);
              Set(varCurrentTicket, LookUp(ev_sp_list_tickets, ID = form_ticket_attachments_inline_1.LastSubmit.ID));
              Set(varTicketLoadedModified, varCurrentTicket.Geändert);
              ResetForm(form_ticket_attachments_inline_1);
              Set(varShowTicketAttachmentUpload, false);
              Notify(fxTranslate("AttachmentSaved", "Anlage gespeichert."), NotificationType.Success, 2500)
            Visible: =varShowTicketAttachmentUpload
            Width: =Parent.Width
          Children:
