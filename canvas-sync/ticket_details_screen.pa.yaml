Screens:
  ticket_details_screen:
    Properties:
      Fill: =RGBA(242, 244, 248, 1)
      LoadingSpinnerColor: =RGBA(87, 35, 129, 1)
      OnVisible: |-
        =Set(
            varCommentType,
            "Chat"
        );
        Set(
            varCommentSubmitting,
            false
        );
        If(
            IsBlank(varTicketListSearchText),
            Set(varTicketListSearchText, "")
        );
        Set(varShowTicketAttachmentUpload, false);
        Set(varTicketAttachmentSubmitting, false);
        Set(
            varTicketRefreshing,
            true
        );
        Set(
            varTicketIdToLoad,
            Coalesce(
                varTicketDetailId,
                varCurrentTicket.ID
            )
        );
        Set(
            varTicketDetailId,
            Blank()
        );
         If(
             !IsBlank(varTicketIdToLoad),
             IfError(
                 Refresh(ev_sp_list_tickets);
                 With(
                     {loadedTicket: LookUp(ev_sp_list_tickets, ID = varTicketIdToLoad)},
                     If(
                         !IsBlank(loadedTicket),
                         Set(varCurrentTicket, loadedTicket);
                         Set(varTicketLoadedModified, loadedTicket.Geändert)
                     )
                 ),
                 Notify(
                     fxTranslate("TicketDetailsRefreshFailed", "Das Ticket wurde erstellt, aber die aktuellen Details konnten noch nicht geladen werden."),
                     NotificationType.Warning,
                     5000
                 )
             )
         );
        ClearCollect(
            colTicketDetailComments,
            Filter(
                ev_sp_list_comments,
                TicketNumber = Text(varTicketIdToLoad)
                    Or TicketNumber = Coalesce(varCurrentTicket.Titel, "")
                    Or TicketNumber = Coalesce(varCurrentTicket.TicketId, "")
            )
        );
        ClearCollect(
            colTicketDetailCommentAttachments,
            Filter(colTicketDetailComments, !IsEmpty(Anlagen))
        );
        ClearCollect(
            colTicketDetailsList,
            Filter(
                ev_sp_list_tickets,
                Coalesce(fxIsAdmin, false)
                    || Coalesce(fxIsAgent, false)
                    || RequestedBy.Email = User().Email
                    || !IsBlank(LookUp('Zugewiesen an', Lower(Email) = Lower(User().Email)))
            )
        );
        Set(
            varTicketRefreshing,
            false
        );
         Set(
             varTransitionSubmitting,
             false
         );
         Set(
             varSelectedTransition,
             Blank()
         );
         Refresh(ev_sp_list_config_transition_requests);
        Set(
            varPendingTransition,
            LookUp(
                ev_sp_list_config_transition_requests,
                TicketID = varCurrentTicket.ID && RequestStatus = "Pending"
            )
        );
        Set(
            varTicketIdPolling,
            false
        );
        Set(
            varTicketIdPollingAttempts,
            0
        );
        Set(
            varTicketIdPolling,
            IsBlank(varCurrentTicket.TicketId)
        );
        Set(
            varShowTicketDetails,
            true
        );
        Set(
            varShowDescriptionScreenshotPreview,
            false
        );
        Set(
            varSelectedDescriptionScreenshot,
            Blank()
        );
        Set(
            varShowPromoteToChangeDialog,
            false
        );
        Set(
            varPromoteToChangeSubmitting,
            false
        );
        Set(
            varPromoteToChangeNoteDraft,
            ""
        );
        Set(
            varDescriptionEditMode,
            false
        );
        Set(
            varDescriptionSaving,
            false
        );
        Set(
            varActivityExpanded,
            true
        );
        Set(
            locTicketMode,
            "View"
        )
    Children:
      - tds_root_1:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(247, 248, 250, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =5
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingBottom: =12
            PaddingLeft: =12
            PaddingRight: =12
            PaddingTop: =12
            Width: =Parent.Width
          Children:
            - mobile_ticket_header:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  Height: =52
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =8
                  LayoutMinHeight: =52
                  LayoutMinWidth: =0
                  PaddingBottom: =8
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =8
                  Visible: =App.Width < 600 && locTicketMode <> "Edit"
                  Width: =Parent.Width
                Children:
                  - btn_mobile_back:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: =fxTranslate("BackToPreviousView", "Zurück zur vorherigen Ansicht")
                        AlignInContainer: =AlignInContainer.Center
                        Appearance: =ButtonAppearance.Subtle
                        Height: =36
                        Icon: ="ChevronLeft"
                        Layout: =ButtonLayout.IconOnly
                        LayoutMinHeight: =36
                        LayoutMinWidth: =36
                        OnSelect: =Navigate(dashboard_screen, ScreenTransition.CoverRight); Set(varCurrentTicket, Blank())
                        Width: =36
                  - lbl_mobile_tickets:
                      Control: ModernText
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        Color: =RGBA(71, 85, 105, 1)
                        FontWeight: =FontWeight.Semibold
                        Height: =28
                        LayoutMinHeight: =28
                        LayoutMinWidth: =48
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =14
                        Text: =fxTranslate("Tickets", "Tickets")
                        Width: =48
                        Wrap: =false
                  - lbl_mobile_ticket_number:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: =fxTranslate("CurrentTicket", "Aktuelles Ticket")
                        AlignInContainer: =AlignInContainer.Center
                        Color: =RGBA(15, 23, 42, 1)
                        FillPortions: =1
                        FontWeight: =FontWeight.Bold
                        Height: =30
                        LayoutMinHeight: =30
                        LayoutMinWidth: =120
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =18
                        Text: =Coalesce(varCurrentTicket.TicketId, varCurrentTicket.Titel, Text(varCurrentTicket.ID), fxTranslate("TicketDetails", "Ticketdetails"))
                        Wrap: =false
                  - btn_mobile_overflow:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: =fxTranslate("MoreActions", "Weitere Aktionen")
                        AlignInContainer: =AlignInContainer.Center
                        Appearance: =ButtonAppearance.Subtle
                        Height: =36
                        Icon: ="MoreVertical"
                        Layout: =ButtonLayout.IconOnly
                        LayoutMinHeight: =36
                        LayoutMinWidth: =36
                        OnSelect: =Reset(ddown_actions)
                        Width: =36
            - mobile_ticket_summary:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  BorderColor: =RGBA(226, 232, 240, 1)
                  BorderThickness: =0
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  Height: =84
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =4
                  LayoutMinHeight: =84
                  LayoutMinWidth: =0
                  PaddingBottom: =10
                  PaddingLeft: =10
                  PaddingRight: =10
                  PaddingTop: =10
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Visible: =App.Width < 600 && locTicketMode <> "Edit"
                  Width: =Parent.Width
                Children:
                  - mobile_status_item:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingLeft: =6
                        PaddingRight: =6
                      Children:
                        - mobile_status_label:
                            Control: ModernText
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =RGBA(100, 116, 139, 1)
                              Height: =18
                              LayoutMinHeight: =18
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =11
                              Text: =fxTranslate("Status", "Status")
                              Width: =Parent.Width
                              Wrap: =false
                        - mobile_status_value_row:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =24
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =4
                              LayoutMinHeight: =24
                              LayoutMinWidth: =0
                              Width: =Parent.Width
                            Children:
                              - mobile_status_dot:
                                  Control: ModernText
                                  Properties:
                                    Align: =Align.Center
                                    AlignInContainer: =AlignInContainer.Center
                                    Color: =RGBA(148, 163, 184, 1)
                                    Height: =18
                                    LayoutMinHeight: =18
                                    LayoutMinWidth: =12
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =14
                                    Text: ="●"
                                    Width: =12
                              - mobile_status_value:
                                  Control: ModernText
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Center
                                    Color: =RGBA(15, 23, 42, 1)
                                    FillPortions: =1
                                    FontWeight: =FontWeight.Semibold
                                    Height: =24
                                    LayoutMinHeight: =24
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =12
                                    Text: =Coalesce(fxCurrentTicketStatus, "Nicht gesetzt")
                                    Wrap: =false
                  - mobile_priority_item:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingLeft: =6
                        PaddingRight: =6
                      Children:
                        - mobile_priority_label:
                            Control: ModernText
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =RGBA(100, 116, 139, 1)
                              Height: =18
                              LayoutMinHeight: =18
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =11
                              Text: =fxTranslate("Priorität", "Priorität")
                              Width: =Parent.Width
                              Wrap: =false
                        - mobile_priority_value_row:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =24
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =4
                              LayoutMinHeight: =24
                              LayoutMinWidth: =0
                              Width: =Parent.Width
                            Children:
                              - mobile_priority_dot:
                                  Control: ModernText
                                  Properties:
                                    Align: =Align.Center
                                    AlignInContainer: =AlignInContainer.Center
                                    Color: =RGBA(245, 158, 11, 1)
                                    Height: =18
                                    LayoutMinHeight: =18
                                    LayoutMinWidth: =12
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =14
                                    Text: ="●"
                                    Width: =12
                              - mobile_priority_value:
                                  Control: ModernText
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Center
                                    Color: =RGBA(15, 23, 42, 1)
                                    FillPortions: =1
                                    FontWeight: =FontWeight.Semibold
                                    Height: =24
                                    LayoutMinHeight: =24
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =12
                                    Text: =Coalesce(varCurrentTicket.Priority.Value, "Mittel")
                                    Wrap: =false
                  - mobile_opened_item:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingLeft: =6
                        PaddingRight: =6
                      Children:
                        - mobile_opened_label:
                            Control: ModernText
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =RGBA(100, 116, 139, 1)
                              Height: =18
                              LayoutMinHeight: =18
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =11
                              Text: =fxTranslate("Opened", "Geöffnet")
                              Width: =Parent.Width
                              Wrap: =false
                        - mobile_opened_value:
                            Control: ModernText
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =RGBA(15, 23, 42, 1)
                              FontWeight: =FontWeight.Semibold
                              Height: =24
                              LayoutMinHeight: =24
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =12
                              Text: =If(IsBlank(varCurrentTicket.Erstellt), "-", Text(varCurrentTicket.Erstellt, "[$-de-DE]dd.mm.yyyy"))
                              Width: =Parent.Width
                              Wrap: =false
            - conHeader:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  BorderColor: =RGBA(226, 232, 240, 1)
                  BorderThickness: =1
                  DropShadow: =DropShadow.Semilight
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  Height: =If(App.Width >= 1180, 156, If(App.Width >= 600, 216, 198))
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =4
                  PaddingBottom: =8
                  PaddingLeft: =If(App.Width < 600, 16, 24)
                  PaddingRight: =If(App.Width < 600, 16, 24)
                  PaddingTop: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Visible: =App.Width >= 600 || locTicketMode = "Edit"
                  Width: =Parent.Width
                Children:
                  - hdr_top_row:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =If(App.Width < 600, 54, 72)
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =12
                        LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                        Width: =Parent.Width
                      Children:
                        - lbl_page_title:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: =fxTranslate("CurrentTicket", "Aktuelles Ticket")
                              AlignInContainer: =AlignInContainer.Stretch
                              AutoHeight: =true
                              Color: =RGBA(15, 23, 42, 1)
                              FillPortions: =1
                              Font: =Font.Arial
                              FontWeight: =FontWeight.Bold
                              Height: =68
                              LayoutMinWidth: =If(App.Width < 600, 155, 260)
                              Size: =If(App.Width < 600, 18, If(App.Width < 900, 20, 22))
                              Text: |-
                                =Coalesce(varCurrentTicket.TicketId, varCurrentTicket.Titel, Text(varCurrentTicket.ID)) &
                                Char(10) &
                                Coalesce(varCurrentTicket.TicketTitel, fxTranslate("NoTitle", "Ohne Titel"))
                        - hdr_actions:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =If(App.Width < 600, 44, 40)
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =10
                              LayoutJustifyContent: =LayoutJustifyContent.End
                              LayoutMinHeight: =0
                              LayoutMinWidth: =If(App.Width < 600, 132, If(App.Width < 900, 300, 520))
                              Visible: =locTicketMode <> "Edit"
                            Children:
                              - btn_back:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: =If(App.Width < 600, "Details bearbeiten", fxTranslate("BackToPreviousView", "Zurück zur vorherigen Ansicht"))
                                    Appearance: =ButtonAppearance.Secondary
                                    Height: =If(App.Width < 600, 44, 36)
                                    Icon: =If(App.Width < 600, "Edit", "ChevronLeft")
                                    OnSelect: |-
                                      =If(
                                          App.Width < 600,
                                          Set(locTicketMode, "Edit");
                                          ResetForm(frmTicketDetails),
                                          Set(varLastViewedTicketId, varCurrentTicket.ID);
                                          Navigate(dashboard_screen, ScreenTransition.CoverRight);
                                          Set(
                                              varCurrentTicket,
                                              Blank()
                                          )
                                      )
                                    RadiusBottomLeft: =6
                                    RadiusBottomRight: =6
                                    RadiusTopLeft: =6
                                    RadiusTopRight: =6
                                    Text: =If(App.Width < 600, "Details bearbeiten", fxTranslate("Zurück", "Zurück"))
                                    Width: =If(App.Width < 600, 132, 130)
                              - btn_edit_ticket_header_action:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: =fxTranslate("EditTicketDetails", "Ticketdetails bearbeiten")
                                    Appearance: =ButtonAppearance.Secondary
                                    DisplayMode: =If(fxCanEditCurrentTicket, DisplayMode.Edit, DisplayMode.Disabled)
                                    Height: =36
                                    Icon: ="Edit"
                                    Layout: =ButtonLayout.IconOnly
                                    OnSelect: |-
                                      =Set(locTicketMode, "Edit");
                                      ResetForm(frmTicketDetails)
                                    Text: =""
                                    Tooltip: =fxTranslate("Edit", "Bearbeiten")
                                    Visible: =App.Width >= 600 && fxCanViewCurrentTicket
                                    Width: =42
                              - btn_save:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: =fxTranslate("SaveTicket", "Ticket speichern")
                                    DisplayMode: =If(locTicketMode = "Edit" && fxCanEditCurrentTicket, DisplayMode.Edit, DisplayMode.Disabled)
                                    Height: =36
                                    Icon: ="Save"
                                    OnSelect: |-
                                      =If(
                                          !fxCanEditCurrentTicket,
                                          Notify(fxTranslate("NoPermissionSaveTicket", "Keine Berechtigung zum Speichern dieses Tickets."), NotificationType.Error, 3000),
                                          Refresh(ev_sp_list_tickets);
                                          Set(
                                              varLatestTicket,
                                              LookUp(
                                                  ev_sp_list_tickets,
                                                  ID = varCurrentTicket.ID
                                              )
                                          );
                                          If(
                                              varLatestTicket.Geändert <> varTicketLoadedModified,
                                              Notify(
                                                  fxTranslate("TicketChangedRefreshFirst", "Das Ticket wurde zwischenzeitlich geändert. Bitte aktualisiere zuerst die Daten."),
                                                  NotificationType.Warning,
                                                  6000
                                              ),
                                              If(
                                                  Confirm(
                                                      fxTranslate("ConfirmSaveChanges", "Möchtest du die Änderungen wirklich speichern?"),
                                                      {
                                                          Title: fxTranslate("SaveChanges", "Änderungen speichern"),
                                                          ConfirmButton: fxTranslate("Speichern", "Speichern"),
                                                          CancelButton: fxTranslate("Cancel", "Abbrechen")
                                                      }
                                                  ),
                                                    SubmitForm(frmTicketDetails),
                                                  Notify(
                                                      fxTranslate("SaveCancelled", "Speichern abgebrochen"),
                                                      NotificationType.Information,
                                                      2000
                                                  )
                                              )
                                          )
                                      )
                                    RadiusBottomLeft: =6
                                    RadiusBottomRight: =6
                                    RadiusTopLeft: =6
                                    RadiusTopRight: =6
                                    Text: =fxTranslate("Speichern", "Speichern")
                                    Visible: =false
                                    Width: =120
                              - ddown_actions:
                                  Control: ModernCombobox
                                  Properties:
                                    AccessibleLabel: =fxTranslate("MoreActions", "Weitere Aktionen")
                                    Appearance: =Appearance.Outline
                                    DefaultSelectedItems: =[]
                                    DisplayMode: =If(varTransitionSubmitting Or !IsBlank(varPendingTransition), DisplayMode.Disabled, DisplayMode.Edit)
                                    Height: =36
                                    InputTextPlaceholder: =If(!IsBlank(varPendingTransition), fxTranslate("ActionPending", "Aktion ausstehend"), fxTranslate("Actions", "Aktionen"))
                                    IsSearchable: =false
                                    ItemDisplayText: =ThisItem.DisplayTitle
                                    Items: |-
                                      =With(
                                          {
                                              currentStatus: fxCurrentTicketStatus,
                                              currentType: Coalesce(varCurrentTicket.TicketType.Value, "Ticket")
                                          },
                                          AddColumns(
                                              SortByColumns(
                                                   Filter(
                                                       colTransitionConfig,
                                                       (EntityType = "Common" || EntityType = currentType) &&
                                                       (FromStatus = Blank() || FromStatus = currentStatus) &&
                                                      !IsBlank(ToStatus) &&
                                                      (
                                                          Coalesce(fxIsAdmin, false) ||
                                                          Switch(
                                                              RequiredRole,
                                                              "Admin", false,
                                                              "Agent", fxIsAgent,
                                                              "Support", fxIsAgent,
                                                              "CAB-Member", fxIsCabMember,
                                                               "Assignee", !IsBlank(LookUp(varCurrentTicket.'Zugewiesen an', Lower(Email) = Lower(User().Email))),
                                                               "Requester", varCurrentTicket.RequestedBy.Email = User().Email,
                                                              "Change Manager", fxIsAgent || fxIsCabMember,
                                                              Blank(), true,
                                                              "", true,
                                                              true
                                                          )
                                                      )
                                                  ),
                                                  "SortOrder",
                                                  SortOrder.Ascending
                                              ),
                                              DisplayTitle,
                                              fxTranslate(Title, Title)
                                          )
                                      )
                                    LayoutMaxWidth: =170
                                    LayoutMinWidth: =170
                                    OnChange: |-
                                      =Set(
                                          varSelectedTransition,
                                          ddown_actions.Selected
                                      );
                                      If(
                                          Confirm(
                                              If(
                                                  IsBlank(Trim(varSelectedTransition.ConfirmText)),
                                                  fxTranslate(
                                                      "ConfirmExecuteAction",
                                                      "Aktion wirklich ausführen?"
                                                  ),
                                                  varSelectedTransition.ConfirmText
                                              ),
                                              {
                                                  Title: varSelectedTransition.Title,
                                                  ConfirmButton: fxTranslate(
                                                      "Execute",
                                                      "Ausführen"
                                                  ),
                                                  CancelButton: fxTranslate(
                                                      "Cancel",
                                                      "Abbrechen"
                                                  )
                                              }
                                          ),
                                          Set(
                                              varTransitionSubmitting,
                                              true
                                          );
                                          IfError(
                                              Patch(
                                                  ev_sp_list_config_transition_requests,
                                                  Defaults(ev_sp_list_config_transition_requests),
                                                  {
                                                      Title: Coalesce(
                                                          varCurrentTicket.Titel,
                                                          fxTranslate(
                                                              "Ticket",
                                                              "Ticket"
                                                          )
                                                      ) & " - " & varSelectedTransition.ActionKey,
                                                      TicketID: varCurrentTicket.ID,
                                                      TicketNumber: Coalesce(
                                                          varCurrentTicket.Titel,
                                                          varCurrentTicket.TicketId,
                                                          ""
                                                      ),
                                                      TransitionID: varSelectedTransition.ID,
                                                      ActionKey: varSelectedTransition.ActionKey,
                                                      RequestedByEmail: User().Email,
                                                      RequestedByName: Coalesce(
                                                          fxCurrentUser.FullName,
                                                          User().FullName
                                                      ),
                                                      RequestedAt: Now(),
                                                      RequestStatus: "Pending",
                                                      OldStatus: fxCurrentTicketStatus,
                                                      NewStatus: varSelectedTransition.ToStatus,
                                                      OldTicketType: Coalesce(
                                                          varCurrentTicket.TicketType.Value,
                                                          ""
                                                      ),
                                                      NewTicketType: Coalesce(
                                                          varSelectedTransition.TargetTicketType,
                                                          varCurrentTicket.TicketType.Value,
                                                          ""
                                                      ),
                                                      ExpectedModified: varTicketLoadedModified,
                                                      CorrelationId: GUID()
                                                  }
                                              );
                                              Refresh(ev_sp_list_config_transition_requests);
                                              Set(
                                                  varPendingTransition,
                                                  LookUp(
                                                      ev_sp_list_config_transition_requests,
                                                      TicketID = varCurrentTicket.ID && RequestStatus = "Pending"
                                                  )
                                              );
                                              Notify(
                                                  fxTranslate(
                                                      "ActionRequestedAndBeingChecked",
                                                      "Aktion wurde angefordert und wird nun geprüft."
                                                  ),
                                                  NotificationType.Success,
                                                  4000
                                              ),
                                              Notify(
                                                  fxTranslate(
                                                      "ActionRequestFailed",
                                                      "Fehler beim Anfordern der Aktion."
                                                  ),
                                                  NotificationType.Error,
                                                  3000
                                              )
                                          );
                                          Set(
                                              varTransitionSubmitting,
                                              false
                                          ),
                                          Notify(
                                              fxTranslate(
                                                  "ActionCancelled",
                                                  "Aktion abgebrochen"
                                              ),
                                              NotificationType.Information,
                                              2000
                                          )
                                      );
                                      Set(
                                          varSelectedTransition,
                                          Blank()
                                      );
                                      Reset(ddown_actions)
                                    SelectMultiple: =false
                                    Visible: =App.Width >= 600
                                    Width: =120
                              - btn_refresh_ticket:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: =fxTranslate("RefreshTicketData", "Ticketdaten aktualisieren")
                                    Appearance: =ButtonAppearance.Secondary
                                    DisplayMode: =If(IsBlank(varCurrentTicket.ID) || Coalesce(varTicketRefreshing, false), DisplayMode.Disabled, DisplayMode.Edit)
                                    Height: =36
                                    Icon: ="ArrowClockwise"
                                    Layout: =ButtonLayout.IconOnly
                                    OnSelect: |-
                                      =If(
                                           !frmTicketDetails.Unsaved || Confirm(
                                               fxTranslate("DiscardUnsavedAndRefresh", "Ungespeicherte Änderungen verwerfen und Ticketdaten aktualisieren?"),
                                              {
                                                   Title: fxTranslate("RefreshTicket", "Ticket aktualisieren"),
                                                   ConfirmButton: fxTranslate("Aktualisieren", "Aktualisieren"),
                                                   CancelButton: fxTranslate("Cancel", "Abbrechen")
                                              }
                                          ),
                                          Set(varTicketRefreshing, true);
                                          IfError(
                                              Refresh(ev_sp_list_tickets);
                                              Refresh(ev_sp_list_comments);
                                              Refresh(ev_sp_list_config_dropdown);
                                              Refresh(ev_sp_list_config_transitions);
                                               Refresh(ev_sp_list_config_transition_requests);
                                            ClearCollect(colTransitionConfig, Filter(ev_sp_list_config_transitions, Active = true));
                                            ClearCollect(
                                                colTicketDetailsList,
                                                Filter(
                                                    ev_sp_list_tickets,
                                                    Coalesce(fxIsAdmin, false)
                                                        || Coalesce(fxIsAgent, false)
                                                        || RequestedBy.Email = User().Email
                                                        || !IsBlank(LookUp('Zugewiesen an', Lower(Email) = Lower(User().Email)))
                                                )
                                            );
                                               Set(
                                                   varCurrentTicket,
                                                   LookUp(
                                                      ev_sp_list_tickets,
                                                      ID = varCurrentTicket.ID
                                                  )
                                              );
                                           Set(varTicketLoadedModified, varCurrentTicket.Geändert);
                                           Set(varPendingTransition, LookUp(ev_sp_list_config_transition_requests, TicketID = varCurrentTicket.ID && RequestStatus = "Pending"));
                                               ResetForm(frmTicketDetails);
                                               Notify(fxTranslate("TicketDataRefreshed", "Ticketdaten aktualisiert."), NotificationType.Success, 2000),
                                               Notify(Substitute(fxTranslate("TicketDataRefreshFailed", "Ticketdaten konnten nicht aktualisiert werden: {0}"), "{0}", FirstError.Message), NotificationType.Error, 5000)
                                          );
                                          Set(varTicketRefreshing, false)
                                      )
