      - tds_promote_change_overlay:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(15, 23, 42, 0.58)
            Height: =Parent.Height
            Visible: =locTicketMode <> "Edit" && varShowPromoteToChangeDialog
            Width: =Parent.Width
          Children:
            - tds_promote_change_modal:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.ExtraBold
                  Fill: =RGBA(255, 255, 255, 1)
                  Height: =430
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =14
                  PaddingBottom: =22
                  PaddingLeft: =22
                  PaddingRight: =22
                  PaddingTop: =22
                  RadiusBottomLeft: =14
                  RadiusBottomRight: =14
                  RadiusTopLeft: =14
                  RadiusTopRight: =14
                  Width: =Min(Parent.Width - 48, 560)
                  X: =(Parent.Width - Self.Width) / 2
                  Y: =(Parent.Height - Self.Height) / 2
                Children:
                  - txt_promote_change_title:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(15, 23, 42, 1)
                        FontWeight: =FontWeight.Bold
                        Size: =22
                        Text: =fxTranslate("PromoteToChangeTitle", "Ticket zu Change hochstufen?")
                        Width: =Parent.Width - 44
                  - txt_promote_change_body:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(71, 85, 105, 1)
                        Height: =78
                        Size: =14
                        Text: =fxTranslate("PromoteToChangeBody", "Das Ticket wird als Change angefordert. Bitte dokumentiere kurz, warum aus diesem Ticket ein Change werden soll.")
                        Width: =Parent.Width - 44
                  - inp_promote_change_note:
                      Control: ModernTextInput
                      Properties:
                        AccessibleLabel: =fxTranslate("PromoteReason", "Grund für Hochstufung")
                        Appearance: =Appearance.FilledLighter
                        Default: =varPromoteToChangeNoteDraft
                        DisplayMode: =If(varPromoteToChangeSubmitting, DisplayMode.Disabled, DisplayMode.Edit)
                        Height: =150
                        MaxLength: =1000
                        OnChange: =Set(varPromoteToChangeNoteDraft, Self.Text)
                        Placeholder: =fxTranslate("PromoteReasonPlaceholder", "Warum soll dieses Ticket als Change weitergeführt werden?")
                        Type: =TextInputType.Multiline
                        Width: =Parent.Width - 44
                  - row_promote_change_actions:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =44
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =10
                        LayoutJustifyContent: =LayoutJustifyContent.End
                        Width: =Parent.Width - 44
                      Children:
                        - btn_cancel_promote_change:
                            Control: ModernButton
                            Properties:
                              Appearance: =ButtonAppearance.Secondary
                              DisplayMode: =If(varPromoteToChangeSubmitting, DisplayMode.Disabled, DisplayMode.Edit)
                              Height: =38
                              OnSelect: =Set(varShowPromoteToChangeDialog, false); Set(varPromoteToChangeNoteDraft, "")
                              Text: =fxTranslate("Cancel", "Abbrechen")
                              Width: =120
                        - btn_confirm_promote_change:
                            Control: ModernButton
                            Properties:
                              DisplayMode: =If(varPromoteToChangeSubmitting Or IsBlank(Trim(inp_promote_change_note.Text)), DisplayMode.Disabled, DisplayMode.Edit)
                              Height: =38
                              Icon: ="ArrowUpRight"
                              OnSelect: |-
                                =Set(varPromoteToChangeSubmitting, true);
                                Set(
                                    varPromoteTransition,
                                    First(
                                        SortByColumns(
                                            Filter(
                                                colTransitionConfig,
                                                TargetTicketType = "Change" &&
                                                (EntityType = "Common" || EntityType = Coalesce(varCurrentTicket.TicketType.Value, "Incident")) &&
                                                !IsBlank(ToStatus)
                                            ),
                                            "SortOrder",
                                            SortOrder.Ascending
                                        )
                                    )
                                );
                                IfError(
                                    Patch(
                                        ev_sp_list_config_transition_requests,
                                        Defaults(ev_sp_list_config_transition_requests),
                                        {
                                            Title: Coalesce(varCurrentTicket.Titel, varCurrentTicket.Titel, varCurrentTicket.TicketId, fxTranslate("Ticket", "Ticket")) & " - PromoteToChange",
                                            TicketID: varCurrentTicket.ID,
                                            TicketNumber: Coalesce(varCurrentTicket.Titel, varCurrentTicket.Titel, varCurrentTicket.TicketId, ""),
                                            TransitionID: varPromoteTransition.ID,
                                            ActionKey: Coalesce(varPromoteTransition.ActionKey, "PromoteToChange"),
                                            RequestedByEmail: User().Email,
                                            RequestedByName: Coalesce(fxCurrentUser.FullName, User().FullName),
                                            RequestedAt: Now(),
                                            RequestStatus: "Pending",
                                            OldStatus: fxCurrentTicketStatus,
                                            NewStatus: Coalesce(varPromoteTransition.ToStatus, "Change Prüfung"),
                                            OldTicketType: Coalesce(varCurrentTicket.TicketType.Value, "Incident"),
                                            NewTicketType: "Change",
                                            ExpectedModified: varTicketLoadedModified,
                                            UserComment: Trim(inp_promote_change_note.Text),
                                            CorrelationId: GUID()
                                        }
                                    );
                                    Refresh(ev_sp_list_config_transition_requests);
                                    Set(varPendingTransition, LookUp(ev_sp_list_config_transition_requests, TicketID = varCurrentTicket.ID && RequestStatus = "Pending"));
                                    Set(varShowPromoteToChangeDialog, false);
                                    Set(varPromoteToChangeNoteDraft, "");
                                    Notify(fxTranslate("PromoteToChangeRequested", "Hochstufung zu Change wurde angefordert."), NotificationType.Success, 4000),
                                    Notify(fxTranslate("PromoteToChangeFailed", "Hochstufung zu Change konnte nicht angefordert werden."), NotificationType.Error, 4000)
                                );
                                Set(varPromoteToChangeSubmitting, false)
                              Text: =fxTranslate("PromoteToChangeConfirm", "Zu Change machen")
                              Width: =170
