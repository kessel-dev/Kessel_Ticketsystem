      - tmr_ticket_id_polling:
          Control: Timer
          Properties:
            Duration: =2000
            OnTimerEnd: |-
              =IfError(
                  Refresh(ev_sp_list_tickets);
                  With(
                      {polledTicket: LookUp(ev_sp_list_tickets, ID = varTicketIdToLoad)},
                      If(
                          IsBlank(polledTicket),
                          Set(varTicketIdPolling, false),
                          Set(varCurrentTicket, polledTicket);
                          If(
                              !frmTicketDetails.Unsaved,
                              Set(varTicketLoadedModified, polledTicket.Geändert)
                          );
                          Set(varTicketIdPollingAttempts, varTicketIdPollingAttempts + 1);
                          If(
                              IsBlank(polledTicket.TicketId) && varTicketIdPollingAttempts >= 15,
                              Set(varTicketIdPolling, false);
                              Notify(fxTranslate("TicketNumberStillGenerating", "Die Ticketnummer wird noch erzeugt. Bitte später über Aktualisieren erneut laden."), NotificationType.Information, 5000),
                              Set(varTicketIdPolling, IsBlank(polledTicket.TicketId))
                          )
                      )
                  ),
                  Set(varTicketIdPolling, false);
                  Notify(
                      fxTranslate("TicketDetailsRefreshFailed", "Die aktuellen Ticketdetails konnten noch nicht geladen werden."),
                      NotificationType.Warning,
                      5000
                  )
              )
            Repeat: =true
            Reset: =!varTicketIdPolling
            Start: =varTicketIdPolling
            Visible: =false
