Screens:
  dashboard_screen:
    Properties:
      OnVisible: |-
        =Set(
            varShowNotifications,
            false
        );
        If(
            !IsBlank(varDeepLinkNotice),
            Notify(varDeepLinkNotice, NotificationType.Warning, 5000);
            Set(varDeepLinkNotice, Blank())
        );
        If(
            IsBlank(varDbdSearchText),
            Set(
                varDbdSearchText,
                ""
            )
        );
        If(
            IsBlank(varDbdRequesterFilter),
            Set(varDbdRequesterFilter, Blank())
        );
        If(
            IsBlank(varDbdStatusFilter),
            Set(
                varDbdStatusFilter,
                {Value: "Alle"}
            )
        );
        If(
            IsBlank(varDbdPriorityFilter),
            Set(
                varDbdPriorityFilter,
                {Value: "Alle"}
            )
        );
        If(
            IsBlank(varDbdScopeFilter),
            Set(
                varDbdScopeFilter,
                {Value: "Alle"}
            )
        );
        If(
            IsBlank(varDbdTicketTypeFilter),
            Set(
                varDbdTicketTypeFilter,
                {Value: "Alle"}
            )
        );
        If(
            IsBlank(varDbdCategoryFilter),
            Set(
                varDbdCategoryFilter,
                {Value: "Alle"}
            )
        );
        If(
            IsBlank(varDbdDepartmentFilter),
            Set(
                varDbdDepartmentFilter,
                {Value: "Alle"}
            )
        );
        If(
            IsBlank(varDbdRiskFilter),
            Set(
                varDbdRiskFilter,
                {Value: "Alle"}
            )
        );
        Set(
            varDbdShowMoreFilters,
            Coalesce(
                varDbdShowMoreFilters,
                false
            )
        );
        Set(
            varDbdShowSavedViewActions,
            false
        );
        Set(
            varDbdShowSaveView,
            false
        );
          Set(
              varDbdFiltersDirty,
              false
          );
          Set(varDbdNotificationsLoading, false);
          Set(varDbdIsCreatingView, false);
          If(
              IsBlank(varDbdLastRefresh) Or DateDiff(varDbdLastRefresh, Now(), TimeUnit.Seconds) > 30,
              Set(varDbdRefreshing, true);
              IfError(
                  Refresh(ev_sp_list_tickets);
              Refresh(ev_sp_list_comments);
              Refresh(ev_sp_list_notifications);
              Refresh(ev_sp_list_config_saved_views);
              Set(varDbdLastRefresh, Now()),
                  Notify(Substitute(fxTranslate("DashboardRefreshFailed", "Dashboard konnte nicht aktualisiert werden: {0}"), "{0}", FirstError.Message), NotificationType.Error, 5000)
              );
              Set(varDbdRefreshing, false)
          )
    Children:
      - dbd_root:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(248, 249, 252, 1)
            Height: =Parent.Height
            LayoutDirection: =LayoutDirection.Vertical
            Width: =Parent.Width
          Children:
            - dbd_topbar:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  Height: =72
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width
                Children:
                  - dbd_brand_container:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =Parent.Height
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =fxDbdControlGap
                        LayoutMinHeight: =0
                        LayoutMinWidth: =fxDbdSidebarWidth + (fxDbdPagePadding * 2)
                        PaddingLeft: =fxDbdPagePadding
                        PaddingRight: =fxDbdPagePadding
                        Width: =fxDbdSidebarWidth + (fxDbdPagePadding * 2)
                      Children:
                        - dbd_logo:
                            Control: ModernText
                            Properties:
                              Align: =Align.Center
                              Color: =RGBA(255, 255, 255, 1)
                              Fill: =RGBA(87, 35, 129, 1)
                              FontWeight: =FontWeight.Semibold
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              RadiusBottomLeft: =5
                              RadiusBottomRight: =5
                              RadiusTopLeft: =5
                              RadiusTopRight: =5
                              Size: =8
                              Text: ="KESSEL"
                              Width: =32
                        - dbd_topbar_title:
                            Control: ModernText
                            Properties:
                              Color: =RGBA(18, 31, 52, 1)
                              FillPortions: =1
                              FontWeight: =FontWeight.Semibold
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =16
                              Text: =fxTranslate("ItServicePortal", "IT Service Portal")
                              Wrap: =false
                  - dbd_header_spacer:
                      Control: GroupContainer
                      Variant: ManualLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Height: =Parent.Height
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                  - dbd_header_actions:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =Parent.Height
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =fxDbdControlGap
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingRight: =fxDbdPagePadding
                        Width: =364
                      Children:
                        - dbd_language_selector:
                            Control: ModernDropdown
                            Properties:
                              AccessibleLabel: =fxTranslate("SelectLanguage", "Sprache auswählen")
                              Default: |-
                                =LookUp(Table({Code: "de", Label: "DE"}, {Code: "en", Label: "EN"}), Code = Coalesce(varCurrentLanguage, "de"))
                              Height: =34
                              ItemDisplayText: =ThisItem.Label
                              Items: |-
                                =Table({Code: "de", Label: "DE"}, {Code: "en", Label: "EN"})
                              OnChange: =Set(varCurrentLanguage, Coalesce(Self.Selected.Code, "de"))
                              Width: =72
                        - dbd_notification_button_frame:
                            Control: GroupContainer
                            Variant: ManualLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =36
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              RadiusBottomLeft: =6
                              RadiusBottomRight: =6
                              RadiusTopLeft: =6
                              RadiusTopRight: =6
                              Width: =36
                            Children:
                              - dbd_notifications:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: =fxTranslate("ShowNotifications", "Benachrichtigungen anzeigen")
                                    Appearance: =ButtonAppearance.Transparent
                                    BorderThickness: =0
                                    Height: =36
                                    Icon: ="Alert"
                                    Layout: =ButtonLayout.IconOnly
                                    OnSelect: |-
                                      =If(
                                          varShowNotifications,
                                          Set(varShowNotifications, false),
                                          Set(varDbdNotificationsLoading, true);
                                          Set(varShowNotifications, true);
                                          Refresh(ev_sp_list_notifications);
                                          Set(varDbdNotificationsLoading, false)
                                      )
                                    RadiusBottomLeft: =6
                                    RadiusBottomRight: =6
                                    RadiusTopLeft: =6
                                    RadiusTopRight: =6
                                    Tooltip: =fxTranslate("ShowNewComments", "Neue Kommentare anzeigen")
                                    Width: =36
                              - dbd_notification_badge:
                                  Control: ModernText
                                  Properties:
                                    Align: =Align.Center
                                    Color: =RGBA(255, 255, 255, 1)
                                    Fill: =RGBA(220, 38, 38, 1)
                                    FontWeight: =FontWeight.Bold
                                    Height: =18
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    RadiusBottomLeft: =9
                                    RadiusBottomRight: =9
                                    RadiusTopLeft: =9
                                    RadiusTopRight: =9
                                    Size: =9
                                    Text: =fxTranslate("Neu", "Neu")
                                    Visible: =!IsEmpty(fxDbdNotifications)
                                    Width: =20
                                    X: =20
                                    Y: =-2
                        - dbd_user_menu:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =40
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =8
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingLeft: =4
                              PaddingRight: =8
                              RadiusBottomLeft: =6
                              RadiusBottomRight: =6
                              RadiusTopLeft: =6
                              RadiusTopRight: =6
                              Width: =132
                            Children:
                              - dbd_avatar:
                                  Control: ModernText
                                  Properties:
                                    Align: =Align.Center
                                    Color: =RGBA(87, 35, 129, 1)
                                    Fill: =RGBA(246, 241, 249, 1)
                                    FontWeight: =FontWeight.Semibold
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    RadiusBottomLeft: =16
                                    RadiusBottomRight: =16
                                    RadiusTopLeft: =16
                                    RadiusTopRight: =16
                                    Size: =12
                                    Text: =Upper(Left(fxCurrentUser.FullName, 2))
                                    Width: =32
                              - dbd_user_name:
                                  Control: ModernText
                                  Properties:
                                    Color: =RGBA(35, 39, 47, 1)
                                    FillPortions: =1
                                    FontWeight: =FontWeight.Semibold
                                    Height: =24
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =12
                                    Text: =Left(fxCurrentUser.FullName, Find(" ", fxCurrentUser.FullName & " ") - 1)
                                    Width: =58
                                    Wrap: =false
                        - dbd_refresh:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: =fxTranslate("RefreshDashboard", "Dashboard aktualisieren")
                              Appearance: =ButtonAppearance.Transparent
                              BorderThickness: =0
                              DisplayMode: =If(Coalesce(varDbdRefreshing, false), DisplayMode.Disabled, DisplayMode.Edit)
                              Height: =36
                              Icon: ="ArrowClockwise"
                              Layout: =ButtonLayout.IconOnly
                              OnSelect: |-
                                =Set(varDbdRefreshing, true);
                                IfError(
                                    Refresh(ev_sp_list_tickets);
                                    Refresh(ev_sp_list_comments);
                                    Refresh(ev_sp_list_notifications);
                                    Refresh(ev_sp_list_config_saved_views);
                                    Set(varDbdLastRefresh, Now());
                                    Notify(fxTranslate("DashboardRefreshed", "Dashboard aktualisiert."), NotificationType.Success, 2000),
                                    Notify(Substitute(fxTranslate("DashboardRefreshFailed", "Dashboard konnte nicht aktualisiert werden: {0}"), "{0}", FirstError.Message), NotificationType.Error, 5000)
                                );
                                Set(varDbdRefreshing, false)
                              RadiusBottomLeft: =6
                              RadiusBottomRight: =6
                              RadiusTopLeft: =6
                              RadiusTopRight: =6
                              Tooltip: =fxTranslate("RefreshDashboard", "Dashboard aktualisieren")
                              Width: =36
            - dbd_header_divider:
                Control: GroupContainer
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(229, 230, 234, 1)
                  FillPortions: =0
                  Height: =1
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  Width: =Parent.Width
            - dbd_shell:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =fxDbdPageGap
                  PaddingBottom: =fxDbdPagePadding
                  PaddingLeft: =fxDbdPagePadding
                  PaddingRight: =fxDbdPagePadding
                  PaddingTop: =fxDbdPagePadding
                  Width: =Parent.Width
                Children:
                  - dbd_sidebar:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(250, 250, 252, 1)
                        FillPortions: =0
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =fxDbdSectionGap
                        LayoutMinHeight: =0
                        LayoutMinWidth: =fxDbdSidebarWidth
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        Width: =fxDbdSidebarWidth
                      Children:
                        - dbd_nav_create:
                            Control: ModernButton
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              BasePaletteColor: =RGBA(87, 35, 129, 1)
                              Color: =Color.White
                              Height: =52
                              Icon: ="Add"
                              OnSelect: =Navigate(request_type_screen, ScreenTransition.CoverRight)
                              RadiusBottomLeft: =6
                              RadiusBottomRight: =6
                              RadiusTopLeft: =6
                              RadiusTopRight: =6
                              Size: =14
                              Text: =fxTranslate("CreateTicket", "Ticket erstellen")
                              Width: =Parent.Width
                        - dbd_sidebar_nav_divider:
                            Control: GroupContainer
                            Variant: ManualLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =RGBA(225, 225, 230, 1)
                              FillPortions: =0
                              Height: =1
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Width: =Parent.Width
                        - dbd_sidebar_panel:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =0
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =fxDbdControlGap
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              LayoutOverflowY: =LayoutOverflow.Scroll
                              Visible: =false
                              Width: =Parent.Width
                            Children:
                              - dbd_search_box:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    BorderColor: =RGBA(205, 205, 212, 1)
                                    BorderThickness: =1
                                    DropShadow: =DropShadow.None
                                    Fill: =RGBA(255, 255, 255, 1)
                                    FillPortions: =0
                                    Height: =30
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingLeft: =8
                                    PaddingRight: =8
                                    RadiusBottomLeft: =6
                                    RadiusBottomRight: =6
                                    RadiusTopLeft: =6
                                    RadiusTopRight: =6
                                    Width: =Parent.Width
                                  Children:
                                    - dbd_search_icon:
                                        Control: ModernButton
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Stretch
                                          Appearance: =ButtonAppearance.Subtle
                                          Height: =30
                                          Icon: ="Search"
                                          Layout: =ButtonLayout.IconOnly
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          Width: =32
                                    - dbd_inp_search:
                                        Control: ModernTextInput
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Stretch
                                          Appearance: =Appearance.FilledLighter
                                          Default: =Coalesce(varDbdSearchText, "")
                                          FillPortions: =1
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          OnChange: |-
                                            =Set(varDbdFiltersDirty, true);
                                            Set(varDbdShowSaveView, false)
                                          Placeholder: =fxTranslate("SearchTicketPlaceholder", "Ticket suchen...")
                                          Size: =12
                                          TriggerOutput: =TriggerOutput.Delayed
                              - dbd_filter_label:
                                  Control: ModernText
                                  Properties:
                                    Color: =RGBA(100, 100, 110, 1)
                                    FontWeight: =FontWeight.Semibold
                                    Height: =18
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =11
                                    Text: =fxTranslate("Filter", "FILTER")
                                    Width: =Parent.Width
                                    Wrap: =false
                              - dbd_status_filter_label:
                                  Control: ModernText
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Color: =RGBA(70, 70, 80, 1)
                                    Height: =18
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =12
                                    Text: =fxTranslate("Status", "Status")
                                    Width: =Parent.Width
                                    Wrap: =false
                              - dbd_status_filter:
                                  Control: ModernDropdown
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Appearance: =Appearance.FilledLighter
                                    BorderColor: =RGBA(205, 205, 212, 1)
                                    BorderThickness: =1
                                    Default: |-
                                      =LookUp(
                                          AddColumns(
                                              Table({Value: "Alle"}, {Value: "Offen"}, {Value: "Zugewiesen"}, {Value: "In Bearbeitung"}, {Value: "Warten auf Anforderer"}, {Value: "Gelöst"}, {Value: "Geschlossen"}),
                                              DisplayValue,
                                              fxTranslate(Value, Value)
                                          ),
                                          Value = Coalesce(varDbdStatusFilter.Value, "Alle")
                                      )
                                    Fill: =RGBA(255, 255, 255, 1)
                                    Height: =30
                                    ItemDisplayText: =ThisItem.DisplayValue
                                    Items: |-
                                      =AddColumns(
                                          Table(
                                          {Value: "Alle"},
                                          {Value: "Offen"},
                                          {Value: "Zugewiesen"},
                                          {Value: "In Bearbeitung"},
                                          {Value: "Warten auf Anforderer"},
                                          {Value: "Gelöst"},
                                          {Value: "Geschlossen"}
                                          ),
                                          DisplayValue,
                                          fxTranslate(Value, Value)
                                      )
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnChange: |-
                                      =Set(varDbdFiltersDirty, true);
                                      Set(varDbdShowSaveView, false)
                                    Width: =Parent.Width
                              - dbd_ticket_type_filter_label:
                                  Control: ModernText
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Color: =RGBA(70, 70, 80, 1)
                                    Height: =18
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =12
                                    Text: =fxTranslate("TicketType", "Tickettyp")
                                    Width: =Parent.Width
                                    Wrap: =false
                              - dbd_ticket_type_filter:
                                  Control: ModernDropdown
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Appearance: =Appearance.FilledLighter
                                    BorderColor: =RGBA(205, 205, 212, 1)
                                    BorderThickness: =1
                                    Default: |-
                                      =LookUp(
                                          AddColumns(
                                              SortByColumns(Ungroup(Table({Rows: Table({Value: "Alle"})}, {Rows: Filter(ForAll(Distinct(ev_sp_list_tickets, TicketType.Value), {Value: Value}), !IsBlank(Value))}), Rows), "Value", SortOrder.Ascending),
                                              DisplayValue,
                                              fxTranslate(Value, Value)
                                          ),
                                          Value = Coalesce(varDbdTicketTypeFilter.Value, "Alle")
                                      )
                                    Fill: =RGBA(255, 255, 255, 1)
                                    Height: =30
                                    ItemDisplayText: =ThisItem.DisplayValue
                                    Items: |-
                                      =AddColumns(
                                          SortByColumns(
                                              Ungroup(
                                                  Table(
                                                      {Rows: Table({Value: "Alle"})},
                                                      {Rows: Filter(ForAll(Distinct(ev_sp_list_tickets, TicketType.Value), {Value: Value}), !IsBlank(Value))}
                                                  ),
                                                  Rows
                                              ),
                                              "Value",
                                              SortOrder.Ascending
                                          ),
                                          DisplayValue,
                                          fxTranslate(Value, Value)
                                      )
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnChange: |-
                                      =Set(varDbdFiltersDirty, true);
                                      Set(varDbdShowSaveView, false)
                                    Width: =Parent.Width
                              - dbd_scope_filter_label:
                                  Control: ModernText
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Color: =RGBA(70, 70, 80, 1)
                                    Height: =18
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =12
                                    Text: =fxTranslate("Scope", "Umfang")
                                    Visible: =fxIsAgentExperience && varDbdShowMoreFilters
                                    Width: =Parent.Width
                                    Wrap: =false
                              - dbd_scope_filter:
                                  Control: ModernDropdown
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Appearance: =Appearance.FilledLighter
                                    BorderColor: =RGBA(205, 205, 212, 1)
                                    BorderThickness: =1
                                    Default: |-
                                      =LookUp(
                                          AddColumns(
                                              Table({Value: "Alle"}, {Value: "Mir zugewiesen"}, {Value: "Von mir erstellt"}, {Value: "Von mir angefordert"}),
                                              DisplayValue,
                                              fxTranslate(Value, Value)
                                          ),
                                          Value = Coalesce(varDbdScopeFilter.Value, "Alle")
                                      )
                                    Fill: =RGBA(255, 255, 255, 1)
                                    Height: =30
                                    ItemDisplayText: =ThisItem.DisplayValue
                                    Items: |-
                                      =AddColumns(
                                          Table(
                                          {Value: "Alle"},
                                          {Value: "Mir zugewiesen"},
                                          {Value: "Von mir erstellt"},
                                          {Value: "Von mir angefordert"}
                                          ),
                                          DisplayValue,
                                          fxTranslate(Value, Value)
                                      )
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnChange: |-
                                      =Set(varDbdFiltersDirty, true);
                                      Set(varDbdShowSaveView, false)
                                    Visible: =fxIsAgentExperience && varDbdShowMoreFilters
                                    Width: =Parent.Width
                              - dbd_category_filter_label:
                                  Control: ModernText
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Color: =RGBA(70, 70, 80, 1)
                                    Height: =18
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =12
                                    Text: =fxTranslate("Kategorie", "Kategorie")
                                    Visible: =fxIsAgentExperience && varDbdShowMoreFilters
                                    Width: =Parent.Width
                                    Wrap: =false
                              - dbd_category_filter:
                                  Control: ModernDropdown
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Appearance: =Appearance.FilledLighter
                                    BorderColor: =RGBA(205, 205, 212, 1)
                                    BorderThickness: =1
                                    Default: |-
                                      =LookUp(
                                          AddColumns(
                                              SortByColumns(Ungroup(Table({Rows: Table({Value: "Alle"})}, {Rows: Filter(ForAll(Distinct(ev_sp_list_tickets, Category.Value), {Value: Value}), !IsBlank(Value))}), Rows), "Value", SortOrder.Ascending),
                                              DisplayValue,
                                              fxTranslate(Value, Value)
                                          ),
                                          Value = Coalesce(varDbdCategoryFilter.Value, "Alle")
                                      )
                                    Fill: =RGBA(255, 255, 255, 1)
                                    Height: =30
                                    ItemDisplayText: =ThisItem.DisplayValue
                                    Items: |-
                                      =AddColumns(
                                          SortByColumns(
                                              Ungroup(
                                                  Table(
                                                      {Rows: Table({Value: "Alle"})},
                                                      {Rows: Filter(ForAll(Distinct(ev_sp_list_tickets, Category.Value), {Value: Value}), !IsBlank(Value))}
                                                  ),
                                                  Rows
                                              ),
                                              "Value",
                                              SortOrder.Ascending
                                          ),
                                          DisplayValue,
                                          fxTranslate(Value, Value)
                                      )
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnChange: |-
                                      =Set(varDbdFiltersDirty, true);
                                      Set(varDbdShowSaveView, false)
                                    Visible: =fxIsAgentExperience && varDbdShowMoreFilters
                                    Width: =Parent.Width
                              - dbd_department_filter_label:
                                  Control: ModernText
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Color: =RGBA(70, 70, 80, 1)
                                    Height: =18
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =12
                                    Text: =fxTranslate("Department", "Abteilung")
                                    Visible: =fxIsAgentExperience && varDbdShowMoreFilters
                                    Width: =Parent.Width
                                    Wrap: =false
                              - dbd_department_filter:
