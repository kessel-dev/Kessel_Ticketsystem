                                                            "Offen", RGBA(32, 91, 160, 1),
                                                            "In Bearbeitung", RGBA(126, 85, 0, 1),
                                                            "Zurück zur Überarbeitung", RGBA(153, 75, 0, 1),
                                                            "Erledigt", RGBA(31, 105, 63, 1),
                                                            "Gelöst", RGBA(31, 105, 63, 1),
                                                            "Geschlossen", RGBA(31, 105, 63, 1),
                                                            RGBA(70, 70, 75, 1)
                                                        )
                                                      Fill: |-
                                                        =Switch(
                                                            Coalesce(ThisItem.Status.Value, ""),
                                                            "Offen", RGBA(224, 238, 255, 1),
                                                            "In Bearbeitung", RGBA(255, 242, 204, 1),
                                                            "Zurück zur Überarbeitung", RGBA(255, 235, 214, 1),
                                                            "Erledigt", RGBA(224, 242, 232, 1),
                                                            "Gelöst", RGBA(224, 242, 232, 1),
                                                            "Geschlossen", RGBA(224, 242, 232, 1),
                                                            RGBA(238, 238, 240, 1)
                                                        )
                                                      FontWeight: =FontWeight.Semibold
                                                      Height: =24
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =0
                                                      PaddingBottom: =0
                                                      PaddingLeft: =8
                                                      PaddingRight: =8
                                                      PaddingTop: =0
                                                      RadiusBottomLeft: =4
                                                      RadiusBottomRight: =4
                                                      RadiusTopLeft: =4
                                                      RadiusTopRight: =4
                                                      Size: =11
                                                      Text: =Coalesce(ThisItem.Status.Value, fxTranslate("NotSet", "Nicht gesetzt"))
                                                      Width: =Min(Parent.Width, Max(72, Len(Coalesce(ThisItem.Status.Value, fxTranslate("NotSet", "Nicht gesetzt"))) * 8 + 28))
                                          - dbd_row_priority:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                FillPortions: =0
                                                Height: =Parent.Height
                                                LayoutAlignItems: =LayoutAlignItems.Center
                                                LayoutDirection: =LayoutDirection.Horizontal
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                Visible: =fxIsAgentExperience
                                                Width: =(Parent.Width - (fxDbdCardPadding * 2)) * 0.10
                                              Children:
                                                - dbd_row_priority_text:
                                                    Control: ModernText
                                                    Properties:
                                                      Align: =Align.Center
                                                      AlignInContainer: =AlignInContainer.Center
                                                      Color: |-
                                                        =Switch(
                                                            Coalesce(ThisItem.Priority.Value, ""),
                                                            "Hoch", RGBA(139, 0, 0, 1),
                                                            "Mittel", RGBA(126, 85, 0, 1),
                                                            "Niedrig", RGBA(42, 89, 150, 1),
                                                            RGBA(100, 100, 108, 1)
                                                        )
                                                      Fill: |-
                                                        =Switch(
                                                            Coalesce(ThisItem.Priority.Value, ""),
                                                            "Hoch", RGBA(255, 232, 232, 1),
                                                            "Mittel", RGBA(255, 242, 204, 1),
                                                            "Niedrig", RGBA(226, 238, 255, 1),
                                                            RGBA(238, 238, 240, 1)
                                                        )
                                                      Font: =Font.Arial
                                                      FontWeight: =FontWeight.Semibold
                                                      Height: =24
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =0
                                                      PaddingBottom: =0
                                                      PaddingLeft: =8
                                                      PaddingRight: =8
                                                      PaddingTop: =0
                                                      RadiusBottomLeft: =4
                                                      RadiusBottomRight: =4
                                                      RadiusTopLeft: =4
                                                      RadiusTopRight: =4
                                                      Size: =11
                                                      Text: =Coalesce(ThisItem.Priority.Value, fxTranslate("NotSet", "Nicht gesetzt"))
                                                      Width: =Min(Parent.Width, Max(64, Len(Coalesce(ThisItem.Priority.Value, fxTranslate("NotSet", "Nicht gesetzt"))) * 7 + 24))
                                          - dbd_row_updated:
                                              Control: ModernText
                                              Properties:
                                                Color: =RGBA(55, 65, 81, 1)
                                                LayoutMinWidth: =0
                                                Size: =13
                                                Text: =Text(ThisItem.Geändert, "[$-de-DE]dd.mm. HH:mm")
                                                Width: =(Parent.Width - (fxDbdCardPadding * 2)) * If(fxIsAgentExperience, 0.10, 0.10)
                                          - dbd_row_open:
                                              Control: ModernButton
                                              Properties:
                                                Appearance: =ButtonAppearance.Transparent
                                                BorderThickness: =0
                                                Color: =RGBA(80, 80, 85, 1)
                                                Icon: ="ArrowRight"
                                                Layout: =ButtonLayout.IconOnly
                                                LayoutMinWidth: =0
                                                OnSelect: |-
                                                  =Set(varCurrentTicket, LookUp(ev_sp_list_tickets, ID = ThisItem.ID));
                                                  Set(varTicketLoadedModified, varCurrentTicket.Geändert);
                                                  Navigate(ticket_details_screen, ScreenTransition.None)
                                                RadiusBottomLeft: =4
                                                RadiusBottomRight: =4
                                                RadiusTopLeft: =4
                                                RadiusTopRight: =4
                                                Width: =(Parent.Width - (fxDbdCardPadding * 2)) * If(fxIsAgentExperience, 0.06, 0.08)
                                    - dbd_row_divider:
                                        Control: GroupContainer
                                        Variant: ManualLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          Fill: =RGBA(231, 232, 235, 1)
                                          Height: =1
                                          Width: =Parent.TemplateWidth
                                          Y: =Parent.TemplateHeight - 1
                                    - dbd_row_click_target:
                                        Control: ModernButton
                                        Properties:
                                          AccessibleLabel: =Substitute(fxTranslate("OpenTicketTemplate", "Ticket {0} öffnen"), "{0}", Coalesce(ThisItem.Titel, ThisItem.TicketId, Text(ThisItem.ID)))
                                          Appearance: =ButtonAppearance.Transparent
                                          BorderThickness: =0
                                          Height: =Parent.TemplateHeight
                                          OnSelect: |-
                                            =Set(varCurrentTicket, LookUp(ev_sp_list_tickets, ID = ThisItem.ID));
                                            Set(varTicketLoadedModified, varCurrentTicket.Geändert);
                                            Navigate(ticket_details_screen, ScreenTransition.None)
                                          Text: =""
                                          Width: =Parent.TemplateWidth
      - dbd_notifications_overlay:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =Parent.Height
            Visible: =varShowNotifications
            Width: =Parent.Width
          Children:
            - dbd_notifications_dismiss:
                Control: Button
                Properties:
                  AcceptsFocus: =false
                  AccessibleLabel: =fxTranslate("CloseNotifications", "Benachrichtigungen schließen")
                  Appearance: ='ButtonCanvas.Appearance'.Transparent
                  BorderThickness: =0
                  Height: =Parent.Height
                  OnSelect: =Set(varShowNotifications, false)
                  Text: =""
                  Width: =Parent.Width
            - dbd_notifications_flyout:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  BorderColor: =RGBA(224, 226, 231, 1)
                  BorderThickness: =1
                  DropShadow: =DropShadow.Regular
                  Fill: =RGBA(255, 255, 255, 1)
                  Height: =300
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =8
                  PaddingBottom: =12
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =10
                  RadiusBottomLeft: =10
                  RadiusBottomRight: =10
                  RadiusTopLeft: =10
                  RadiusTopRight: =10
                  Width: =Min(430, Parent.Width - 32)
                  X: =Max(16, Parent.Width - Self.Width - 112)
                  Y: =50
                Children:
                  - dbd_notifications_flyout_header:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =36
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Width: =Parent.Width
                      Children:
                        - dbd_notifications_flyout_title:
                            Control: ModernText
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =RGBA(17, 24, 39, 1)
                              FillPortions: =1
                              FontWeight: =FontWeight.Semibold
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Text: =fxTranslate("NewUpdates", "Neue Updates")
                              Wrap: =false
                        - dbd_notifications_flyout_count:
                            Control: ModernText
                            Properties:
                              Align: =Align.Center
                              Color: =RGBA(87, 35, 129, 1)
                              Fill: =RGBA(245, 240, 250, 1)
                              FontWeight: =FontWeight.Semibold
                              Height: =38
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =6
                              PaddingRight: =6
                              PaddingTop: =0
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              Size: =11
                              Text: =fxTranslate("Neu", "Neu")
                              Width: =38
                        - dbd_notifications_flyout_mark_read:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: =fxTranslate("MarkAllNotificationsAsRead", "Alle Benachrichtigungen als gelesen markieren")
                              Appearance: =ButtonAppearance.Secondary
                              Icon: ="CheckmarkCircle"
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =If(
                                    IsBlank(fxCurrentMember),
                                    Notify(fxTranslate("UserProfileNotFound", "Dein Benutzerprofil konnte nicht gefunden werden."), NotificationType.Error, 5000),
                                    Set(varNotificationReadAt, Now());
                                    IfError(
                                         UpdateIf(ev_sp_list_notifications, RecipientEmail = fxCurrentUser.Email && IsRead = false, {IsRead: true, ReadAt: Today()});
                                        Patch(ev_sp_list_config_members, fxCurrentMember, {LastNotificationRead: varNotificationReadAt});
                                        Set(varShowNotifications, false);
                                        Notify(fxTranslate("NotificationsMarkedAsRead", "Benachrichtigungen als gelesen markiert."), NotificationType.Success, 2500),
                                        Notify(Substitute(fxTranslate("NotificationsMarkReadFailed", "Benachrichtigungen konnten nicht als gelesen markiert werden: {0}"), "{0}", FirstError.Message), NotificationType.Error, 5000)
                                    )
                                )
                              Size: =11
                              Text: =fxTranslate("AllRead", "Alle gelesen")
                              Width: =118
                  - dbd_notifications_flyout_empty:
                      Control: ModernText
                      Properties:
                        Align: =Align.Center
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =RGBA(100, 116, 139, 1)
                        FillPortions: =1
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =12
                        Text: =fxTranslate("NoNewComments", "Keine neuen Kommentare.")
                        Visible: =!varDbdNotificationsLoading && IsEmpty(fxDbdNotifications)
                  - dbd_notifications_flyout_gallery:
                      Control: Gallery
                      Variant: Vertical
                      Properties:
                        AccessibleLabel: =fxTranslate("NewUpdates", "Neue Updates")
                        Items: =fxDbdNotifications
                        LayoutMinHeight: =64
                        LayoutMinWidth: =0
                        TabIndex: =0
                        TemplatePadding: =3
                        TemplateSize: =61
                        Visible: =!varDbdNotificationsLoading && !IsEmpty(fxDbdNotifications)
                        Width: =Parent.Width
                      Children:
                        - dbd_notifications_flyout_item:
                            Control: Button
                            Properties:
                              AccessibleLabel: =Substitute(fxTranslate("OpenTicketNotificationTemplate", "Benachrichtigung zu Ticket {0} öffnen"), "{0}", Text(ThisItem.TicketId))
                              Align: =Align.Left
                              Appearance: ='ButtonCanvas.Appearance'.Subtle
                              BorderColor: =RGBA(229, 231, 235, 1)
                              BorderRadius: =7
                              BorderThickness: =1
                              FontColor: =RGBA(31, 41, 55, 1)
                              FontSize: =11
                              Height: =55
                              Icon: ="ArrowRight"
                              Layout: ='ButtonCanvas.Layout'.IconAfter
                              OnSelect: |-
                                =IfError(
                                    Patch(ev_sp_list_notifications, ThisItem, {IsRead: true, ReadAt: Today()});
                                    If(!IsBlank(fxCurrentMember), Patch(ev_sp_list_config_members, fxCurrentMember, {LastNotificationRead: Now()})),
                                    Notify(fxTranslate("NotificationMarkReadFailed", "Benachrichtigung konnte nicht als gelesen markiert werden."), NotificationType.Warning, 3000)
                                );
                                Set(
                                    varCurrentTicket,
                                    LookUp(
                                        ev_sp_list_tickets,
                                        ID = ThisItem.TicketId
                                    )
                                );
                                If(
                                    IsBlank(varCurrentTicket) Or !fxCanViewCurrentTicket,
                                    Set(varCurrentTicket, Blank());
                                    Notify(fxTranslate("RelatedTicketOpenFailed", "Das zugehörige Ticket konnte nicht geöffnet werden."), NotificationType.Warning, 3000),
                                    Set(varTicketLoadedModified, varCurrentTicket.Geändert);
                                    Set(varActivityFilter, "Alle");
                                    Set(varShowNotifications, false);
                                    Navigate(ticket_details_screen, ScreenTransition.CoverRight)
                                )
                              PaddingBottom: =7
                              PaddingLeft: =10
                              PaddingRight: =10
                              PaddingTop: =7
                              Text: =Substitute(Substitute(fxTranslate("TicketNotificationTemplate", "Ticket {0} - {1}"), "{0}", Text(ThisItem.TicketId)), "{1}", Text(ThisItem.Created, "[$-de-DE]dd.mm. HH:mm")) & Char(10) & If(ThisItem.NotificationType = "Internal", fxTranslate("NewInternalNote", "Neue interne Notiz"), fxTranslate("NewTicketActivity", "Neue Ticketaktivität"))
                              VerticalAlign: =VerticalAlign.Middle
                              Width: =Parent.TemplateWidth - 6
                  - dbd_notifications_flyout_loading:
                      Control: Spinner
                      Properties:
                        AccessibleLabel: =fxTranslate("CommentsBeingLoaded", "Kommentare werden geladen")
                        AlignInContainer: =AlignInContainer.Stretch
                        FillPortions: =1
                        FontColor: =RGBA(55, 65, 81, 1)
                        Label: =fxTranslate("CommentsBeingLoaded", "Kommentare werden geladen...")
                        LabelPosition: ='Spinner.LabelPosition'.Below
                        LayoutMinHeight: =64
                        LayoutMinWidth: =0
                        SpinnerColor: =RGBA(87, 35, 129, 1)
                        Visible: =varDbdNotificationsLoading
      - dbd_loading_overlay:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =Parent.Height
            Visible: =Coalesce(varDbdRefreshing, false)
            Width: =Parent.Width
          Children:
            - dbd_loading_logo:
                Control: Image
                Properties:
                  AccessibleLabel: ="Kessel"
                  Height: =52
                  Image: ='kessel-basics-logo-primaerlogo-violett'
                  Visible: =false
                  Width: =160
                  X: =(Parent.Width - Self.Width) / 2
                  Y: =(Parent.Height - 130) / 2
            - dbd_loading_spinner:
                Control: Spinner
                Properties:
                  AccessibleLabel: =fxTranslate("DashboardBeingRefreshed", "Dashboard wird aktualisiert")
                  FontColor: =RGBA(55, 65, 81, 1)
                  Height: =60
                  Label: =fxTranslate("DashboardBeingRefreshed", "Dashboard wird aktualisiert...")
                  LabelPosition: ='Spinner.LabelPosition'.Below
                  SpinnerColor: =RGBA(87, 35, 129, 1)
                  Visible: =false
                  Width: =240
                  X: =(Parent.Width - Self.Width) / 2
                  Y: =(Parent.Height - 18) / 2
            - dbd_loading_card:
                Control: GroupContainer
                Variant: ManualLayout
                Properties:
                  BorderColor: =RGBA(225, 226, 230, 1)
                  BorderThickness: =1
                  DropShadow: =DropShadow.Regular
                  Fill: =RGBA(255, 255, 255, 1)
                  RadiusBottomLeft: =10
                  RadiusBottomRight: =10
                  RadiusTopLeft: =10
                  RadiusTopRight: =10
                  Width: =400
                  X: =(Parent.Width - Self.Width) / 2
                  Y: =(Parent.Height - Self.Height) / 2
                Children:
                  - dbd_loading_card_spinner:
                      Control: Spinner
                      Properties:
                        AccessibleLabel: =fxTranslate("DashboardBeingRefreshed", "Dashboard wird aktualisiert")
                        FontColor: =RGBA(31, 41, 55, 1)
                        Height: =62
                        Label: =fxTranslate("DashboardBeingRefreshed", "Dashboard wird aktualisiert...")
                        LabelPosition: ='Spinner.LabelPosition'.Below
                        SpinnerColor: =RGBA(87, 35, 129, 1)
                        Width: =260
                        X: =70
                        Y: =106
                  - dbd_loading_card_logo:
                      Control: Image
                      Properties:
                        AccessibleLabel: ="Kessel"
                        Height: =92
                        Image: ='kessel-basics-logo-primaerlogo-violett'
                        Width: =180
                        X: =110
